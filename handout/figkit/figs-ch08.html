/* ============================================================

.paper {

/* ============================================================
   print.css — inlined (A4 sheet layout + paginator)
   ============================================================ */
@page { size: A4; margin: 0; }
.sheet {
  position: relative; box-sizing: border-box;
  width: 210mm; height: 297mm;
  padding: 20mm 28mm 20mm 32mm;
  background: #fff; overflow: hidden;
}
.sheet-header {
  position: absolute; top: 11mm; left: 32mm; right: 28mm;
  font: 500 8.5pt "Inter", sans-serif; color: #9aa0ac; letter-spacing: .02em;
}
.sheet-footer {
  position: absolute; bottom: 8.5mm; left: 0; right: 0;
  text-align: center; font: 500 9pt "Inter", sans-serif; color: #82868f;
}
.sheet-body { height: 100%; --accent: oklch(0.50 0.13 245); }
.sheet-body.paper { box-shadow: none; border-radius: 0; max-width: none; background: #fff; }
.sheet-body .page { padding: 0; max-width: none; margin: 0; }
.sheet-body.paper { font-size: 12pt; line-height: 1.55; }
.sheet, .sheet * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.sheet-body > :first-child { margin-top: 0 !important; }
.sheet-body .sec + .sec { border-top: 0; margin-top: 0; padding-top: 0; }
.sheet-body .qed { margin-top: -1.55em; height: 1.55em; }
.sheet-body .env-body::after { display: none; content: none; }
.sheet-body .env-cont { margin-top: 0; }
.sheet-body .env-cont > .env-body > :first-child { margin-top: 0; }
@media screen {
  body { background: #6f727b; margin: 0; }
  .sheet { box-shadow: 0 3px 18px rgba(0,0,0,.3); margin: 9mm auto; }
}
@media print {
  body { background: #fff; margin: 0; }
  .sheet { box-shadow: none; margin: 0; break-after: page; }
  .sheet:last-child { break-after: auto; }
  .print-toolbar, #boot { display: none !important; }
}

   ============================================================ */

      return { layout: "single", panels: [{ svg: buildPlot({
        w: 430, h: 250, xmin: -0.15, xmax: 2.45, ymin: -0.12, ymax: 1.52,
        xlabel: "x", ylabel: "y", aria: "region under an increasing curve split at height c",
        xticks: [{ x: a, tex: "a" }, { x: b, tex: "b" }],
        yticks: [{ y: c, tex: "c" }, { y: d, tex: "d" }],
        items: [
          { type: "area", fn: f, domain: [a, b], cls: "fill-area" },
          { type: "seg", x1: a, y1: 0, x2: a, y2: c, cls: "idline" },
          { type: "seg", x1: b, y1: 0, x2: b, y2: d, cls: "idline" },
          { type: "hline", y: c, from: 0, to: b, cls: "idline" },
          { type: "hline", y: d, from: 0, to: b, cls: "idline" },
          { type: "curve", fn: f, domain: [a, b], cls: "curve" },
          { type: "seg", x1: a, y1: 0.22, x2: b, y2: 0.22, cls: "tangent" },
          { type: "seg", x1: gy, y1: ySlice, x2: b, y2: ySlice, cls: "tangent" },
          { type: "dot", x: gy, y: ySlice },
          { type: "text", x: gy - 0.04, y: ySlice + 0.1, tex: "x = g(y)", anchor: "end", size: 12 },
          { type: "text", x: 2.06, y: 1.44, tex: "y = f(x)", anchor: "start", cls: "lab-curve", size: 12 }
        ]
      }) }] };
    },

    /* §8.2 Figure 8.3 — sin²x with its midline y = 1/2 (power reduction as a picture).
       Period π (halved!), touching zeros at 0, π, 2π; midline crossings at odd multiples of π/4. */
    "sin-squared-midline": function () {
      var f = function (x) { var s = Math.sin(x); return s * s; };
      return { layout: "single", panels: [{ svg: buildPlot({
        w: 460, h: 210, xmin: -0.35, xmax: 6.75, ymin: -0.14, ymax: 1.24,
        xlabel: "x", ylabel: "y", aria: "sine squared oscillating about the midline one half",
        xticks: [{ x: Math.PI }, { x: 2 * Math.PI }],
        yticks: [{ y: 0.5, tex: "\\tfrac{1}{2}" }, { y: 1, tex: "1" }],
        items: [
          { type: "hline", y: 0.5, from: -0.1, to: 6.6, cls: "refline" },
          { type: "curve", fn: f, domain: [-0.15, 6.6], cls: "curve" },
          { type: "text", x: 2.18, y: 1.1, tex: "y = \\sin^{2}x", anchor: "start", cls: "lab-curve", size: 12 },
          { type: "text", x: 6.62, y: 0.44, tex: "y = \\tfrac{1}{2}", anchor: "end", vAnchor: "top", size: 12 }
        ]
      }) }] };
    },

    /* §8.3 Figure 8.4 — the three reference right triangles (back-substitution device).
       Side assignments verified against Strategy 8.4 rows and Ex 8.12/8.14/8.15 readings.
       θ acute = mnemonic convention; captions keep the "mnemonic" wording. */
    "trig-sub-triangles": function () {
      return { layout: "triple", panels: [
        { svg: triPanel("\\sqrt{a^{2}-x^{2}}", "x", "a"), note: "\\(x = a\\sin\\theta\\)" },
        { svg: triPanel("a", "x", "\\sqrt{a^{2}+x^{2}}"), note: "\\(x = a\\tan\\theta\\)" },
        { svg: triPanel("a", "\\sqrt{x^{2}-a^{2}}", "x"), note: "\\(x = a\\sec\\theta\\)" }
      ] };
    },

    /* §8.3 Figure 8.5 — quarter-ellipse area region; ×2 (upper half) ×2 (evenness) = ×4.
       a > b drawn (horizontal major axis); named ticks a, b with explicit tex; ghost quadrants. */
    "ellipse-quarter-area": function () {
      var a = 1.1, b = 0.7;
      var up = function (x) { return b * Math.sqrt(Math.max(0, 1 - (x * x) / (a * a))); };
      var dn = function (x) { return -up(x); };
      return { layout: "single", panels: [{ svg: buildPlot({
        w: 380, h: 250, xmin: -1.38, xmax: 1.38, ymin: -0.95, ymax: 0.95,
        xlabel: "x", ylabel: "y", aria: "ellipse with the first-quadrant quarter shaded",
        xticks: [{ x: a, label: "" }], yticks: [{ y: b, tex: "b" }],
        items: [
          { type: "area", fn: up, domain: [0, a], cls: "fill-area" },
          { type: "curve", fn: up, domain: [-a, -0.001], cls: "idline" },
          { type: "curve", fn: dn, domain: [-a, a], cls: "idline" },
          { type: "curve", fn: up, domain: [0, a], cls: "curve" },
          { type: "text", x: 0.42, y: 0.3, tex: "\\displaystyle\\int_{0}^{a}", size: 13 },
          { type: "text", x: 1.16, y: -0.13, tex: "a", anchor: "start", cls: "a-pt", size: 12 }
        ]
      }) }] };
    },

    /* §8.6 Figure 8.6 — 1/x vs 1/x² tails: same look, opposite verdicts.
       Curves meet ONLY at (1,1); 1/x on top for x>1. Nested coding: deep fill under 1/x²,
       light fill between the curves (the extra divergent mass), ghost beyond the cutoff t. */
    "tail-comparison": function () {
      var f1 = function (x) { return 1 / x; };
      var f2 = function (x) { return 1 / (x * x); };
      var t = 4;
      return { layout: "single", panels: [{ svg: buildPlot({
        w: 460, h: 235, xmin: 0.45, xmax: 6.55, ymin: -0.12, ymax: 1.22,
        xlabel: "x", ylabel: "y", aria: "one over x and one over x squared with shaded tails",
        xticks: [{ x: 1 }, { x: t, tex: "t" }], yticks: [{ y: 1 }],
        items: [
          { type: "area", fn: f2, domain: [1, t], cls: "fill-pos" },
          { type: "areaBetween", fnTop: f1, fnBot: f2, domain: [1, t], cls: "fill-aux" },
          { type: "area", fn: f1, domain: [t, 6.4], cls: "fill-ghost" },
          { type: "seg", x1: t, y1: 0, x2: t, y2: 1.18, cls: "idline" },
          { type: "curve", fn: f1, domain: [0.85, 6.4], cls: "curve-log" },
          { type: "curve", fn: f2, domain: [0.9, 6.4], cls: "curve" },
          { type: "dot", x: 1, y: 1 },
          { type: "text", x: 2.35, y: 0.52, tex: "y = \\tfrac{1}{x}", anchor: "start", size: 12 },
          { type: "text", x: 1.75, y: 0.14, tex: "y = \\tfrac{1}{x^{2}}", anchor: "start", size: 12 }
        ]
      }) }] };
    },

    /* §8.6 Figure 8.7 — Type 2 truncation for 1/√(x−2) on (2,5]: red dashed asymptote at x=2,
       solid fill on [t,5], GHOST fill (not hatch — kit-native, matches Fig 8.6's language) on the
       sliver (2,t) that the limit has not yet captured. Nothing drawn AT x=2. */
    "type2-truncation": function () {
      var f = function (x) { return 1 / Math.sqrt(x - 2); };
      var t = 2.5;
      return { layout: "single", panels: [{ svg: buildPlot({
        w: 430, h: 235, xmin: 1.45, xmax: 5.65, ymin: -0.2, ymax: 3.1,
        xlabel: "x", ylabel: "y", aria: "unbounded spike at x equals two with truncated region",
        xticks: [{ x: 2 }, { x: t, tex: "t" }, { x: 3 }, { x: 5 }], yticks: [{ y: 1 }],
        items: [
          { type: "area", fn: function (x) { return Math.min(f(x), 3.05); }, domain: [2.02, t], cls: "fill-ghost" },
          { type: "area", fn: f, domain: [t, 5], cls: "fill-area" },
          { type: "seg", x1: 2, y1: 0, x2: 2, y2: 3.06, cls: "refline" },
          { type: "curve", fn: f, domain: [2.045, 5], cls: "curve" },
          { type: "dot", x: 5, y: f(5) },
          { type: "text", x: 3.55, y: 1.02, tex: "y = \\tfrac{1}{\\sqrt{x-2}}", anchor: "start", cls: "lab-curve", size: 12 }
        ]
      }) }] };
    },

    /* §8.6 Figure 8.8 — the interior singularity of Ex 8.31: two back-to-back branches of 1/x²,
       endpoints −1 and 3 look harmless on the axis; the vertical asymptote COINCIDES with the
       y-axis (render fact: refline overlaid on the axis). Light fills only — the right half is
       proved divergent, shading must not suggest finite area. Placed AFTER the caution (D6). */
    "interior-singularity": function () {
      var f = function (x) { return 1 / (x * x); };
      return { layout: "single", panels: [{ svg: buildPlot({
        w: 450, h: 235, xmin: -1.5, xmax: 3.5, ymin: -0.25, ymax: 4.35,
        xlabel: "x", ylabel: "y", aria: "one over x squared with an interior singularity at zero",
        xticks: [{ x: -1 }, { x: 3 }], yticks: [{ y: 1 }],
        items: [
          { type: "area", fn: function (x) { return Math.min(f(x), 4.3); }, domain: [-1, -0.15], cls: "fill-ghost" },
          { type: "area", fn: function (x) { return Math.min(f(x), 4.3); }, domain: [0.15, 3], cls: "fill-ghost" },
          { type: "vline", x: 0, cls: "refline" },
          { type: "curve", fn: f, domain: [-1.35, -0.48], cls: "curve" },
          { type: "curve", fn: f, domain: [0.48, 3.4], cls: "curve" },
          { type: "dot", x: -1, y: 1 },
          { type: "dot", x: 3, y: f(3) },
          { type: "text", x: 1.55, y: 1.3, tex: "y = \\tfrac{1}{x^{2}}", anchor: "start", cls: "lab-curve", size: 12 }
        ]
      }) }] };
    },

    /* §8.6 Figure 8.9 — proof schematic for Thm 8.3: increasing F saturating toward L (below the
       ceiling M), integer sample points climbing to L, a generic t bracketed in [a+n, a+n+1].
       Shape is schematic (caption says so); F starts at (a,0), never exceeds L, L < M generic. */
    "monotone-sampling": function () {
      var a = 0.5, L = 1, M = 1.15;
      var F = function (t) { return L * (1 - Math.exp(-0.8 * (t - a))); };
      return { layout: "single", panels: [{ svg: buildPlot({
        w: 460, h: 225, xmin: -0.1, xmax: 5.85, ymin: -0.14, ymax: 1.42,
        xlabel: "t", ylabel: "y", aria: "increasing saturating accumulation function with integer samples",
        xticks: [{ x: a, tex: "a" }, { x: a + 3, tex: "a+n" }, { x: 3.9, tex: "t" }, { x: a + 4, tex: "a+n+1" }],
        yticks: [{ y: L, tex: "L" }, { y: M, tex: "M" }],
        items: [
          { type: "hline", y: M, from: 0, to: 5.7, cls: "refline" },
          { type: "hline", y: L, from: 0, to: 5.7, cls: "idline" },
          { type: "seg", x1: a + 3, y1: 0, x2: a + 3, y2: 1.3, cls: "idline" },
          { type: "seg", x1: a + 4, y1: 0, x2: a + 4, y2: 1.3, cls: "idline" },
          { type: "curve", fn: F, domain: [a, 5.7], cls: "curve" },
          { type: "dot", x: a + 1, y: F(a + 1) }, { type: "dot", x: a + 2, y: F(a + 2) },
          { type: "dot", x: a + 3, y: F(a + 3) }, { type: "dot", x: a + 4, y: F(a + 4) },
          { type: "dot", x: 3.9, y: F(3.9), hollow: true },
          { type: "text", x: 5.05, y: 0.83, tex: "y = F(t)", anchor: "start", cls: "lab-curve", size: 12 }
        ]
      }) }] };
    },

    /* §8.6 Figure 8.10 — the Comparison Theorem's trap: e^{−x²} under the finite roof of e^{−x}.
       Meeting at x=1 is TRANSVERSAL, not tangent (slopes −e^{−1} vs −2e^{−1}); window starts
       exactly at x=1 (curves cross sides for x<1). Ghost fill under the roof, deeper under subject. */
    "comparison-trap": function () {
      var roof = function (x) { return Math.exp(-x); };
      var sub = function (x) { return Math.exp(-x * x); };
      return { layout: "single", panels: [{ svg: buildPlot({
        w: 440, h: 225, xmin: 0.82, xmax: 3.32, ymin: -0.035, ymax: 0.475,
        xlabel: "x", ylabel: "y", aria: "e to the minus x squared trapped below e to the minus x",
        xticks: [{ x: 1 }, { x: 2 }, { x: 3 }], yticks: [{ y: Math.exp(-1), tex: "e^{-1}" }],
        items: [
          { type: "area", fn: roof, domain: [1, 3.25], cls: "fill-ghost" },
          { type: "area", fn: sub, domain: [1, 3.25], cls: "fill-pos" },
          { type: "curve", fn: roof, domain: [1, 3.25], cls: "curve-log" },
          { type: "curve", fn: sub, domain: [1, 3.25], cls: "curve" },
          { type: "dot", x: 1, y: Math.exp(-1) },
          { type: "text", x: 1.62, y: 0.27, tex: "y = e^{-x}", anchor: "start", size: 12 },
          { type: "text", x: 1.18, y: 0.058, tex: "y = e^{-x^{2}}", anchor: "start", size: 12 }
        ]
      }) }] };
    },

    /* §8.7 Figure 8.11 — the three rules as three pictures: SAME f = 1/x on [1,2], SAME n = 4.
       Concave-up decreasing (pinned per gate MODIFY): chords lie ABOVE the curve, matching
       Ex 8.33's sign story. Panel 3: solid parabola through the first node triple (shaded pair),
       ghost parabola through the second triple. Parabola hugs but does not coincide with 1/x. */
    "three-rules-panel": function () {
      /* Interval [1,3] (gate suggested [1,2]; widened so the chord-curve separation is VISIBLE
         at print size - n = 4 and f = 1/x kept per gate pin; deviation recorded in the fragment
         source comment). Nodes 1, 1.5, 2, 2.5, 3. */
      var f = function (x) { return 1 / x; };
      var xs = [1, 1.5, 2, 2.5, 3], ys = xs.map(f);
      var mids = [1.25, 1.75, 2.25, 2.75];
      var lin = lerpNodes(xs, ys);
      var p1 = lag3(1, f(1), 1.5, f(1.5), 2, f(2));
      var p2 = lag3(2, f(2), 2.5, f(2.5), 3, f(3));
      function base(extra) {
        return {
          w: 210, h: 175, xmin: 0.78, xmax: 3.3, ymin: -0.1, ymax: 1.2,
          xlabel: "x", ylabel: "", aria: "approximation rule panel",
          xticks: [{ x: 1 }, { x: 3 }], yticks: [],
          items: extra
        };
      }
      var pa = [];
      for (var i = 0; i < 4; i++) pa.push({ type: "rect", x1: xs[i], x2: xs[i + 1], y0: 0, y1: f(mids[i]), cls: "rect-sum" });
      pa.push({ type: "curve", fn: f, domain: [0.9, 3.2], cls: "curve" });
      var pb = [
        { type: "area", fn: lin, domain: [1, 3], cls: "fill-area" },
        { type: "seg", x1: 1.5, y1: 0, x2: 1.5, y2: lin(1.5), cls: "idline" },
        { type: "seg", x1: 2, y1: 0, x2: 2, y2: lin(2), cls: "idline" },
        { type: "seg", x1: 2.5, y1: 0, x2: 2.5, y2: lin(2.5), cls: "idline" },
        { type: "seg", x1: 1, y1: 0, x2: 1, y2: 1, cls: "idline" },
        { type: "seg", x1: 3, y1: 0, x2: 3, y2: f(3), cls: "idline" },
        { type: "curve", fn: lin, domain: [1, 3], cls: "tangent" },
        { type: "curve", fn: f, domain: [0.9, 3.2], cls: "curve" }
      ];
      var pc = [
        { type: "area", fn: p1, domain: [1, 2], cls: "fill-pos" },
        { type: "seg", x1: 1, y1: 0, x2: 1, y2: 1, cls: "idline" },
        { type: "seg", x1: 2, y1: 0, x2: 2, y2: f(2), cls: "idline" },
        { type: "curve", fn: p1, domain: [1, 2], cls: "tangent" },
        { type: "curve", fn: p2, domain: [2, 3], cls: "secant" },
        { type: "curve", fn: f, domain: [0.9, 3.2], cls: "curve" },
        { type: "dot", x: 1, y: 1 }, { type: "dot", x: 1.5, y: f(1.5) }, { type: "dot", x: 2, y: f(2) },
        { type: "dot", x: 2.5, y: f(2.5), hollow: true }, { type: "dot", x: 3, y: f(3), hollow: true }
      ];
      return { layout: "triple", panels: [
        { svg: buildPlot(base(pa)), note: "Constants at the midpoints" },
        { svg: buildPlot(base(pb)), note: "Chords at the nodes" },
        { svg: buildPlot(base(pc)), note: "Parabolas through node triples" }
      ] };
    },

    /* §8.7 Figure 8.12 — midpoint rectangle = tangent trapezoid (equal areas; the drawing shows
       the tilt, the caption states the equality). Concave-up slice: tangent below the curve away
       from the point of tangency (M underestimates, E_M > 0), chord above (T overestimates).
       Placed AFTER Ex 8.33 per gate MODIFY. */
    "midpoint-tangent-trap": function () {
      var f = function (x) { return 1 / x; };
      var x0 = 1.15, x1 = 1.85, m = 1.5, fm = f(m), sl = -1 / (m * m);
      var tl = function (x) { return fm + sl * (x - m); };
      return { layout: "single", panels: [{ svg: buildPlot({
        w: 340, h: 235, xmin: 0.98, xmax: 2.1, ymin: -0.06, ymax: 1.05,
        xlabel: "x", ylabel: "", aria: "midpoint rectangle tilted into the tangent trapezoid",
        xticks: [{ x: x0, tex: "x_{i-1}" }, { x: m, tex: "\\bar{x}_{i}" }, { x: x1, tex: "x_{i}" }],
        yticks: [],
        items: [
          { type: "rect", x1: x0, x2: x1, y0: 0, y1: fm, cls: "rect-lo" },
          { type: "areaBetween", fnTop: tl, fnBot: function (x) { return fm; }, domain: [x0, m], cls: "fill-pos" },
          { type: "areaBetween", fnTop: function (x) { return fm; }, fnBot: tl, domain: [m, x1], cls: "fill-neg" },
          { type: "seg", x1: x0, y1: tl(x0), x2: x1, y2: tl(x1), cls: "tangent" },
          { type: "seg", x1: x0, y1: f(x0), x2: x1, y2: f(x1), cls: "secant" },
          { type: "curve", fn: f, domain: [1.02, 2.04], cls: "curve" },
          { type: "dot", x: m, y: fm },
          { type: "text", x: 1.9, y: 0.63, tex: "y = \\tfrac{1}{x}", anchor: "start", cls: "lab-curve", size: 12 }
        ]
      }) }] };
    },

    /* §8.7 Figure 8.13 — Simpson on data (Ex 8.36): seven readings, three interpolating arcs
       meeting (possibly with corners) at the shared even nodes t = 60, 120; NO underlying curve
       (the truth between readings is unknown — that is the point). First triple is collinear
       (8,10,12): its "parabola" is honestly a straight segment. */
    "simpson-data-speed": function () {
      var ts = [0, 30, 60, 90, 120, 150, 180], vs = [8, 10, 12, 11, 13, 14, 12];
      var a1 = lag3(0, 8, 30, 10, 60, 12);
      var a2 = lag3(60, 12, 90, 11, 120, 13);
      var a3 = lag3(120, 13, 150, 14, 180, 12);
      var items = [
        { type: "area", fn: a1, domain: [0, 60], cls: "fill-area" },
        { type: "area", fn: a2, domain: [60, 120], cls: "fill-area" },
        { type: "area", fn: a3, domain: [120, 180], cls: "fill-area" },
        { type: "curve", fn: a1, domain: [0, 60], cls: "tangent" },
        { type: "curve", fn: a2, domain: [60, 120], cls: "tangent" },
        { type: "curve", fn: a3, domain: [120, 180], cls: "tangent" }
      ];
      for (var i = 0; i < ts.length; i++) items.push({ type: "dot", x: ts[i], y: vs[i] });
      return { layout: "single", panels: [{ svg: buildPlot({
        w: 470, h: 235, xmin: -14, xmax: 200, ymin: -1.2, ymax: 18,
        xlabel: "t\\ (\\mathrm{s})", ylabel: "v\\ (\\mathrm{m/s})", aria: "speed readings with Simpson interpolating arcs",
        xticks: [{ x: 0 }, { x: 30 }, { x: 60 }, { x: 90 }, { x: 120 }, { x: 150 }, { x: 180 }],
        yticks: [{ y: 5 }, { y: 10 }, { y: 15 }],
        items: items
      }) }] };
    }
  };

  /* ---- hydrateFigures: fills every <figure data-fig="id"> ---- */
  function hydrateFigures(root) {
    (root || document).querySelectorAll("[data-fig]").forEach(function (el) {
      var def = FIGS[el.dataset.fig];
      if (!def || el.dataset.figDone) return;
      var r = def();
      var layout = r.layout, panels = r.panels;
      var html;
      if (layout === "single" && panels.length === 1 && !panels[0].note) {
        html = '<div class="figure-art">' + panels[0].svg + '</div>';
      } else {
        var cls = { pair: "figure-art--pair", triple: "figure-art--triple", grid: "figure-art--grid" }[layout] || "";
        html = '<div class="figure-art ' + cls + '">' +
          panels.map(function (p) {
            return '<div class="fig-panel">' + p.svg + (p.note ? '<div class="fig-note">' + p.note + '</div>' : '') + '</div>';
          }).join("") + '</div>';
      }
      el.insertAdjacentHTML("afterbegin", html);
      el.dataset.figDone = "1";
    });
  }
  window.hydrateFigures = hydrateFigures;
})();
</script>

<!-- Main build script (paginator + MathJax) -->
<script>
(function () {
  function waitFor(test, tries) {
    return new Promise(function (res) {
      var i = 0;
      (function tick() {
        if (test()) return res(true);
        if (++i > tries) return res(false);
        setTimeout(tick, 150);
      })();
    });
  }
  function build() {
    var page = document.getElementById("page");
    var tpl = document.getElementById("figs-only");
    page.innerHTML = tpl ? tpl.innerHTML : "";
    if (window.hydrateFigures) window.hydrateFigures(page);
    waitFor(function () { return window.MathJax && window.MathJax.typesetPromise; }, 400)
      .then(function (ok) {
        if (!ok) { document.getElementById("boot").textContent = "MathJax load timeout"; return; }
        return MathJax.typesetPromise([page]).catch(function (e) { console.warn("mathjax", e); });
      })
      .then(function () {
        return document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      })
      .then(function () {
        // #source is off-screen (left:-10000px) in the standalone; shot.mjs skips
        // off-screen figures, so bring it into view once hydration is done.
        var src = document.getElementById("source");
        if (src) { src.style.position = "static"; src.style.left = "auto"; }
        var boot = document.getElementById("boot");
        if (boot) boot.remove();
      });
  }
  window.addEventListener("DOMContentLoaded", build);
})();
</script>
