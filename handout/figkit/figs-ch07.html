    <figcaption><span class="fig-no">Figure 7.1</span> The region between an upper curve and a lower one, cut into vertical strips. The strip’s height is the gap \(f(x_i^{*}) - g(x_i^{*})\) between the graphs, not a height above the axis, which passes through the region without playing any role.</figcaption>
  </figure>
<figure class="figure" data-fig="enclosed-lens">
    <figcaption><span class="fig-no">Figure 7.2</span> The region enclosed by \(y = x^{2}\) and \(y = 2x - x^{2}\). No vertical sides are given or needed: the two intersection points close the region by themselves, and they become the limits of integration.</figcaption>
  </figure>
<figure class="figure" data-fig="sincos-lobes">
    <figcaption><span class="fig-no">Figure 7.3</span> The two lobes between \(y = \cos x\) and \(y = \sin x\) on \([0, \pi/2]\). The roles of roof and floor swap at the crossing \(x = \pi/4\), which is why one fixed order of subtraction would cancel; the identity \(\cos x = \sin\bigl(\tfrac{\pi}{2} - x\bigr)\) makes the second lobe the mirror image of the first.</figcaption>
  </figure>
<figure class="figure" data-fig="horizontal-slice">
    <figcaption><span class="fig-no">Figure 7.4</span> The region enclosed by \(x = y^{2}\) and \(x = 2 - y^{2}\), sliced horizontally. Every horizontal strip enters on one parabola and leaves on the other, whereas a vertical strip would change character at \(x = 1\).</figcaption>
  </figure>
<figure class="figure" data-fig="slab-face">
    <figcaption><span class="fig-no">Figure 7.5</span> A solid sliced like a loaf: the slab at \(x_i^{*}\) is nearly a cylinder, a flat face of area \(A(x_i^{*})\) swept through the small thickness \(\Delta x\), here exaggerated for visibility. The solid is deliberately irregular: nothing in Definition 7.2 asks for symmetry, only for a measurable cross-section at each station between \(a\) and \(b\).</figcaption>
  </figure>
<figure class="figure" data-fig="strip-to-disk">
    <figcaption><span class="fig-no">Figure 7.6</span> The same station twice: a vertical strip of height \(f(x)\), and the thin disk it sweeps out when the region rotates about the \(x\)-axis. The disk’s radius is the function value \(f(x)\), its centre sits on the axis, and the solid extends symmetrically below the axis.</figcaption>
  </figure>
<figure class="figure" data-fig="washer-annulus">
    <figcaption><span class="fig-no">Figure 7.7</span> A washer face-on: the ring between an outer circle of radius \(R\) and an inner one of radius \(r\), both measured from the axis of rotation at the centre. Its area is the big disk minus the small one, \(\pi\bigl(R^{2} - r^{2}\bigr)\), visibly not the disk of radius \(R - r\).</figcaption>
  </figure>
<figure class="figure" data-fig="pyramid-similar">
    <figcaption><span class="fig-no">Figure 7.8</span> The pyramid sliced through its central axis: apex at the origin, base at \(x = h\). The exposed triangle carries the whole solution. The half-widths \(s(x)/2\) and \(b/2\) stand over \(x\) and \(h\) in the same ratio, and the inset shows the square cross-section of side \(s(x)\) face-on.</figcaption>
  </figure>
<figure class="figure" data-fig="shell-motivation">
    <figcaption><span class="fig-no">Figure 7.9</span> The region under \(y = 2x^{2} - x^{3}\) is awkward to describe with slices perpendicular to the axis of rotation: a horizontal strip’s two ends lie on the curve, so reading its radii means solving the cubic for \(x\). A vertical strip reads its height \(f(x)\) straight off the graph, the strip the shell method keeps.</figcaption>
  </figure>
<figure class="figure" data-fig="strip-to-shell">
    <figcaption><span class="fig-no">Figure 7.10</span> The vertical strip at distance \(x\) from the axis, swept into a thin-walled cylindrical shell: radius \(x\) read <em>radially</em> from the axis, height \(f(x)\) read from the graph, thickness \(\Delta x\) between the walls. A shallower shell sits dotted inside. The solid is built of nested tubes, not stacked slices.</figcaption>
  </figure>
<figure class="figure" data-fig="shell-unrolled">
    <figcaption><span class="fig-no">Figure 7.11</span> The shell slit open and unrolled, <em>as if</em> its curved wall lay flat: a slab of length \(2\pi\,\bar x_i\) (the circumference), height \(f(\bar x_i)\), and thickness \(\Delta x\). The picture explains where the \(2\pi\) comes from; the exact statement is the midpoint identity displayed above, not the flattening itself.</figcaption>
  </figure>
<figure class="figure" data-fig="washer-vs-shell">
    <figcaption><span class="fig-no">Figure 7.12</span> One solid, two slicings. The solid of Example 7.12 is a cylinder with a paraboloid bowl carved from its top. A horizontal slice at height \(y\) is a washer from \(\sqrt{y}\) out to \(1\); a vertical slice at radius \(x\) is a shell of height \(x^{2}\). Both decompositions must — and do — measure the same volume.</figcaption>
  </figure>
<figure class="figure" data-fig="spring-force-area">
    <figcaption><span class="fig-no">Figure 7.13</span> Hooke’s law drawn: the applied force \(F = kx\) against the stretch \(x\) beyond natural length. The work of stretching from \(a\) to \(b\) is the shaded area under the force line, accumulated strip by strip, and the strips grow taller toward \(b\), which is why the last centimetre costs the most.</figcaption>
  </figure>
<figure class="figure" data-fig="cable-slice">
    <figcaption><span class="fig-no">Figure 7.14</span> One slice of the hanging cable, at depth \(x\) below the winch. The winch carries its weight through the distance \(x\) that this slice alone must rise: slices near the bottom travel farthest and cost the most.</figcaption>
  </figure>
<figure class="figure" data-fig="tank-pump">
    <figcaption><span class="fig-no">Figure 7.15</span> The conical tank in side view: vertex at height \(0\), rim at \(4\), water to depth \(3\). The slab at height \(y\) has radius \(y/2\) by similar triangles and rises \(4 - y\) to the rim. The water surface bounds the integral at \(3\), while the rim height \(4\) enters each slab’s distance.</figcaption>
  </figure>
<figure class="figure" data-fig="levelling-rectangle">
    <figcaption><span class="fig-no">Figure 7.16</span> Levelling the region under \(y = 1 + x^{2}\) on \([-1, 2]\): the rectangle of height \(f_{\text{ave}}\) holds the same area as the region under the curve. The deficit above the curve on \([-1, 1]\) exactly balances the surplus above the lid on \([1, 2]\), so the levelling rectangle and the region hold the same area.</figcaption>
  </figure>
<figure class="figure" data-fig="polygon-refinement">
    <figcaption><span class="fig-no">Figure 7.17</span> Inscribed polygons hugging the curve. With the same horizontal spacing, chords come out long where the curve is steep and short where it is flat; doubling \(n\) keeps the old corners and visibly tightens the fit. The polygon under-measures every arc it cuts.</figcaption>
  </figure>
<figure class="figure" data-fig="mvt-chord-strip">
    <figcaption><span class="fig-no">Figure 7.18</span> One strip of the proof of Theorem 7.3. The chord is the hypotenuse over the legs \(\Delta x\) and \(\Delta y_i\), and the Mean Value Theorem supplies the interior point \(x_i^{*}\) whose tangent runs parallel to the chord, the picture of Theorem 4.12, now put to work strip by strip.</figcaption>
  </figure>
<figure class="figure" data-fig="ds-triangle">
    <figcaption><span class="fig-no">Figure 7.19</span> The differential triangle: \(ds^{2} = dx^{2} + dy^{2}\). A memory device for the proved formula of Theorem 7.3: the chord picture shrunk to a point. It is not a derivation of that formula.</figcaption>
  </figure>
<figure class="figure" data-fig="frustum-unrolled">
    <figcaption><span class="fig-no">Figure 7.20</span> The frustum band slit open and unrolled: an annular sector, not a rectangle. Its inner and outer edges keep different lengths. The dashed midline arc has length \(2\pi \bar r\), and midline times width \(\ell\) is exactly the band’s area; only the cylinder band (\(r_1 = r_2\)) unrolls into a true rectangle. A picture of the formula the cones already proved, not a second derivation.</figcaption>
  </figure>
<figure class="figure" data-fig="chord-to-band">
    <figcaption><span class="fig-no">Figure 7.21</span> Definition 7.6’s approximant made visible: one chord \(P_{i-1}P_i\) of the curve, and the frustum band it sweeps about the \(x\)-axis. The band’s slant edge <em>is</em> the chord, not the arc. Its end radii are the endpoint heights \(f(x_{i-1})\) and \(f(x_i)\), and its slant length is \(\ell = \lvert P_{i-1}P_i\rvert\).</figcaption>
  </figure>
<figure class="figure" data-fig="zone-bands">
    <figcaption><span class="fig-no">Figure 7.22</span> Two slabs of the same width \(w\) cut the sphere’s profile, one at the equator and one out toward the pole, both strictly inside \((-r, r)\). The polar arc is longer and steeper but sits at a smaller radius; the equatorial arc is shorter and flatter at a larger one. Swept about the axis, the two arcs generate zones of <em>equal</em> area: the compensation Example 7.22 computed.</figcaption>
  </figure>
<figure class="figure" data-fig="dual-axis-radius">
    <figcaption><span class="fig-no">Figure 7.23</span> One point of the arc \(y = x^{2}\), two radii: rotation about the \(x\)-axis reads the vertical distance \(f(x)\), rotation about the \(y\)-axis reads the horizontal distance \(x\). The radius is always the distance to the axis of rotation, one principle and not a memorized pair.</figcaption>
  </figure>

    "washer-annulus": function () {

    /* §7.3 Figure 7.9 — the motivating failure: region under y=2x²−x³ on [0,2]. A horizontal

    "shell-motivation": function () {

    /* §7.3 Figure 7.11 — the shell slit open and unrolled: a flat slab, length ≈ 2π x̄ᵢ (the
       circumference), height f(x̄ᵢ), thickness Δx. The unrolling is the prose's "as-if"

    "shell-unrolled": function () {
      var W = 300, H = 150;
      var x0 = 26, y0 = 118, L = 212, Ht = 56, dx = 17, dy = 9; /* front face + oblique depth */
      var spans = texLbl(x0 + L / 2, y0 + 14, "2\\pi\\,\\bar x_i", "middle", 12)

      var svg = svgOpen(W, H, "the unrolled shell: a flat slab of length two pi x bar, height f of x bar, thickness delta x")
        + '<path d="M' + x0 + ',' + y0 + ' h' + L + ' v-' + Ht + ' h-' + L + ' Z" class="rect-sum"/>'
        + '<path d="M' + x0 + ',' + (y0 - Ht) + ' l' + dx + ',-' + dy + ' h' + L + ' l-' + dx + ',' + dy + ' Z" class="fill-pos"/>'

        + '<path d="M' + x0 + ',' + y0 + ' h' + L + ' v-' + Ht + ' h-' + L + ' Z M' + x0 + ',' + (y0 - Ht) + ' l' + dx + ',-' + dy + ' h' + L + ' M' + (x0 + L + dx) + ',' + (y0 - Ht - dy) + ' v' + Ht + ' l-' + dx + ',' + dy + '" class="bubble" fill="none"/>'
        + foWrap(W, H, spans) + '</svg>';
      return { layout: "single", panels: [{ svg: svg }] };
    },

    /* §7.4 Figure 7.13 — Hooke's law force–displacement graph: F = kx through the origin;

    "spring-force-area": function () {

    /* §7.4 Figure 7.14 — the hanging cable: one slice at depth x below the winch, thickness Δx,

        + '<line x1="' + cxC + '" y1="' + yTop + '" x2="' + cxC + '" y2="' + yBot + '" class="curve"/>'
        + '<line x1="' + cxC + '" y1="' + yBot + '" x2="' + cxC + '" y2="' + yBot + '" class="curve"/>'
        + '<rect x="' + (cxC - 5.5) + '" y="' + (ySl - th / 2) + '" width="11" height="' + th + '" class="rect-lo"/>'
        + '<line x1="' + (cxC + 33) + '" y1="' + ySl + '" x2="' + (cxC + 33) + '" y2="' + (yTop + 5) + '" class="axis" marker-end="url(#cbl-a)"/>'
        + '<defs><marker id="cbl-a" markerWidth="8" markerHeight="8" refX="5.4" refY="2.8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L5.4,2.8 L0,5.6" fill="none" stroke="var(--c-axis)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>'
        + foWrap(W, H, spans) + '</svg>';
      return { layout: "single", panels: [{ svg: svg }] };
    },

    /* §7.4 Figure 7.15 — the conical tank, side view: vertex at y=0 (bottom), rim at y=4,

          { type: "text", x: 0.06, y: -0.3, text: "0", anchor: "start", size: 11 },
          { type: "text", x: 1.95, y: 3, text: "3", anchor: "start", size: 11, dx: 6 },
          { type: "text", x: 2.12, y: 4, text: "4", anchor: "start", size: 11, dx: 6 },
          { type: "text", x: 1.05, y: (yS + 4) / 2, tex: "4 - y", anchor: "start", size: 12, dx: 15 },
          { type: "text", x: 0.42, y: 1.97, tex: "y/2", size: 11 },

    /* §7.5 Figure 7.16 — the levelling rectangle: f(x)=1+x² on [−1,2] with the lid at the
       average height 2; deficit (lid above curve, on [−1,1]) and surplus (curve above lid,
       on [1,2]) shaded in CONTRASTING tones — equal areas; crossings at x=±1 where f = f_ave
       (the left crossing sits at the interval's left endpoint = the rectangle's top-left
       corner). y-window includes f(2)=5. */
    "levelling-rectangle": function () {
      var f = function (x) { return 1 + x * x; };
      return { layout: "single", panels: [{ svg: buildPlot({
        w: 270, h: 250, xmin: -1.55, xmax: 2.62, ymin: -0.75, ymax: 5.55,
        aria: "the graph of one plus x squared over minus one to two with the mean height rectangle of height two: deficit and surplus regions shaded, equal in area",
        xticks: [{ x: -1, tex: "-1" }, { x: 1, tex: "1" }, { x: 2, tex: "2" }],
        yticks: [{ y: 2, tex: "2" }, { y: 5, tex: "5" }],
        items: [
          { type: "areaBetween", fnTop: function () { return 2; }, fnBot: f, domain: [-1, 1] },
          { type: "areaBetween", fnTop: f, fnBot: function () { return 2; }, domain: [1, 2], cls: "fill-neg" },
          { type: "rect", x1: -1, x2: 2, y0: 0, y1: 2, cls: "rect-hi" },
          { type: "curve", fn: f, domain: [-1.38, 2.1] },
          { type: "dot", x: -1, y: 2 }, { type: "dot", x: 1, y: 2 },
          { type: "text", x: 2.18, y: 2, tex: "f_{\\text{ave}}", anchor: "start", size: 12 },
          { type: "text", x: -1.45, y: 3.3, tex: "y = 1 + x^{2}", anchor: "start", size: 12 }
        ] }) }] };
    },

    /* §7.6 Figure 7.17 — inscribed polygon refinement (pair): the same single-bend curve with
       4 chords, then 8 (old nodes kept: n doubles). Chord endpoints ON the curve at REGULAR
       x-spacing (so chord lengths differ: long where steep, short where flat — the stretch
       factor pre-taught for free). Polygon strictly inside the bend (concave-down window). */
    "polygon-refinement": function () {
      var f = function (x) { var u = (x - 2) / 2.2; return 2.42 * Math.sqrt(Math.max(0, 1 - u * u)); };
      function panel(n) {
        var a = 0.1, b = 3.9, dx = (b - a) / n;
        var items = [{ type: "curve", fn: f, domain: [a, b] }];
        for (var i = 0; i < n; i++) {
          items.push({ type: "seg", x1: a + i * dx, y1: f(a + i * dx), x2: a + (i + 1) * dx, y2: f(a + (i + 1) * dx), cls: "axis" });
        }
        for (var j = 0; j <= n; j++) {
          items.push({ type: "dot", x: a + j * dx, y: f(a + j * dx), r: 2.1 });
        }
        return buildPlot({ w: 235, h: 165, xmin: -0.25, xmax: 4.3, ymin: -0.3, ymax: 2.8,
          aria: "an arch-shaped curve with an inscribed polygon of " + n + " chords", items: items });
      }
      return { layout: "pair", panels: [
        { svg: panel(4), note: "\\(n = 4\\)" },
        { svg: panel(8), note: "\\(n = 8\\)" }
      ] };
    },

    /* §7.6 Figure 7.18 — one strip of the arc length proof, blown up: run Δx, rise Δy_i, the
       chord as hypotenuse; the Mean Value Theorem point x_i* strictly interior, its tangent
       segment PARALLEL to the chord. Labels only Δx, Δy_i, x_i* (label economy). */
    "mvt-chord-strip": function () {
      var f = function (x) { return 1.05 + 1.5 * Math.sin(0.9 * (x - 0.55)); };
      var x0 = 1, x1 = 3, xs = 2.038; /* f'(xs) = chord slope ≈ 0.31 */
      var m = (f(x1) - f(x0)) / (x1 - x0);
      return { layout: "single", panels: [{ svg: buildPlot({
        w: 275, h: 205, xmin: 0.45, xmax: 3.75, ymin: 1.05, ymax: 3.0, axes: false,
        aria: "one strip of the arc length proof: chord as hypotenuse over legs delta x and delta y, with the mean value theorem point's tangent parallel to the chord",
        items: [
          { type: "seg", x1: x0, y1: f(x0), x2: x1, y2: f(x0), cls: "idline" },
          { type: "seg", x1: x1, y1: f(x0), x2: x1, y2: f(x1), cls: "idline" },
          { type: "seg", x1: x0, y1: f(x0), x2: x1, y2: f(x1), cls: "axis" },
          { type: "seg", x1: xs - 0.55, y1: f(xs) - 0.55 * m, x2: xs + 0.55, y2: f(xs) + 0.55 * m, cls: "refline" },
          { type: "curve", fn: f, domain: [0.68, 3.2] },
          { type: "dot", x: x0, y: f(x0) }, { type: "dot", x: x1, y: f(x1) },
          { type: "dot", x: xs, y: f(xs) },
          { type: "text", x: (x0 + x1) / 2, y: f(x0), tex: "\\Delta x", size: 12, dy: 13 },
          { type: "text", x: x1, y: (f(x0) + f(x1)) / 2, tex: "\\Delta y_i", anchor: "start", size: 12, dx: 8 },
          { type: "text", x: xs - 0.12, y: f(xs), tex: "x_i^{*}", size: 12, dy: -17 }
        ] }) }] };
    },

    /* §7.6 Figure 7.19 — the ds right triangle: legs dx and dy, hypotenuse ds. Standalone
       schematic — no axes, no scale (the caption states its MNEMONIC status: a memory device
       for the proved Theorem 7.3, not a derivation). Right-angle mark at the dx–dy corner. */
    "ds-triangle": function () {
      var W = 185, H = 130;
      var Ax = 30, Ay = 102, Bx = 152, By = 102, Cy = 30; /* right angle at B */
      var spans = texLbl((Ax + Bx) / 2, Ay + 13, "dx", "middle", 13)
                + texLbl(Bx + 10, (By + Cy) / 2, "dy", "start", 13)
                + texLbl((Ax + Bx) / 2 - 8, (Ay + Cy) / 2 - 10, "ds", "middle", 13);
      var svg = svgOpen(W, H, "right triangle with legs d x and d y and hypotenuse d s")
        + '<line x1="' + Ax + '" y1="' + Ay + '" x2="' + Bx + '" y2="' + By + '" class="axis"/>'
        + '<line x1="' + Bx + '" y1="' + By + '" x2="' + Bx + '" y2="' + Cy + '" class="axis"/>'
        + '<line x1="' + Ax + '" y1="' + Ay + '" x2="' + Bx + '" y2="' + Cy + '" class="curve"/>'
        + '<path d="M' + (Bx - 11) + ',' + By + ' v-11 h11" fill="none" class="bubble"/>'
        + foWrap(W, H, spans) + '</svg>';
      return { layout: "single", panels: [{ svg: svg }] };
    },

    /* §7.7 Figure 7.20 — the frustum band slit open and unrolled: an ANNULAR SECTOR, not a
       rectangle (inner and outer arcs differ — the curvature is the point; the r₁=r₂ cylinder
       special case unrolls to a rectangle instead). Midline arc 2π r̄ dashed; width ℓ at one
       radial end. Caption: visualization of the compression reading, not a re-derivation. */
    "frustum-unrolled": function () {
      var W = 290, H = 175;
      var cx = 145, cy = -78, rIn = 168, rOut = 218, rMid = 193;
      var a1 = 62 * Math.PI / 180, a2 = 118 * Math.PI / 180;
      function pt(r, a) { return [(cx + r * Math.cos(a)).toFixed(1), (cy + r * Math.sin(a)).toFixed(1)]; }
      var o1 = pt(rOut, a1), o2 = pt(rOut, a2), i1 = pt(rIn, a1), i2 = pt(rIn, a2);
      var m1 = pt(rMid, a1), m2 = pt(rMid, a2);
      var spans = texLbl(cx, cy + rMid + 11, "2\\pi\\,\\bar r", "middle", 13)
                + texLbl(parseFloat(o2[0]) - 1, (parseFloat(o2[1]) + parseFloat(i2[1])) / 2 - 8, "\\ell", "end", 13);
      var svg = svgOpen(W, H, "the unrolled frustum band: an annular sector with midline arc two pi r bar and width ell")
        + '<path d="M' + o1.join(',') + ' A' + rOut + ',' + rOut + ' 0 0,1 ' + o2.join(',') + ' L' + i2.join(',') + ' A' + rIn + ',' + rIn + ' 0 0,0 ' + i1.join(',') + ' Z" class="fill-area"/>'
        + '<path d="M' + o1.join(',') + ' A' + rOut + ',' + rOut + ' 0 0,1 ' + o2.join(',') + ' L' + i2.join(',') + ' A' + rIn + ',' + rIn + ' 0 0,0 ' + i1.join(',') + ' Z" class="bubble" fill="none"/>'
        + '<path d="M' + m1.join(',') + ' A' + rMid + ',' + rMid + ' 0 0,1 ' + m2.join(',') + '" class="idline" fill="none"/>'
        + foWrap(W, H, spans) + '</svg>';
      return { layout: "single", panels: [{ svg: svg }] };
    },

    /* ============ 2.5D solid-of-revolution figures (wave 2) ============
       Pattern per the Codex-converged design (ch07_25d-pattern-codex-audit.md):
       axis-relative parallel-oblique glyph, ellipse minor:major = 0.35 with the major
       semiaxis ⊥ the rotation axis = the true radius; x-axis scenes horizontal (profile
       above), y-axis scenes upright (profile to the right); front/lower arcs solid, rear/
       upper arcs dashed; exposed cut faces = full solid outline + light fill; stations on
       the rotation axis only for along-axis stacking, shell radii as radial arrows;
       stroke hierarchy: profile 2.2 / swept silhouette 1.5 / rims 1.25 / hidden dashed /
       axis dash-dot; red never a depth cue. */

    /* §7.2 Figure 7.5 — GENERIC solid (NOT of revolution: irregular kidney sections, no
       mirror symmetry, no axis of rotation drawn) with end planes x=a, x=b and ONE
       highlighted slab at x_i*: front face A(x_i*) lightly filled with a few hatches,
       Δx bracket outside; x-direction dimension line BELOW the figure (not an axis). */
    "slab-face": function () {
      var W = 300, H = 185;
      var spans = texLbl(63, 172, "a", "middle", 12)
                + texLbl(157, 172, "x_i^{*}", "middle", 12)
                + texLbl(243, 172, "b", "middle", 12)
                + texLbl(196, 52, "A(x_i^{*})", "start", 12)
                + texLbl(157, 34, "\\Delta x", "middle", 11);
      var svg = svgOpen(W, H, "a generic solid between two end planes with one thin slab highlighted, its planar face marked A of x i star")
        /* body outline: irregular loaf, top and bottom contours deliberately unrelated */
        + '<path d="M63,105 C70,70 105,52 150,56 C195,60 232,50 246,78 C258,100 250,126 232,136 C200,152 150,158 112,150 C82,144 58,132 63,105 Z" class="bubble" fill="none" stroke-width="1.6"/>'
        /* end plane x=a (oblique parallelogram, gray) */
        + '<path d="M63,105 C60,88 62,74 70,66 L82,59 C74,70 72,86 75,102 Z" class="fill-area" stroke="var(--c-axis)" stroke-width="1.1"/>'
        /* end plane x=b */
        + '<path d="M246,78 C252,96 250,116 240,128 L228,134 C238,120 240,98 234,82 Z" class="fill-area" stroke="var(--c-axis)" stroke-width="1.1"/>'
        /* slab: two close parallel cuts; front face = irregular kidney, filled + hatched */
        + '<path d="M150,56 C168,58 178,74 176,96 C174,120 166,140 148,148 C138,140 134,116 136,94 C138,74 142,60 150,56 Z" class="fill-pos" stroke="var(--c-primary)" stroke-width="1.4"/>'
        + '<path d="M163,58 C179,62 188,78 186,98 C184,120 176,138 160,146" fill="none" class="bubble"/>'
        + '<line x1="146" y1="80" x2="168" y2="84" class="axis" stroke-width="0.9"/>'
        + '<line x1="143" y1="102" x2="167" y2="106" class="axis" stroke-width="0.9"/>'
        + '<line x1="144" y1="124" x2="164" y2="126" class="axis" stroke-width="0.9"/>'
        /* Δx bracket above the slab (hugging its top edge) */
        + '<path d="M148,50 v-5 h17 v5" fill="none" class="axis"/>'
        /* leader from A(x_i*) label to the face */
        + '<line x1="193" y1="55" x2="168" y2="76" class="axis" stroke-width="0.9"/>'
        /* x-direction dimension line below (NOT an axis: plain, end bars, three ticks) */
        + '<line x1="50" y1="162" x2="258" y2="162" class="axis"/>'
        + '<line x1="63" y1="158" x2="63" y2="166" class="axis"/>'
        + '<line x1="157" y1="158" x2="157" y2="166" class="axis"/>'
        + '<line x1="243" y1="158" x2="243" y2="166" class="axis"/>'

    },

    /* §7.2 Figure 7.6 — strip → disk (pair). Left: the flat strip under y=f(x). Right: the
       same station after rotation about the x-axis — the solid's silhouette (profile above,
       mirror below, 1.5px), end rims, and the disk = FULL filled ellipse centred on the
       axis, extending below it; radius f(x) arrow, Δx on the slab thickness. */
    "strip-to-disk": function () {
      var f = function (x) { return 1.12 + 0.42 * Math.sin(1.25 * x - 0.35); };
      var left = buildPlot({
        w: 225, h: 175, xmin: -0.15, xmax: 4.35, ymin: -0.4, ymax: 1.95,
        aria: "a region under a curve with one vertical strip at station x",
        xlabel: "x",
        xticks: [{ x: 2.2, tex: "x" }],
        items: [
          { type: "area", fn: f, domain: [0.5, 3.5] },
          { type: "rect", x1: 2.09, x2: 2.31, y0: 0, y1: f(2.2), cls: "rect-lo" },
          { type: "curve", fn: f, domain: [0.5, 3.5] },
          { type: "text", x: 2.62, y: 0.62, tex: "f(x)", anchor: "start", size: 11 }
        ] });
      /* right: oblique swept solid, horizontal axis */
      var W = 225, H = 175, cy = 92;
      var X = function (x) { return 18 + (x - 0.2) * 50; };   /* plot-x -> px */
      var RY = function (v) { return v * 46; };                /* radius -> px (major, vertical) */
      var K = 0.35;                                            /* ellipse aspect */
      function profPath(sgn) {
        var d = "";
        for (var i = 0; i <= 60; i++) { var x = 0.5 + 3.0 * i / 60; d += (i ? "L" : "M") + X(x).toFixed(1) + "," + (cy - sgn * RY(f(x))).toFixed(1) + " "; }
        return d.trim();
      }
      var xs = 2.2, pxs = X(xs), rs = RY(f(xs)), rk = K * rs, thick = 11;
      var r0 = RY(f(0.5)), r1 = RY(f(3.5));
      var arrX = pxs + thick / 2;
      var spans = texLbl(pxs - rk - 4, cy - rs / 2, "f(x)", "end", 11)
                + texLbl(pxs + thick / 2, cy - rs - 16, "\\Delta x", "middle", 11);
      var right = svgOpen(W, H, "the same strip swept about the x axis into a thin disk inside the solid of revolution")
        + '<line x1="6" y1="' + cy + '" x2="' + (W - 8) + '" y2="' + cy + '" class="idline"/>'
        + '<path d="' + profPath(1) + '" class="curve" stroke-width="1.5" fill="none"/>'
        + '<path d="' + profPath(-1) + '" class="curve" stroke-width="1.5" fill="none"/>'
        + '<ellipse cx="' + X(0.5) + '" cy="' + cy + '" rx="' + (K * r0).toFixed(1) + '" ry="' + r0.toFixed(1) + '" class="bubble" fill="none"/>'
        + '<ellipse cx="' + X(3.5) + '" cy="' + cy + '" rx="' + (K * r1).toFixed(1) + '" ry="' + r1.toFixed(1) + '" class="bubble" fill="none"/>'
        /* the disk: thin slab = two ellipses + filled band, full solid outline (exposed cut) */
        + '<ellipse cx="' + (pxs + thick) + '" cy="' + cy + '" rx="' + rk.toFixed(1) + '" ry="' + rs.toFixed(1) + '" class="fill-pos" stroke="var(--c-primary)" stroke-width="1.25"/>'
        + '<rect x="' + pxs + '" y="' + (cy - rs) + '" width="' + thick + '" height="' + (2 * rs) + '" fill="none" stroke="none"/>'
        + '<path d="M' + pxs + ',' + (cy - rs) + ' l' + thick + ',0 M' + pxs + ',' + (cy + rs) + ' l' + thick + ',0" class="bubble"/>'
        + '<ellipse cx="' + pxs + '" cy="' + cy + '" rx="' + rk.toFixed(1) + '" ry="' + rs.toFixed(1) + '" class="fill-pos" stroke="var(--c-primary)" stroke-width="1.25"/>'
        /* radius arrow from the axis to the disk's top rim, drawn AT the station (inside the disk) */
        + '<line x1="' + arrX + '" y1="' + cy + '" x2="' + arrX + '" y2="' + (cy - rs + 1.5) + '" class="axis" marker-end="url(#std-a)"/>'
        /* Δx bracket above the disk */
        + '<path d="M' + pxs + ',' + (cy - rs - 6) + ' v-4 h' + thick + ' v4" fill="none" class="axis"/>'
        + '<defs><marker id="std-a" markerWidth="8" markerHeight="8" refX="5.4" refY="2.8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L5.4,2.8 L0,5.6" fill="none" stroke="var(--c-axis)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>'
        + foWrap(W, H, spans) + '</svg>';
      return { layout: "pair", panels: [
        { svg: left, note: "Strip" },
        { svg: right, note: "Disk" }
      ] };
    },

    /* §7.2 Figure 7.8 — pyramid, 2D through-axis fallback (per the pattern consult): apex at

    "pyramid-similar": function () {

          { type: "seg", x1: 4.1, y1: 1.5, x2: 4.26, y2: 1.5, cls: "axis" },
          { type: "dot", x: 0, y: 0, r: 2.4 },
          { type: "text", x: 2.72, y: 0.45, tex: "s(x)/2", anchor: "start", size: 11 },
          { type: "text", x: 4.28, y: 0.75, tex: "b/2", anchor: "start", size: 11 },
          { type: "seg", x1: 0, y1: -1.95, x2: 2.4, y2: -1.95, cls: "axis" },

          { type: "text", x: 1.2, y: -1.95, tex: "x", size: 11, dy: -10 },
          { type: "seg", x1: 0, y1: -2.42, x2: 4, y2: -2.42, cls: "axis" },
          { type: "seg", x1: 4, y1: -2.32, x2: 4, y2: -2.52, cls: "axis" },
          { type: "seg", x1: 0, y1: -2.32, x2: 0, y2: -2.52, cls: "axis" },
          { type: "text", x: 3.2, y: -2.42, tex: "h", size: 11, dy: 14 },
          /* inset square: width compensates the unequal axis scales (0.9 y-units ≈ 30.7px, so the
             x-width must be 0.9·(34.14/43.36) ≈ 0.709 units for the RENDERED shape to be square —
             the caption's whole claim; caught by the D1–D8 gate as a D5 blocking) */
          { type: "rect", x1: -0.5, x2: 0.209, y0: 1.3, y1: 2.2, cls: "rect-hi" },
          { type: "text", x: -0.145, y: 1.05, tex: "s(x)", size: 11 }

    },

    /* §7.3 Figure 7.10 — strip → shell (upright, y-axis vertical per the pattern): the
       vertical strip at radial distance x sweeps a thin-walled cylindrical shell; radius as
       a RADIAL arrow from the axis (not a station tick), Δx between the two walls; one
       smaller nested shell dotted gray. Front/lower arcs solid, rear/upper dashed. */
    "strip-to-shell": function () {
      var W = 285, H = 205, cx = 128, K = 0.35;
      var d = 92, half = 6, topY = 56, botY = 172;
      var rIn = d - half, rOut = d + half;
      function rimPair(rx, cyE, cls, dashTop) {
        var ry = (K * rx).toFixed(1);
        var right = (cx + rx).toFixed(1), leftp = (cx - rx).toFixed(1);
        var front = '<path d="M' + leftp + ',' + cyE + ' A' + rx + ',' + ry + ' 0 0,0 ' + right + ',' + cyE + '" fill="none" class="' + cls + '"/>';
        var rear = '<path d="M' + leftp + ',' + cyE + ' A' + rx + ',' + ry + ' 0 0,1 ' + right + ',' + cyE + '" fill="none" class="' + (dashTop || "idline") + '"/>';
        return front + rear;
      }
      var spans = texLbl(cx + d * 0.62, 106 + 13, "x", "middle", 12)
                + texLbl(cx + rOut + 7, (topY + botY) / 2, "f(x)", "start", 12)
                + texLbl(cx + d, 25, "\\Delta x", "middle", 11);
      var svg = svgOpen(W, H, "a vertical strip at distance x from the upright axis swept into a thin cylindrical shell, with one smaller shell nested inside")
        + '<line x1="' + cx + '" y1="14" x2="' + cx + '" y2="' + (botY + 18) + '" class="idline"/>'
        /* nested smaller shell (gray dotted): walls + top rim */
        + '<line x1="' + (cx - 48) + '" y1="' + (topY + 26) + '" x2="' + (cx - 48) + '" y2="' + botY + '" class="bubble" stroke-dasharray="2 3"/>'
        + '<line x1="' + (cx + 48) + '" y1="' + (topY + 26) + '" x2="' + (cx + 48) + '" y2="' + botY + '" class="bubble" stroke-dasharray="2 3"/>'
        + '<ellipse cx="' + cx + '" cy="' + (topY + 26) + '" rx="48" ry="' + (K * 48).toFixed(1) + '" fill="none" class="bubble" stroke-dasharray="2 3"/>'
        /* main shell walls (outer + inner) */
        + '<line x1="' + (cx - rOut) + '" y1="' + topY + '" x2="' + (cx - rOut) + '" y2="' + botY + '" class="curve" stroke-width="1.5"/>'
        + '<line x1="' + (cx + rOut) + '" y1="' + topY + '" x2="' + (cx + rOut) + '" y2="' + botY + '" class="curve" stroke-width="1.5"/>'
        + '<line x1="' + (cx - rIn) + '" y1="' + topY + '" x2="' + (cx - rIn) + '" y2="' + botY + '" class="curve" stroke-width="1.25"/>'
        + '<line x1="' + (cx + rIn) + '" y1="' + topY + '" x2="' + (cx + rIn) + '" y2="' + botY + '" class="curve" stroke-width="1.25"/>'
        /* top rims: outer + inner (front solid, rear dashed) */
        + rimPair(rOut, topY, "curve")
        + rimPair(rIn, topY, "curve")
        /* base front arcs */
        + '<path d="M' + (cx - rOut) + ',' + botY + ' A' + rOut + ',' + (K * rOut).toFixed(1) + ' 0 0,0 ' + (cx + rOut) + ',' + botY + '" fill="none" class="bubble"/>'
        /* highlighted strip (the generator) on the right wall */
        + '<rect x="' + (cx + rIn) + '" y="' + topY + '" width="' + (2 * half) + '" height="' + (botY - topY) + '" class="rect-lo"/>'
        /* radius arrow from the axis to the shell mid-surface */
        + '<line x1="' + cx + '" y1="106" x2="' + (cx + d - 2) + '" y2="106" class="axis" marker-end="url(#sts-a)"/>'
        /* Δx bracket above the strip (clear of the rear rim arc) */
        + '<path d="M' + (cx + rIn) + ',37 v-4 h' + (2 * half) + ' v4" fill="none" class="axis"/>'
        + '<defs><marker id="sts-a" markerWidth="8" markerHeight="8" refX="5.4" refY="2.8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L5.4,2.8 L0,5.6" fill="none" stroke="var(--c-axis)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>'
        + foWrap(W, H, spans) + '</svg>';
      return { layout: "single", panels: [{ svg: svg }] };
    },

    /* §7.3 Figure 7.12 — the SAME solid sliced both ways (pair; same base geometry, only the
       overlay changes). Base: the solid from rotating {0≤x≤1, 0≤y≤x²} about the y-axis =
       cylinder of radius 1 with a paraboloid bowl carved from the top. Left overlay: one
       horizontal washer at height y (outer 1, inner √y — exposed cut, full solid outlines).
       Right overlay: one vertical shell at radius x, height x². No numeric answer printed. */
    "washer-vs-shell": function () {
      var W = 225, H = 195, cx = 112, K = 0.35;
      var R = 78, botY = 158, topY = 66;
      function base() {
        var s = '<line x1="' + cx + '" y1="16" x2="' + cx + '" y2="' + (botY + 16) + '" class="idline"/>'
          + '<line x1="' + (cx - R) + '" y1="' + topY + '" x2="' + (cx - R) + '" y2="' + botY + '" class="curve" stroke-width="1.5"/>'
          + '<line x1="' + (cx + R) + '" y1="' + topY + '" x2="' + (cx + R) + '" y2="' + botY + '" class="curve" stroke-width="1.5"/>'
          /* top rim of the cylinder */
          + '<path d="M' + (cx - R) + ',' + topY + ' A' + R + ',' + (K * R).toFixed(1) + ' 0 0,0 ' + (cx + R) + ',' + topY + '" fill="none" class="curve" stroke-width="1.25"/>'
          + '<path d="M' + (cx - R) + ',' + topY + ' A' + R + ',' + (K * R).toFixed(1) + ' 0 0,1 ' + (cx + R) + ',' + topY + '" fill="none" class="idline"/>'
          /* base front arc */
          + '<path d="M' + (cx - R) + ',' + botY + ' A' + R + ',' + (K * R).toFixed(1) + ' 0 0,0 ' + (cx + R) + ',' + botY + '" fill="none" class="bubble"/>';
        /* carved paraboloid: interior profile curves from the rim down to the centre bottom */
        var dL = "M" + (cx - R) + "," + topY + " ", dR = "M" + (cx + R) + "," + topY + " ";
        for (var i = 1; i <= 24; i++) {
          var t = i / 24, xr = R * (1 - t);            /* radius shrinks */
          var py = topY + (botY - topY) * (1 - (xr / R) * (xr / R));
          dL += "L" + (cx - xr).toFixed(1) + "," + py.toFixed(1) + " ";
          dR += "L" + (cx + xr).toFixed(1) + "," + py.toFixed(1) + " ";
        }
        return s + '<path d="' + dL.trim() + '" fill="none" class="curve" stroke-width="1.5"/>'
                 + '<path d="' + dR.trim() + '" fill="none" class="curve" stroke-width="1.5"/>';
      }
      /* washer overlay at height y=0.55: py, inner radius √0.55 */
      var yw = 0.55, pyw = botY + (topY - botY) * yw, rw = R * Math.sqrt(yw);
      var washer = '<path d="M' + (cx - R) + ',' + pyw + ' A' + R + ',' + (K * R).toFixed(1) + ' 0 0,0 ' + (cx + R) + ',' + pyw + ' A' + R + ',' + (K * R).toFixed(1) + ' 0 0,1 ' + (cx - R) + ',' + pyw + ' Z M' + (cx - rw).toFixed(1) + ',' + pyw + ' A' + rw.toFixed(1) + ',' + (K * rw).toFixed(1) + ' 0 0,0 ' + (cx + rw).toFixed(1) + ',' + pyw + ' A' + rw.toFixed(1) + ',' + (K * rw).toFixed(1) + ' 0 0,1 ' + (cx - rw).toFixed(1) + ',' + pyw + ' Z" fill-rule="evenodd" class="fill-pos"/>'
        + '<ellipse cx="' + cx + '" cy="' + pyw + '" rx="' + R + '" ry="' + (K * R).toFixed(1) + '" fill="none" stroke="var(--c-primary)" stroke-width="1.25"/>'
        + '<ellipse cx="' + cx + '" cy="' + pyw + '" rx="' + rw.toFixed(1) + '" ry="' + (K * rw).toFixed(1) + '" fill="none" stroke="var(--c-primary)" stroke-width="1.25"/>';
      var spansA = texLbl(cx + R + 6, pyw - 8, "1", "start", 11)
                 + texLbl(cx + rw - 4, pyw + 0.35 * rw + 10, "\\sqrt{y}", "start", 11);
      /* shell overlay at radius x=0.7: height x²=0.49 */
      var xsh = 0.7, dsh = R * xsh, halfsh = 5, hsh = (botY - topY) * xsh * xsh;
      var shellTop = botY - hsh;
      var shell = '<rect x="' + (cx + dsh - halfsh).toFixed(1) + '" y="' + shellTop.toFixed(1) + '" width="' + (2 * halfsh) + '" height="' + hsh.toFixed(1) + '" class="rect-lo"/>'
        + '<line x1="' + (cx - dsh + halfsh).toFixed(1) + '" y1="' + shellTop.toFixed(1) + '" x2="' + (cx - dsh + halfsh).toFixed(1) + '" y2="' + botY + '" class="curve" stroke-width="1.25"/>'
        + '<path d="M' + (cx - dsh).toFixed(1) + ',' + shellTop.toFixed(1) + ' A' + dsh.toFixed(1) + ',' + (K * dsh).toFixed(1) + ' 0 0,0 ' + (cx + dsh).toFixed(1) + ',' + shellTop.toFixed(1) + '" fill="none" class="curve" stroke-width="1.25"/>'
        + '<path d="M' + (cx - dsh).toFixed(1) + ',' + shellTop.toFixed(1) + ' A' + dsh.toFixed(1) + ',' + (K * dsh).toFixed(1) + ' 0 0,1 ' + (cx + dsh).toFixed(1) + ',' + shellTop.toFixed(1) + '" fill="none" class="idline"/>'
        + '<line x1="' + cx + '" y1="' + (botY - 14) + '" x2="' + (cx + dsh - halfsh - 1).toFixed(1) + '" y2="' + (botY - 14) + '" class="axis" marker-end="url(#wvs-a)"/>';
      var spansB = texLbl(cx + dsh / 2, botY - 14 + 11, "x", "middle", 11)
                 + texLbl(cx + dsh + halfsh + 5, shellTop + hsh / 2, "x^{2}", "start", 11);
      var svgA = svgOpen(W, H, "the solid sliced by one horizontal washer at height y") + base() + washer + foWrap(W, H, spansA) + '</svg>';
      var svgB = svgOpen(W, H, "the same solid sliced by one vertical cylindrical shell at radius x") + base() + shell
        + '<defs><marker id="wvs-a" markerWidth="8" markerHeight="8" refX="5.4" refY="2.8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L5.4,2.8 L0,5.6" fill="none" stroke="var(--c-axis)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>'
        + foWrap(W, H, spansB) + '</svg>';
      return { layout: "pair", panels: [
        { svg: svgA, note: "Washers" },
        { svg: svgB, note: "Shells" }
      ] };
    },

    /* §7.7 Figure 7.21 — chord → frustum band (pair). Left: the curve with ONE chord
       P_{i−1}P_i. Right: the chord swept about the x-axis into a frustum band — lateral
       surface only (rims open, no caps), the near generator IS the slanted chord, r1 ≠ r2. */
    "chord-to-band": function () {
      var f = function (x) { return 1.6 - 0.34 * (x - 1.9) * (x - 1.9); };
      var x1 = 0.95, x2 = 2.55;
      var left = buildPlot({
        w: 225, h: 165, xmin: 0.1, xmax: 3.6, ymin: -0.3, ymax: 1.95,
        aria: "a curve with one chord between two marked points, the chord visibly below the arc",
        xticks: [{ x: x1, tex: "x_{i-1}" }, { x: x2, tex: "x_i" }],
        items: [
          { type: "seg", x1: x1, y1: 0, x2: x1, y2: f(x1), cls: "idline" },
          { type: "seg", x1: x2, y1: 0, x2: x2, y2: f(x2), cls: "idline" },
          { type: "curve", fn: f, domain: [0.45, 3.3] },
          { type: "seg", x1: x1, y1: f(x1), x2: x2, y2: f(x2), cls: "axis" },
          { type: "dot", x: x1, y: f(x1) }, { type: "dot", x: x2, y: f(x2) }
        ] });
      var W = 225, H = 165, cy = 88, K = 0.35;
      var px1 = 62, px2 = 148, r1 = 46, r2 = 62;
      var spans = texLbl((px1 + px2) / 2 + 4, cy - (r1 + r2) / 2 - 12, "\\ell", "middle", 12);
      var right = svgOpen(W, H, "the chord swept about the x axis into a frustum band: two open rims of different radii joined by the slanted chord")
        + '<line x1="10" y1="' + cy + '" x2="' + (W - 10) + '" y2="' + cy + '" class="idline"/>'
        /* lateral surface fill: near-half rims + generators */
        + '<path d="M' + px1 + ',' + (cy - r1) + ' L' + px2 + ',' + (cy - r2) + ' A' + (K * r2).toFixed(1) + ',' + r2 + ' 0 0,1 ' + px2 + ',' + (cy + r2) + ' L' + px1 + ',' + (cy + r1) + ' A' + (K * r1).toFixed(1) + ',' + r1 + ' 0 0,0 ' + px1 + ',' + (cy - r1) + ' Z" class="fill-area"/>'
        /* rims: near halves solid, far halves dashed (open ends — no caps) */
        + '<path d="M' + px1 + ',' + (cy - r1) + ' A' + (K * r1).toFixed(1) + ',' + r1 + ' 0 0,0 ' + px1 + ',' + (cy + r1) + '" fill="none" class="curve" stroke-width="1.25"/>'
        + '<path d="M' + px1 + ',' + (cy - r1) + ' A' + (K * r1).toFixed(1) + ',' + r1 + ' 0 0,1 ' + px1 + ',' + (cy + r1) + '" fill="none" class="idline"/>'
        + '<path d="M' + px2 + ',' + (cy - r2) + ' A' + (K * r2).toFixed(1) + ',' + r2 + ' 0 0,0 ' + px2 + ',' + (cy + r2) + '" fill="none" class="curve" stroke-width="1.25"/>'
        + '<path d="M' + px2 + ',' + (cy - r2) + ' A' + (K * r2).toFixed(1) + ',' + r2 + ' 0 0,1 ' + px2 + ',' + (cy + r2) + '" fill="none" class="idline"/>'
        /* generators: near (top) = THE chord, emphasized; far (bottom) lighter */
        + '<line x1="' + px1 + '" y1="' + (cy - r1) + '" x2="' + px2 + '" y2="' + (cy - r2) + '" class="curve"/>'
        + '<line x1="' + px1 + '" y1="' + (cy + r1) + '" x2="' + px2 + '" y2="' + (cy + r2) + '" class="curve" stroke-width="1.5"/>'
        + '<circle cx="' + px1 + '" cy="' + (cy - r1) + '" r="2.6" class="dot"/>'
        + '<circle cx="' + px2 + '" cy="' + (cy - r2) + '" r="2.6" class="dot"/>'
        + foWrap(W, H, spans) + '</svg>';
      return { layout: "pair", panels: [
        { svg: left, note: "Chord" },
        { svg: right, note: "Frustum band" }
      ] };
    },

    /* §7.7 Figure 7.22 — sphere zones of equal width (2D profile per the pattern consult):
       circle + horizontal axis; two pairs of vertical cuts of the SAME width w — one
       straddling the equator, one near (but strictly off) the pole; the two cut PROFILE
       ARCS emphasized; vertical radius guides to each arc's midpoint. No areas printed. */
    "zone-bands": function () {
      var W = 265, H = 205, cx = 125, cy = 103, R = 88;
      function arcPath(xa, xb) {
        var ya = -Math.sqrt(R * R - xa * xa), yb = -Math.sqrt(R * R - xb * xb);
        return 'M' + (cx + xa).toFixed(1) + ',' + (cy + ya).toFixed(1) + ' A' + R + ',' + R + ' 0 0,1 ' + (cx + xb).toFixed(1) + ',' + (cy + yb).toFixed(1) + '';
      }
      function cut(xo) {
        var yv = Math.sqrt(R * R - xo * xo);
        return '<line x1="' + (cx + xo) + '" y1="' + (cy - yv - 8).toFixed(1) + '" x2="' + (cx + xo) + '" y2="' + (cy + 14).toFixed(1) + '" class="idline"/>';
      }
      var w = 30, e1 = -15, e2 = 15, p1 = 50, p2 = 80;
      var me = 0, mp = 65;
      var rye = Math.sqrt(R * R - me * me), ryp = Math.sqrt(R * R - mp * mp);
      var spans = texLbl(cx + (e1 + e2) / 2, cy + 26, "w", "middle", 12)
                + texLbl(cx + (p1 + p2) / 2, cy + 26, "w", "middle", 12);
      var svg = svgOpen(W, H, "a circle profile of the sphere with two vertical slabs of equal width, one at the equator and one near the pole, their upper arcs emphasized")
        + '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" class="bubble" fill="none" stroke-width="1.6"/>'
        + '<line x1="' + (cx - R - 16) + '" y1="' + cy + '" x2="' + (cx + R + 16) + '" y2="' + cy + '" class="idline"/>'
        + cut(e1) + cut(e2) + cut(p1) + cut(p2)
        + '<path d="' + arcPath(e1, e2) + '" fill="none" class="curve" stroke-width="2.6"/>'
        + '<path d="' + arcPath(p1, p2) + '" fill="none" class="curve" stroke-width="2.6"/>'
        /* vertical radius guides to each emphasized arc's midpoint */
        + '<line x1="' + (cx + me) + '" y1="' + cy + '" x2="' + (cx + me) + '" y2="' + (cy - rye).toFixed(1) + '" class="bubble" stroke-dasharray="2 3"/>'
        + '<line x1="' + (cx + mp) + '" y1="' + cy + '" x2="' + (cx + mp) + '" y2="' + (cy - ryp).toFixed(1) + '" class="bubble" stroke-dasharray="2 3"/>'
        /* equal-width brackets below the axis */
        + '<path d="M' + (cx + e1) + ',' + (cy + 18) + ' v4 h' + w + ' v-4" fill="none" class="axis"/>'
        + '<path d="M' + (cx + p1) + ',' + (cy + 18) + ' v4 h' + w + ' v-4" fill="none" class="axis"/>'
        + foWrap(W, H, spans) + '</svg>';
      return { layout: "single", panels: [{ svg: svg }] };
    },

    /* §7.7 Figure 7.23 — dual-axis radius readout: the arc y=x² with ONE sample point and TWO
       radius arrows from it — vertical distance f(x) to the x-axis, horizontal distance x to
       the y-axis. Radius = distance to THE axis of rotation; sample point strictly inside. */
    "dual-axis-radius": function () {
      var f = function (x) { return x * x; };
      var xs = 0.72;
      return { layout: "single", panels: [{ svg: buildPlot({
        w: 250, h: 215, xmin: -0.24, xmax: 1.32, ymin: -0.2, ymax: 1.22,
        aria: "the arc y equals x squared with one point and two radius arrows: down to the x axis and across to the y axis",
        xticks: [{ x: 1, tex: "1" }],
        yticks: [{ y: 1, tex: "1" }],
        items: [
          { type: "curve", fn: f, domain: [0, 1.05] },
          { type: "arrow", x1: xs, y1: f(xs), x2: xs, y2: 0.015 },
          { type: "arrow", x1: xs, y1: f(xs), x2: 0.012, y2: f(xs) },
          { type: "dot", x: xs, y: f(xs) },
          { type: "text", x: xs, y: f(xs) / 2, tex: "f(x)", anchor: "start", size: 12, dx: 7 },
          { type: "text", x: xs / 2, y: f(xs), tex: "x", size: 12, dy: -11 },
          { type: "text", x: 1.09, y: 0.92, tex: "y = x^{2}", anchor: "start", size: 12 }
        ] }) }] };
    }

  };

  /* ---- hydrateFigures: fills every <figure data-fig="id"> ---- */
  function hydrateFigures(root) {
    (root || document).querySelectorAll("[data-fig]").forEach(function (el) {
      var def = FIGS[el.dataset.fig];
      if (!def || el.dataset.figDone) return;
      var r = def();
      var layout = r.layout, panels = r.panels;
      var html;
      if (layout === "single" && panels.length === 1 && !panels[0].note) {
        html = '<div class="figure-art">' + panels[0].svg + '</div>';
      } else {
        var cls = { pair: "figure-art--pair", triple: "figure-art--triple", grid: "figure-art--grid" }[layout] || "";
        html = '<div class="figure-art ' + cls + '">' +
          panels.map(function (p) {
            return '<div class="fig-panel">' + p.svg + (p.note ? '<div class="fig-note">' + p.note + '</div>' : '') + '</div>';
          }).join("") + '</div>';
      }
      el.insertAdjacentHTML("afterbegin", html);
      el.dataset.figDone = "1";
    });
  }
  window.hydrateFigures = hydrateFigures;
})();
</script>

<!-- Main build script (paginator + MathJax) -->
<script>
(function () {
  function waitFor(test, tries) {
    return new Promise(function (res) {
      var i = 0;
      (function tick() {
        if (test()) return res(true);
        if (++i > tries) return res(false);
        setTimeout(tick, 150);
      })();
    });
  }
  function build() {
    var page = document.getElementById("page");
    var tpl = document.getElementById("figs-only");
    page.innerHTML = tpl ? tpl.innerHTML : "";
    if (window.hydrateFigures) window.hydrateFigures(page);
    waitFor(function () { return window.MathJax && window.MathJax.typesetPromise; }, 400)
      .then(function (ok) {
        if (!ok) { document.getElementById("boot").textContent = "MathJax load timeout"; return; }
        return MathJax.typesetPromise([page]).catch(function (e) { console.warn("mathjax", e); });
      })
      .then(function () {
        return document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      })
      .then(function () {
        var boot = document.getElementById("boot");
        if (boot) boot.remove();
      });
  }
  window.addEventListener("DOMContentLoaded", build);
})();
</script>
