<style>
/* ============================================================
   skin-hs.css — inlined + modified: Times New Roman + MathJax

.paper {

  background: var(--paper);

}

.skin-hs .env {

.skin-hs .env-proof .env-kicker {

}

.skin-hs .workedexample {

}
.skin-hs .workedexample .env { margin: .7em 0; padding-left: 0; border-left: 0; }

.skin-hs > .env-cont, .skin-hs > .env-example, .skin-hs > .env-solution { display: flow-root; }

}
.skin-hs .env-strategy {
  --accent: var(--a-strategy);
  background: color-mix(in srgb, var(--a-strategy) 7%, var(--paper));

}

.skin-hs.vivid .env { border-left-color: color-mix(in srgb, var(--accent) 70%, var(--paper)); border-left-width: 3px; }
.skin-hs.vivid .workedexample { border-left-color: color-mix(in srgb, var(--a-practice) 70%, var(--paper)); border-left-width: 3px; }

/* ============================================================
   print.css — inlined (A4 sheet layout + paginator)
   ============================================================ */
@page { size: A4; margin: 0; }
.sheet {
  position: relative; box-sizing: border-box;
  width: 210mm; height: 297mm;
  padding: 20mm 28mm 20mm 32mm;
  background: #fff; overflow: hidden;
}
.sheet-header {
  position: absolute; top: 11mm; left: 32mm; right: 28mm;
  font: 500 8.5pt "Inter", sans-serif; color: #9aa0ac; letter-spacing: .02em;
}
.sheet-footer {
  position: absolute; bottom: 8.5mm; left: 0; right: 0;
  text-align: center; font: 500 9pt "Inter", sans-serif; color: #82868f;
}
.sheet-body { height: 100%; --accent: oklch(0.50 0.13 245); }
.sheet-body.paper { box-shadow: none; border-radius: 0; max-width: none; background: #fff; }
.sheet-body .page { padding: 0; max-width: none; margin: 0; }
.sheet-body.paper { font-size: 12pt; line-height: 1.55; }
.sheet, .sheet * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.sheet-body > :first-child { margin-top: 0 !important; }
.sheet-body .sec + .sec { border-top: 0; margin-top: 0; padding-top: 0; }
.sheet-body .qed { margin-top: -1.55em; height: 1.55em; }
.sheet-body .env-body::after { display: none; content: none; }
.sheet-body .env-cont { margin-top: 0; }
.sheet-body .env-cont > .env-body > :first-child { margin-top: 0; }
.sheet-body .split-unit > :first-child { margin-top: 0; }
.sheet-body .split-unit > :last-child { margin-bottom: 0; }
@media screen {
  body { background: #6f727b; margin: 0; }
  .sheet { box-shadow: 0 3px 18px rgba(0,0,0,.3); margin: 9mm auto; }
}
@media print {
  body { background: #fff; margin: 0; }
  .sheet { box-shadow: none; margin: 0; break-after: page; }
  .sheet:last-child { break-after: auto; }
  .print-toolbar, #boot { display: none !important; }
}

/* ============================================================
   page-level
   ============================================================ */
.print-toolbar {
  position: fixed; top: 14px; right: 16px; z-index: 1000;

}

<script>
(function () {
  var uid = 0;
  var PI = Math.PI;
  function piTex(v) {
    var map = {};
    map[(-2 * PI).toFixed(4)] = "-2\\pi";
    map[(-PI).toFixed(4)] = "-\\pi";
    map[(-PI / 2).toFixed(4)] = "-\\tfrac{\\pi}{2}";
    map[(PI / 2).toFixed(4)] = "\\tfrac{\\pi}{2}";
    map[PI.toFixed(4)] = "\\pi";
    map[(2 * PI).toFixed(4)] = "2\\pi";
    map[(0).toFixed(4)] = "0";
    var hit = map[v.toFixed(4)];
    if (hit != null) return hit;
    if (Math.abs(v - Math.round(v)) < 1e-9) return String(Math.round(v)); // plain integers
    return undefined;
  }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
  function anchorTransform(anchor, vAnchor) {
    var tx = anchor === "start" ? "0" : anchor === "end" ? "-100%" : "-50%";
    var ty = vAnchor === "top" ? "0" : vAnchor === "bottom" ? "-100%" : "-50%";

    var iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
    var SX = function(x) { return pad.l + ((x - xmin) / (xmax - xmin)) * iw; };
    var SY = function(y) { return h - pad.b - ((y - ymin) / (ymax - ymin)) * ih; };
    var id = "pl" + (++uid);
    var parts = [], labels = [];
    function pushLabel(o) { labels.push(o); }
    parts.push('<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:' + w + 'px" class="fig-svg" role="img" aria-label="' + esc(cfg.aria || "graph") + '" preserveAspectRatio="xMidYMid meet">');
    parts.push('<defs><marker id="' + id + 'a" markerWidth="8" markerHeight="8" refX="5.4" refY="2.8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L5.4,2.8 L0,5.6" fill="none" stroke="var(--c-axis)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>');
    if (cfg.axes !== false) {
      var x0 = Math.min(Math.max(0, xmin), xmax), y0 = Math.min(Math.max(0, ymin), ymax);
      var ax0 = SX(xmin), ax1 = SX(xmax), ayBase = SY(y0);
      parts.push('<path d="M' + ax0.toFixed(1) + ',' + ayBase.toFixed(1) + ' H' + (ax1 - 1).toFixed(1) + '" class="axis" marker-end="url(#' + id + 'a)"/>');
      var ay0 = SY(ymin), ay1 = SY(ymax), axBase = SX(x0);
      parts.push('<path d="M' + axBase.toFixed(1) + ',' + ay0.toFixed(1) + ' V' + (ay1 + 1).toFixed(1) + '" class="axis" marker-end="url(#' + id + 'a)"/>');
      if (cfg.xlabel) pushLabel({ px: ax1 + 1, py: ayBase + 4, tex: cfg.xlabel, anchor: "start", vAnchor: "top", cls: "a-ax", size: 13 });
      if (cfg.ylabel) pushLabel({ px: axBase - 5, py: ay1 + 1, tex: cfg.ylabel, anchor: "end", vAnchor: "top", cls: "a-ax", size: 13 });

        var tex = t.tex != null ? t.tex : (t.label != null ? null : piTex(t.x));
        if (tex != null) pushLabel({ px: px, py: ayBase + 6, tex: tex, anchor: "middle", vAnchor: "top", cls: "a-pt", size: 12 });
        else if (t.label != null) pushLabel({ px: px, py: ayBase + 6, text: t.label, anchor: "middle", vAnchor: "top", cls: "a-pt", size: 12 });
      });
      (cfg.yticks || []).forEach(function(t) {
        var py = SY(t.y);
        parts.push('<line x1="' + (axBase - 3).toFixed(1) + '" y1="' + py.toFixed(1) + '" x2="' + (axBase + 3).toFixed(1) + '" y2="' + py.toFixed(1) + '" class="axis"/>');
        var tex = t.tex != null ? t.tex : (t.label != null ? null : piTex(t.y));

        parts.push('<line x1="' + SX(it.x).toFixed(1) + '" y1="' + SY(ymin).toFixed(1) + '" x2="' + SX(it.x).toFixed(1) + '" y2="' + SY(ymax).toFixed(1) + '" class="' + (it.cls || "refline") + '"/>');

        parts.push('<line x1="' + SX(ha).toFixed(1) + '" y1="' + SY(it.y).toFixed(1) + '" x2="' + SX(hb).toFixed(1) + '" y2="' + SY(it.y).toFixed(1) + '" class="' + (it.cls || "refline") + '"/>');
      } else if (it.type === "seg") {
        parts.push('<line x1="' + SX(it.x1).toFixed(1) + '" y1="' + SY(it.y1).toFixed(1) + '" x2="' + SX(it.x2).toFixed(1) + '" y2="' + SY(it.y2).toFixed(1) + '" class="' + (it.cls || "curve") + '"/>');
      } else if (it.type === "dot") {
        var r = it.r || 3.0;
        if (it.hollow) parts.push('<circle cx="' + SX(it.x).toFixed(1) + '" cy="' + SY(it.y).toFixed(1) + '" r="' + r + '" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/>');
        else parts.push('<circle cx="' + SX(it.x).toFixed(1) + '" cy="' + SY(it.y).toFixed(1) + '" r="' + r + '" class="dot"/>');
      } else if (it.type === "arrow") {
        parts.push('<line x1="' + SX(it.x1).toFixed(1) + '" y1="' + SY(it.y1).toFixed(1) + '" x2="' + SX(it.x2).toFixed(1) + '" y2="' + SY(it.y2).toFixed(1) + '" class="axis" marker-end="url(#' + id + 'a)"/>');
      } else if (it.type === "text") {
        pushLabel({ px: SX(it.x), py: SY(it.y), tex: it.tex, text: it.tex == null ? it.text : null, anchor: it.anchor || "middle", vAnchor: it.vAnchor || "middle", dx: it.dx || 0, dy: it.dy || 0, cls: it.cls || "a-pt", size: it.size });
      }
    });
    if (labels.length) {
      var M = 52;
      var spans = labels.map(function(L) {
        var left = (L.px + (L.dx || 0) + M).toFixed(1);
        var top = (L.py + (L.dy || 0) + M).toFixed(1);

        var fs = L.size ? "font-size:" + L.size + "px;" : "";

})();

      var f = function (x) { return 0.1 * x * x + 0.5; };

      var qxs = [7, 5, 3];                        // Q₁ farthest, Q₃ closest
      var slopes = qxs.map(function (qx) { return (f(qx) - fc) / (qx - c); });
      //  slopes = [0.8, 0.6, 0.4] — evenly spaced fan

      var xL = -0.3, xR = 8.5;
      var items = [
        // --- secant lines (dashed, extend as full lines) ---
        { type: "curve", fn: function (x) { return fc + slopes[0] * (x - c); },
          domain: [xL, xR], samples: 10, cls: "refline" },
        { type: "curve", fn: function (x) { return fc + slopes[1] * (x - c); },
          domain: [xL, xR], samples: 10, cls: "refline" },

        { type: "dot", x: 3, y: f(3), r: 2.5 },

        // --- Q labels (above-right of each dot) ---

      };
    },

    "f-and-fprime": () => {
      var f  = function (x) { return x * x + 4 * x - 2; };
      var fp = function (x) { return 2 * x + 4; };
      var dom = [-6.4, 2.4];
      var common = { w: 460, xmin: -6.8, xmax: 2.8, xlabel: "x", ylabel: "y" };

      // --- top panel: f ---
      var top = buildPlot(Object.assign({}, common, {
        h: 250, ymin: -8, ymax: 14,
        xticks: [{ x: -2, tex: "-2" }],
        aria: "Graph of f(x)=x^2+4x-2, a parabola with its minimum at x=-2 where f=-6.",
        items: [
          { type: "vline", x: -2, cls: "refline" },
          { type: "curve", fn: f, domain: dom, samples: 200, cls: "curve" },
          { type: "dot", x: -2, y: -6, r: 3 },
          { type: "text", x: 2.45, y: 12, tex: "y\\!=\\!f(x)", cls: "a-curve", anchor: "start" },
          { type: "text", x: -2.35, y: -6, tex: "\\text{min}", cls: "a-pt", anchor: "end" },
        ],
      }));

      // --- bottom panel: f' (same horizontal scale as the top) ---
      var bot = buildPlot(Object.assign({}, common, {
        h: 210, ymin: -9, ymax: 9,
        xticks: [{ x: -2, tex: "-2" }],
        aria: "Graph of f'(x)=2x+4, a line crossing zero at x=-2; negative to the left, positive to the right.",
        items: [
          { type: "vline", x: -2, cls: "refline" },
          { type: "curve", fn: fp, domain: dom, samples: 12, cls: "curve" },
          { type: "dot", x: -2, y: 0, r: 3 },
          { type: "text", x: 2.45, y: 7, tex: "y\\!=\\!f'(x)", cls: "a-curve", anchor: "start" },
          { type: "text", x: -5.6, y: -4.5, tex: "f'<0", cls: "a-pt", anchor: "start" },
          { type: "text", x: -1.4, y: 4.5, tex: "f'>0", cls: "a-pt", anchor: "start" },
        ],
      }));

      return { layout: "stack", panels: [{ svg: top + bot }] };
    },

    /* §2.4 — e^x is its own derivative: tangent lines at x=0 and x=1
       showing that slope = function value at each point. */
    "exp-self-derivative": () => {
      var e1 = Math.exp(1);
      return {
        layout: "single",
        panels: [{
          svg: buildPlot({
            w: 400, h: 300, xmin: -2, xmax: 3, ymin: -1, ymax: 8.5,
            xlabel: "x", ylabel: "y",
            aria: "Graph of y equals e to the x with tangent lines at x equals 0 and x equals 1, showing that the slope at each point equals the function value.",
            xticks: [{ x: 1, tex: "1" }],
            yticks: [{ y: 1, tex: "1" }, { y: e1, tex: "e" }],
            items: [
              { type: "curve", fn: (x) => Math.exp(x), domain: [-1.8, 2.15], samples: 200, cls: "curve" },
              { type: "curve", fn: (x) => x + 1, domain: [-1.3, 1.5], cls: "refline" },
              { type: "curve", fn: (x) => e1 * x, domain: [0, 2.5], cls: "refline" },
              { type: "dot", x: 0, y: 1 },
              { type: "dot", x: 1, y: e1 },
              { type: "text", x: 2.5, y: 7.8, tex: "y=e^{x}", cls: "a-curve", anchor: "start" },
              { type: "text", x: -1.3, y: 0.2, tex: "\\text{slope}=1=e^{0}", cls: "a-ref", anchor: "start" },
              { type: "text", x: 1.8, y: 5.2, tex: "\\text{slope}=e=e^{1}", cls: "a-ref", anchor: "start" },
            ],
          }),
        }],
      };
    },

    /* §2.5 — f(x)=x/(x²+1) and its derivative, stacked.
       Top: f with horizontal tangents at x=±1. Bottom: f' with zeros
       at ±1 and f'(0)=1, confirming Example 2.16's sanity check. */
    "quotient-example-graph": () => {
      var f = function (x) { return x / (x * x + 1); };
      var fp = function (x) { return (1 - x * x) / Math.pow(x * x + 1, 2); };
      var dom = [-4.5, 4.5];
      var common = { w: 420, xmin: -5, xmax: 5, xlabel: "x" };

      var top = buildPlot(Object.assign({}, common, {
        h: 200, ymin: -0.65, ymax: 0.65, ylabel: "y",
        xticks: [{ x: -1, tex: "-1" }, { x: 1, tex: "1" }],
        yticks: [{ y: 0.5, tex: "\\tfrac{1}{2}" }, { y: -0.5, tex: "-\\tfrac{1}{2}" }],
        aria: "Graph of f(x) = x over (x squared plus 1), with horizontal tangents at x = plus or minus 1.",
        items: [
          { type: "curve", fn: f, domain: dom, samples: 300, cls: "curve" },
          { type: "dot", x: 1, y: 0.5 },
          { type: "dot", x: -1, y: -0.5 },
          { type: "hline", y: 0.5, from: 0.5, to: 1.5, cls: "refline" },
          { type: "hline", y: -0.5, from: -1.5, to: -0.5, cls: "refline" },
          { type: "text", x: 4.2, y: -0.3, tex: "f(x)=\\tfrac{x}{x^{2}+1}", cls: "a-curve", anchor: "end" },
        ],
      }));

      var bot = buildPlot(Object.assign({}, common, {
        h: 200, ymin: -0.5, ymax: 1.2, ylabel: "y",
        xticks: [{ x: -1, tex: "-1" }, { x: 1, tex: "1" }],
        aria: "Graph of f prime of x equals (1 minus x squared) over (x squared plus 1) squared, zero at x = plus or minus 1.",
        items: [
          { type: "curve", fn: fp, domain: dom, samples: 300, cls: "curve" },
          { type: "dot", x: 1, y: 0 },
          { type: "dot", x: -1, y: 0 },
          { type: "text", x: 4.2, y: 0.6, tex: "f'(x)=\\tfrac{1-x^{2}}{(x^{2}+1)^{2}}", cls: "a-curve", anchor: "end" },
          { type: "text", x: 0.3, y: 1.1, tex: "f'(0)=1", cls: "a-pt", anchor: "start" },
        ],
      }));

      return { layout: "stack", panels: [{ svg: top + bot }] };
    },

    /* §2.3 (enrichment) — f(x)=∛x: vertical tangent at the origin (Example 2.12).
       S-shaped curve through the origin (solid dot — f(0) exists); secant lines
       from the origin steepen toward vertical as Q→0 (slope→∞), so f'(0) does not
       exist — a non-corner failure of differentiability (contrast Figure 2.3). */
    "cbrt-vertical-tangent": () => {
      var f = function (x) { return Math.cbrt(x); };
      var sec = function (qx) {
        var m = f(qx) / qx;
        return { type: "curve", fn: function (x) { return m * x; }, domain: [-4.5, 4.5], samples: 6, cls: "refline" };
      };
      var items = [
        sec(2.6), sec(1.0), sec(0.35),
        { type: "curve", fn: f, domain: [-4.5, 4.5], samples: 260, cls: "curve" },
        { type: "dot", x: 0, y: 0, r: 3.5 },
        { type: "dot", x: 2.6, y: f(2.6), r: 2.2 },
        { type: "dot", x: 1.0, y: f(1.0), r: 2.2 },
        { type: "dot", x: 0.35, y: f(0.35), r: 2.2 },
        { type: "text", x: 3.4, y: f(3.4) + 0.2, tex: "y=\\sqrt[3]{x}", cls: "a-curve", anchor: "start" },
        { type: "text", x: -0.25, y: 1.62, tex: "\\text{vertical tangent}", cls: "a-ref", anchor: "end", size: 12 },
        { type: "text", x: -0.25, y: 1.18, tex: "(\\text{slope} \\to \\infty)", cls: "a-ref", anchor: "end", size: 12 },
      ];
      return { layout: "single", panels: [{ svg: buildPlot({
        w: 420, h: 290, xmin: -4.5, xmax: 4.5, ymin: -1.9, ymax: 1.9,
        xlabel: "x", ylabel: "y",
        aria: "Graph of y equals cube root of x, an S-shaped curve through the origin with a vertical tangent there; secant lines from the origin steepen toward vertical as the second point approaches the origin, so the derivative at zero does not exist.",
        items: items,
      }) }] };
    },

    /* §2.1 (enrichment) — anatomy of the difference quotient (h-form + Caution).
       One secant from P=(a,f(a)) to Q=(a+h,f(a+h)); the run leg h and the rise
       leg f(a+h)-f(a) make slope = rise/run visible and cement that the
       numerator is f(a+h)-f(a), not f(h). */
    "difference-quotient-anatomy": () => {
      var f = function (x) { return 0.2 * x * x + 0.5; };
      var a = 1.5, h = 2.5, b = a + h;
      var fa = f(a), fb = f(b);
      var m = (fb - fa) / h;
      var items = [
        { type: "curve", fn: f, domain: [0.1, 5.05], samples: 200, cls: "curve" },
        { type: "curve", fn: function (x) { return fa + m * (x - a); }, domain: [0.85, 4.7], samples: 6, cls: "arrow-bwd" },
        { type: "seg", x1: a, y1: fa, x2: b, y2: fa, cls: "refline" },
        { type: "seg", x1: b, y1: fa, x2: b, y2: fb, cls: "refline" },
        { type: "dot", x: a, y: fa, r: 3.2 },
        { type: "dot", x: b, y: fb, r: 3.2 },
        { type: "text", x: a - 0.12, y: fa - 0.34, tex: "P", cls: "a-pt", anchor: "end" },
        { type: "text", x: b + 0.15, y: fb + 0.08, tex: "Q", cls: "a-pt", anchor: "start" },
        { type: "text", x: (a + b) / 2, y: fa - 0.36, tex: "h", cls: "a-ref", anchor: "middle" },
        { type: "text", x: b + 0.18, y: (fa + fb) / 2, tex: "f(a+h)-f(a)", cls: "a-ref", anchor: "start", size: 12 },
        { type: "text", x: 1.05, y: 4.15, tex: "y=f(x)", cls: "a-curve", anchor: "start" },
      ];
      return { layout: "single", panels: [{ svg: buildPlot({
        w: 440, h: 300, xmin: -0.3, xmax: 6, ymin: -0.3, ymax: 5,
        xlabel: "x", ylabel: "y",
        xticks: [{ x: a, tex: "a" }, { x: b, tex: "a+h" }],
        aria: "A curve y equals f of x with a secant line from P at (a, f of a) to Q at (a plus h, f of a plus h); a horizontal leg labeled h and a vertical leg labeled f of a plus h minus f of a form the run and rise whose ratio is the slope of the secant.",
        items: items,
      }) }] };
    },

  };

  /* ---- hydrateFigures: fills every <figure data-fig="id"> ---- */
  function hydrateFigures(root) {
    (root || document).querySelectorAll("[data-fig]").forEach(function (el) {
      var def = FIGS[el.dataset.fig];
      if (!def || el.dataset.figDone) return;
      var r = def();
      var layout = r.layout, panels = r.panels;
      var html;
      if (layout === "single" && panels.length === 1 && !panels[0].note) {
        html = '<div class="figure-art">' + panels[0].svg + '</div>';
      } else {
        var cls = { pair: "figure-art--pair", triple: "figure-art--triple", grid: "figure-art--grid" }[layout] || "";
        html = '<div class="figure-art ' + cls + '">' +
          panels.map(function (p) {
            return '<div class="fig-panel">' + p.svg + (p.note ? '<div class="fig-note">' + p.note + '</div>' : '') + '</div>';
          }).join("") + '</div>';
      }
      el.insertAdjacentHTML("afterbegin", html);
      el.dataset.figDone = "1";
    });
  }
  window.hydrateFigures = hydrateFigures;
})();
</script>

<!-- Main build script (paginator + MathJax) -->
<script>
(function () {
  function waitFor(test, tries) {
    return new Promise(function (res) {
      var i = 0;
      (function tick() {
        if (test()) return res(true);
        if (++i > tries) return res(false);
        setTimeout(tick, 150);
      })();
    });
  }
  function build() {
    var page = document.getElementById("page");
    var tpl = document.getElementById("figs-only");
    page.innerHTML = tpl ? tpl.innerHTML : "";
    if (window.hydrateFigures) window.hydrateFigures(page);
    waitFor(function () { return window.MathJax && window.MathJax.typesetPromise; }, 400)
      .then(function (ok) {
        if (!ok) { document.getElementById("boot").textContent = "MathJax load timeout"; return; }
        return MathJax.typesetPromise([page]).catch(function (e) { console.warn("mathjax", e); });
      })
      .then(function () {
        return document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      })
      .then(function () {
        // #source is off-screen (left:-10000px) in the standalone; shot.mjs skips
        // off-screen figures, so bring it into view once hydration is done.
        var src = document.getElementById("source");
        if (src) { src.style.position = "static"; src.style.left = "auto"; }
        var boot = document.getElementById("boot");
        if (boot) boot.remove();
      });
  }
  window.addEventListener("DOMContentLoaded", build);
})();
</script>
