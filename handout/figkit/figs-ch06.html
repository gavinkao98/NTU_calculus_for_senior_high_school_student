<figure class="figure" data-fig="riemann-lr-x2">
    <figcaption><span class="fig-no">Figure 6.1</span> Approximating the area under \(y = x^{2}\) on \([0, 1]\) with four equal strips. Reading each rectangle’s height at the <em>left</em> endpoint (left panel) keeps every rectangle below the curve, so \(L_{4} = \tfrac{7}{32}\) underestimates; reading it at the <em>right</em> endpoint (right panel) lifts every rectangle above the curve, so \(R_{4} = \tfrac{15}{32}\) overestimates. The true area is trapped between.</figcaption>
  </figure>
<figure class="figure" data-fig="refinement-rn-x2">
    <figcaption><span class="fig-no">Figure 6.2</span> Refining the right endpoint sum for \(y = x^{2}\) on \([0, 1]\). With \(n = 4, 8, 16\) strips the rectangles overshoot the curve on every strip, but by less and less as \(n\) grows, so the overestimates close in on the true area from above.</figcaption>
  </figure>

    },

    /* §6.3 Figure 6.6 — the accumulation function g(x)=∫ₐˣ f and the added sliver
       (FTC-1 anchor). f>0; the area from a to x is shaded (fill-area) as g(x); nudging
       x by h appends a thin strip [x,x+h] (rect-sum) of width h and height ≈ f(x), so g
       gains about f(x)·h. The strip is drawn WIDE (not to scale) so it is visible. Axis
       ticks a, x, x+h. Schematic f, no y-values (label economy). */
    "accumulation-sliver": () => {
      const f = (t) => 1 + 0.45 * t - 0.05 * t * t;
      const a = 0.6, X = 2.4, h = 0.8;
      const svg = buildPlot({
        w: 320, h: 228, xmin: -0.2, xmax: 4.15, ymin: -0.35, ymax: 2.45,
        xlabel: "t", ylabel: "y",
        xticks: [{ x: a, tex: "a" }, { x: X, tex: "x" }, { x: X + h, tex: "x+h" }],
        yticks: [],
        aria: "A positive curve y equals f of t; the area under it from a to x is shaded as the accumulated value g of x, and a narrow strip from x to x plus h — drawn wide and not to scale — is the extra area added, of width h and height about f of x.",
        items: [
          { type: "area", fn: f, domain: [a, X], base: 0, cls: "fill-area" },
          { type: "rect", x1: X, x2: X + h, y1: f(X), y0: 0, cls: "rect-sum" },
          { type: "curve", fn: f, domain: [-0.1, 4.05], samples: 200 },
          { type: "text", x: 1.35, y: 0.6, tex: "g(x)", cls: "a-pt", size: 13 },
          { type: "text", x: X + h + 0.07, y: f(X) * 0.5, tex: "f(x)", anchor: "start", cls: "a-pt", size: 12 },
          { type: "text", x: 3.35, y: 2.2, tex: "y=f(t)", anchor: "start", cls: "a-curve", size: 12 },
        ],
      });
      return { layout: "single", panels: [{ svg, note: "The strip is drawn wide — not to scale." }] };
    },

    /* §6.3 Figure 6.7 — the trapped difference quotient in the FTC-1 proof. On the short
       window [x,x+h] the true added area ∫ₓ^{x+h} f (blue, fill-area, top = curve) is
       trapped between an inscribed rectangle of height m_h=min f (solid border rect-lo)
       and a circumscribed rectangle of height M_h=max f (DASHED border rect-hi). For this
       increasing sample the minimum sits at u_h (left) and the maximum at v_h (right).
       As h→0 both m_h and M_h close on f(x) — the squeeze (rest of the statement in caption). */
    "ftc-trap": () => {
      const f = (t) => 0.9 + 0.62 * t - 0.05 * t * t;
      const X = 1, h = 1.4, xh = X + h;
      const mh = f(X), Mh = f(xh);
      const svg = buildPlot({
        w: 320, h: 235, xmin: 0.3, xmax: 3.2, ymin: 0, ymax: 2.5,
        xlabel: "t", ylabel: "y",
        xticks: [{ x: X, tex: "x" }, { x: xh, tex: "x+h" }],
        yticks: [{ y: mh, tex: "m_h" }, { y: Mh, tex: "M_h" }],
        aria: "On the short interval from x to x plus h the thin area under the curve is trapped between an inscribed rectangle of height m sub h, the minimum of f, and a taller dashed circumscribed rectangle of height M sub h, the maximum; as h shrinks both heights close on f of x.",
        items: [
          { type: "area", fn: f, domain: [X, xh], base: 0, cls: "fill-area" },
          { type: "rect", x1: X, x2: xh, y1: mh, y0: 0, cls: "rect-lo" },
          { type: "rect", x1: X, x2: xh, y1: Mh, y0: 0, cls: "rect-hi" },
          { type: "curve", fn: f, domain: [0.35, 3.15], samples: 220 },
          { type: "dot", x: X, y: mh, r: 2.6 },
          { type: "dot", x: xh, y: Mh, r: 2.6 },
          { type: "text", x: X, y: mh, tex: "u_h", anchor: "end", vAnchor: "top", dx: -3, dy: 3, cls: "a-pt", size: 12 },
          { type: "text", x: xh, y: Mh, tex: "v_h", anchor: "start", vAnchor: "bottom", dx: 3, dy: -3, cls: "a-pt", size: 12 },
          { type: "text", x: 1.7, y: 2.34, tex: "m_h,\\,M_h\\to f(x)", anchor: "middle", cls: "a-pt", size: 11 },
        ],
      });
      return { layout: "single", panels: [{ svg }] };
    },

    /* §6.4 Figure 6.8 — velocity v=t²−4 on [0,3], signed regions (Example 6.12).
       v(0)=−4, root at t=2, v(3)=5. On [0,2) the velocity is negative (motion backward):
       region BELOW the axis, marked "−" (red tone fill-neg), area 16/3. On (2,3] positive:
       region ABOVE the axis, marked "+" (blue tone fill-pos), area 7/3. The two regions
       meet at (2,0). The +/− glyphs carry the sign in grayscale (D8). Displacement −3 vs
       total distance 23/3 live in the caption / Example. */
    "velocity-signed-area": () => {
      const v = (t) => t * t - 4;
      const svg = buildPlot({
        w: 300, h: 268, xmin: -0.35, xmax: 3.45, ymin: -4.9, ymax: 6.5,
        xlabel: "t", ylabel: "v",
        xticks: [{ x: 2, tex: "2" }, { x: 3, tex: "3" }],
        yticks: [{ y: -4, tex: "-4" }, { y: 5, tex: "5" }],
        aria: "The velocity v equals t squared minus four on zero to three starts at minus four, crosses zero at t equals two, and rises to five; the larger region below the axis on zero to two is marked minus and the smaller region above the axis on two to three is marked plus.",
        items: [
          { type: "area", fn: v, domain: [0, 2], base: 0, cls: "fill-neg" },
          { type: "area", fn: v, domain: [2, 3], base: 0, cls: "fill-pos" },
          { type: "curve", fn: v, domain: [0, 3], samples: 200 },
          { type: "dot", x: 2, y: 0, r: 2.6 },
          { type: "text", x: 0.75, y: -2.15, tex: "-", cls: "a-pt", size: 23 },
          { type: "text", x: 2.62, y: 1.5, tex: "+", cls: "a-pt", size: 20 },
          { type: "text", x: 1.05, y: 3.7, tex: "v=t^{2}-4", anchor: "start", cls: "a-curve", size: 12 },
        ],
      });
      return { layout: "single", panels: [{ svg }] };
    },

    /* §6.2 Figure 6.5 — the semicircle y=√(1−x²) on [−1,1] (Example 6.6, M4 supplement).
       Reading ∫₋₁¹√(1−x²)dx as the area of the upper unit half-circle = π/2. Shaded region =
       the semicircular disc; a gray radius to the arc marks r=1. The value π/2 lives in the
       caption / Example (label economy). Uses the ch6 area fill primitive. */
    "semicircle-area": () => {
      const f = (x) => Math.sqrt(Math.max(1 - x * x, 0));
      const svg = buildPlot({
        w: 300, h: 200, xmin: -1.3, xmax: 1.3, ymin: -0.34, ymax: 1.3,
        xlabel: "x", ylabel: "y",
        xticks: [{ x: -1, tex: "-1" }, { x: 1, tex: "1" }],
        yticks: [{ y: 1, tex: "1" }],
        aria: "The upper half of the unit circle, y equals the square root of one minus x squared, on minus one to one; the shaded semicircular region beneath it has area pi over two, the value of the integral.",
        items: [
          { type: "area", fn: f, domain: [-1, 1], base: 0, cls: "fill-area" },
          { type: "curve", fn: f, domain: [-1, 1], samples: 260 },
          { type: "seg", x1: 0, y1: 0, x2: 0.707, y2: 0.707, cls: "bubble" },
          { type: "dot", x: 0, y: 0, r: 2.2 },
          { type: "text", x: 0.5, y: 0.3, tex: "1", cls: "a-pt", size: 12 },
          { type: "text", x: 0.12, y: 1.12, tex: "y=\\sqrt{1-x^{2}}", anchor: "start", cls: "a-curve", size: 12 },
        ],
      });
      return { layout: "single", panels: [{ svg }] };
    },

  };

  /* ---- hydrateFigures: fills every <figure data-fig="id"> ---- */
  function hydrateFigures(root) {
    (root || document).querySelectorAll("[data-fig]").forEach(function (el) {
      var def = FIGS[el.dataset.fig];
      if (!def || el.dataset.figDone) return;
      var r = def();
      var layout = r.layout, panels = r.panels;
      var html;
      if (layout === "single" && panels.length === 1 && !panels[0].note) {
        html = '<div class="figure-art">' + panels[0].svg + '</div>';
      } else {
        var cls = { pair: "figure-art--pair", triple: "figure-art--triple", grid: "figure-art--grid" }[layout] || "";
        html = '<div class="figure-art ' + cls + '">' +
          panels.map(function (p) {
            return '<div class="fig-panel">' + p.svg + (p.note ? '<div class="fig-note">' + p.note + '</div>' : '') + '</div>';
          }).join("") + '</div>';
      }
      el.insertAdjacentHTML("afterbegin", html);
      el.dataset.figDone = "1";
    });
  }
  window.hydrateFigures = hydrateFigures;
})();
</script>

<!-- Main build script (paginator + MathJax) -->
<script>
(function () {
  function waitFor(test, tries) {
    return new Promise(function (res) {
      var i = 0;
      (function tick() {
        if (test()) return res(true);
        if (++i > tries) return res(false);
        setTimeout(tick, 150);
      })();
    });
  }
  function build() {
    var page = document.getElementById("page");
    var tpl = document.getElementById("figs-only");
    page.innerHTML = tpl ? tpl.innerHTML : "";
    if (window.hydrateFigures) window.hydrateFigures(page);
    waitFor(function () { return window.MathJax && window.MathJax.typesetPromise; }, 400)
      .then(function (ok) {
        if (!ok) { document.getElementById("boot").textContent = "MathJax load timeout"; return; }
        return MathJax.typesetPromise([page]).catch(function (e) { console.warn("mathjax", e); });
      })
      .then(function () {
        return document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      })
      .then(function () {
        var boot = document.getElementById("boot");
        if (boot) boot.remove();
      });
  }
  window.addEventListener("DOMContentLoaded", build);
})();
</script>
