/* ============================================================

.paper {

/* ============================================================
   print.css — inlined (A4 sheet layout + paginator)
   ============================================================ */
@page { size: A4; margin: 0; }
.sheet {
  position: relative; box-sizing: border-box;
  width: 210mm; height: 297mm;
  padding: 20mm 28mm 20mm 32mm;
  background: #fff; overflow: hidden;
}
.sheet-header {
  position: absolute; top: 11mm; left: 32mm; right: 28mm;
  font: 500 8.5pt "Inter", sans-serif; color: #9aa0ac; letter-spacing: .02em;
}
.sheet-footer {
  position: absolute; bottom: 8.5mm; left: 0; right: 0;
  text-align: center; font: 500 9pt "Inter", sans-serif; color: #82868f;
}
.sheet-body { height: 100%; --accent: oklch(0.50 0.13 245); }
.sheet-body.paper { box-shadow: none; border-radius: 0; max-width: none; background: #fff; }
.sheet-body .page { padding: 0; max-width: none; margin: 0; }
.sheet-body.paper { font-size: 12pt; line-height: 1.55; }
.sheet, .sheet * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.sheet-body > :first-child { margin-top: 0 !important; }
.sheet-body .sec + .sec { border-top: 0; margin-top: 0; padding-top: 0; }
.sheet-body .qed { margin-top: -1.55em; height: 1.55em; }
.sheet-body .env-body::after { display: none; content: none; }
.sheet-body .env-cont { margin-top: 0; }
.sheet-body .env-cont > .env-body > :first-child { margin-top: 0; }
@media screen {
  body { background: #6f727b; margin: 0; }
  .sheet { box-shadow: 0 3px 18px rgba(0,0,0,.3); margin: 9mm auto; }
}
@media print {
  body { background: #fff; margin: 0; }
  .sheet { box-shadow: none; margin: 0; break-after: page; }
  .sheet:last-child { break-after: auto; }
  .print-toolbar, #boot { display: none !important; }
}

   ============================================================ */

<article class="sec" lang="en">
  <header class="chapter-head">
    <div class="ch-kicker">Chapter 8</div>
    <h1 class="ch-title">Techniques of Integration</h1>
  </header>

  <p class="lead">The Fundamental Theorem of Calculus reduced the evaluation of a definite integral to a single task: find an antiderivative. Chapter 6 supplied one tool for that task, substitution, and Chapter 7 showed how much geometry and physics the integral can carry. But substitution alone reaches only integrands with a visible inner function. Products such as \(x\cos x\), powers such as \(\sin^4 x\), and rational functions such as \(\tfrac{x+1}{x(x^2+1)}\) all resist it, and §6.5 promised that their techniques would arrive here. This chapter completes the symbolic toolkit: integration by parts, trigonometric methods, and partial fractions, followed by training in how to choose among them. The chapter then widens the integral itself to unbounded intervals and unbounded integrands, and closes with numerical rules, with error control, for the integrals that no formula reaches.</p>

  <p class="para-head">By the end of this chapter, you will be able to:</p>
  <ul>
    <li>integrate products, logarithms, and inverse trigonometric functions by parts;</li>
    <li>evaluate trigonometric integrals with the standard identities, and integrals containing quadratic radicals by trigonometric substitution;</li>
    <li>integrate rational functions by partial fractions, and choose an approach for an unfamiliar integral;</li>
    <li>decide whether an improper integral converges, by evaluation or by comparison, and evaluate it when it does;</li>
    <li>approximate a definite integral with the Midpoint, Trapezoidal, and Simpson’s rules, and bound the error.</li>
  </ul>
</article>

<article class="sec" lang="en">

  <header class="sec-head">
    <h2 class="sec-title"><span class="sec-no">8.1</span>Integration by Parts</h2>
  </header>

  <!-- expansion:intuition — section opener: the collision (substitution needs an inner function; x cos x has none) motivates running the product rule backwards; "trade, not solve" framing -->
  <p>Try to compute \(\int x\cos x\,dx\) by substitution. The method needs two things, an inner function and its derivative alongside, and this integrand has neither: \(x\) and \(\cos x\) are unrelated factors, and no choice of \(u\) makes the rest of the integrand equal \(du\). Substitution reverses the chain rule, so it applies when the integrand looks like the output of the chain rule. The integrand \(x \cos x\) does not. It looks instead like one term in the output of the <em>product rule</em>, a rule we have not yet run backwards. Running it backwards gives the second technique of integration, and the subject of this section.</p>

  <p>Start from the product rule itself. If \(f\) and \(g\) are differentiable, then by Theorem 2.6,</p>
  <p>\[ \bigl[f(x)\,g(x)\bigr]' = f'(x)\,g(x) + f(x)\,g'(x). \]</p>
  <p>Read this as a statement about antiderivatives (Definition 6.3): it says that \(fg\) is an antiderivative of the sum \(f'g + fg'\). Solving for the term we want turns the rule into a tool.</p>

  <section class="env env-theorem">
    <p class="env-head"><span class="env-kicker">Theorem</span><span class="env-num">8.1</span><span class="env-name">Integration by Parts</span></p>
    <div class="env-body">
      <p>Let \(f\) and \(g\) be differentiable on an open interval \(I\). Then, on \(I\),</p>
      <p>\[ \int f(x)\,g'(x)\,dx = f(x)\,g(x) - \int f'(x)\,g(x)\,dx. \]</p>
      <p>Precisely: if \(G\) is any antiderivative of \(f'g\) on \(I\), then \(fg - G\) is an antiderivative of \(fg'\) on \(I\).</p>
    </div>
  </section>

  <section class="env env-proof">
    <p class="env-head"><span class="env-kicker">Proof</span></p>
    <div class="env-body">
      <p>Differentiate \(fg - G\). By the product rule (Theorem 2.6) and the definition of \(G\),</p>
      <p>\[ (fg - G)' = \bigl(f'g + fg'\bigr) - f'g = fg'. \]</p>
      <p>So \(fg - G\) is an antiderivative of \(fg'\), which is what the displayed identity asserts. <span class="qed qed-proof"></span></p>
    </div>
  </section>

  <p>An equation between indefinite integrals is an equation between families of functions. The constant of integration is shared: it appears once, when the remaining integral on the right is finally evaluated. The identity trades one integral for another. That is all it does, and that is its value: the trade is progress whenever the new integrand \(f'g\) is easier than the old one \(fg'\).</p>

  <p>In practice the formula is applied through the differential notation of §5.3, in the same way substitution was in §6.5. Set \(u = f(x)\) and \(v = g(x)\), so that \(du = f'(x)\,dx\) and \(dv = g'(x)\,dx\). The formula then reads:</p>
  <p>\[ \int u\,dv = uv - \int v\,du. \]</p>
  <p>To use it, split the given integrand into two parts, a function \(u\) and a differential \(dv\); the name of the technique records that split. From \(u\) we compute \(du\) by differentiating, and from \(dv\) we compute \(v\) by antidifferentiating. Any antiderivative serves for \(v\), so we take the one with zero constant.</p>

  <!-- expansion:strategy [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidates 8.1-b (mode-c-gapwalk B, high) + 8.1-d (mode-c-gapwalk A) merged into one paragraph: A asked why the constant may be dropped, B showed when it is worth keeping. The text asserted "any antiderivative serves" without a reason, at the exact point where the reader has just been told that an indefinite integral is a family and the constant appears once. Both halves are one-line verifiable; no new machinery. authored. User adjudication 2026-07-27: adopt (T1 + T3, merged).] -->
  <p>Dropping the constant changes nothing: replacing \(v\) by \(v + k\) adds \(ku\) to \(uv\) and adds the same \(ku\) to \(\int v\,du\), which enters with a minus sign, so the two changes cancel. Occasionally a different choice of \(v\) is worth making, because it can simplify the remaining integral. In \(\int\ln(x + 1)\,dx\), taking \(v = x + 1\) instead of \(v = x\) leaves \(\int\frac{x+1}{x+1}\,dx = \int dx\), while \(v = x\) leaves \(\int\frac{x}{x+1}\,dx\), which needs a division step first. Both routes reach the same answer.</p>

    <!-- expansion:figure [pass: enrichment] [source: figure-opportunity gate 2026-07-26 tier-medium — uv-rectangle bookkeeping, region labels corrected at gate (below-curve = ∫v du); origin-start special case stated in caption; adjudicated adopt-all-13 (user decision); registered in chapter8 FIGS as "parts-uv-rectangle"] -->

  </figure>

  <section class="env env-strategy">
    <p class="env-head"><span class="env-kicker">Strategy</span><span class="env-num">8.1</span><span class="env-name">Choosing \(u\) and \(dv\)</span></p>
    <div class="env-body">
      <ol class="steps">
        <li><em>Pick \(u\) to get simpler when differentiated.</em> A power of \(x\) drops degree; a logarithm or inverse trigonometric function turns algebraic. Pick \(dv\) as the rest of the integrand, and check that you can antidifferentiate \(dv\) on its own.</li>
        <li><em>Logarithms and inverse trigonometric functions go into \(u\).</em> Their derivatives are algebraic, and they have no elementary \(dv\)-role: taking \(dv = \ln x\,dx\) would require the very antiderivative we are seeking. When the integrand is nothing but \(\ln x\) or \(\arctan x\), take \(dv = dx\) (Examples 8.2 and 8.5).</li>
        <li><em>If the integrand reproduces itself, solve for the integral.</em> When two applications of parts return the original integral, as with \(e^{x}\sin x\), collect that integral on one side of the equation and divide (Example 8.4).</li>
        <li><em>If every choice makes the integral worse, parts is the wrong tool.</em> Return to substitution, or to the methods of §8.2 through §8.4.</li>
      </ol>
    </div>
  </section>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.1</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int x\cos x\,dx\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>Following step 1 of Strategy 8.1, take \(u = x\), since differentiation lowers its degree, and \(dv = \cos x\,dx\), which we can antidifferentiate. Then \(du = dx\) and \(v = \sin x\), and the formula gives</p>
        <p>\[ \int x\cos x\,dx = x\sin x - \int \sin x\,dx = x\sin x + \cos x + C. \]</p>
        <p>Differentiating the answer confirms it: \((x\sin x + \cos x)' = \sin x + x\cos x - \sin x = x\cos x\).</p>
        <p>The choice of parts matters. Had we taken \(u = \cos x\) and \(dv = x\,dx\), so that \(du = -\sin x\,dx\) and \(v = \tfrac{x^{2}}{2}\), the trade would read</p>
        <p>\[ \int x\cos x\,dx = \frac{x^{2}}{2}\cos x + \frac{1}{2}\int x^{2}\sin x\,dx, \]</p>
        <p>which is true but worse: the power of \(x\) went up. A trade should simplify, and step 1 is the test to apply before trading. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.2</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \ln x\,dx\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>The integrand does not look like a product, but step 2 of Strategy 8.1 supplies the split: take \(u = \ln x\) and let \(dv = dx\) be the invisible factor. Then \(du = \tfrac{1}{x}\,dx\) by Theorem 4.14, and \(v = x\). For \(x &gt; 0\), where \(\ln x\) is defined,</p>
        <p>\[ \int \ln x\,dx = x\ln x - \int x\cdot\frac{1}{x}\,dx = x\ln x - \int 1\,dx = x\ln x - x + C. \]</p>
        <p>The trade turned a logarithm into the constant integrand \(1\). This is the pattern of step 2 in action: placing the logarithm in \(u\) produced the algebraic derivative \(\tfrac{1}{x}\), and \(dv\) was nothing more than \(dx\). <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.3</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int t^{2}e^{t}\,dt\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>Take \(u = t^{2}\), whose degree drops under differentiation, and \(dv = e^{t}\,dt\), so \(du = 2t\,dt\) and \(v = e^{t}\):</p>
        <p>\[ \int t^{2}e^{t}\,dt = t^{2}e^{t} - 2\int t e^{t}\,dt. \]</p>
        <p>The degree dropped from \(2\) to \(1\), and one more round of parts finishes the job. In the remaining integral take \(u = t\), \(dv = e^{t}\,dt\), so \(du = dt\), \(v = e^{t}\):</p>
        <p>\[ \int t e^{t}\,dt = t e^{t} - \int e^{t}\,dt = t e^{t} - e^{t} + C_1. \]</p>
        <p>Substituting back, with the constant \(-2C_{1}\) absorbed into \(C\),</p>
        <p>\[ \int t^{2}e^{t}\,dt = t^{2}e^{t} - 2\bigl(t e^{t} - e^{t}\bigr) + C = \bigl(t^{2} - 2t + 2\bigr)e^{t} + C. \]</p>
        <p>Each application of parts lowers the power by one, so an integrand \(t^{n}e^{t}\) yields to \(n\) rounds. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.4</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int e^{x}\sin x\,dx\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>Neither factor gets simpler under differentiation: \(e^{x}\) reproduces itself and \(\sin x\) cycles. Parts will not simplify this integral, but by step 3 of Strategy 8.1 it can still close it. Write \(J = \int e^{x}\sin x\,dx\) for the unknown integral. Take \(u = \sin x\), \(dv = e^{x}\,dx\), so \(du = \cos x\,dx\), \(v = e^{x}\):</p>
        <p>\[ J = e^{x}\sin x - \int e^{x}\cos x\,dx. \]</p>
        <p>Apply parts once more to the new integral, with \(u = \cos x\), \(dv = e^{x}\,dx\), so \(du = -\sin x\,dx\), \(v = e^{x}\):</p>
        <p>\[ \int e^{x}\cos x\,dx = e^{x}\cos x + \int e^{x}\sin x\,dx = e^{x}\cos x + J. \]</p>
        <p>Substituting back,</p>
        <p>\[ J = e^{x}\sin x - e^{x}\cos x - J, \]</p>
        <p>and solving for \(J\) gives \(2J = e^{x}(\sin x - \cos x)\), so</p>
        <p>\[ \int e^{x}\sin x\,dx = \frac{e^{x}\bigl(\sin x - \cos x\bigr)}{2} + C. \]</p>
        <p>Here we treated the unknown integral as a single quantity and solved for it. The constant of integration is restored at the end, since the equation holds for antiderivative families. Differentiating the answer confirms it: \(\tfrac{1}{2}\bigl[e^{x}(\sin x - \cos x) + e^{x}(\cos x + \sin x)\bigr] = e^{x}\sin x\). <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <!-- expansion:caution [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidate 8.1-a (mode-c-gapwalk A and B converged, both high) — solve-back is one of the section's three working patterns and role reversal is its single failure mode; the failure looks unlike an arithmetic error (a true identity appears instead of a wrong answer), so a first-time reader has nothing to diagnose it with. The existing Cautions cover the minus sign and the brackets only. Mechanism already on the page: Ex 8.3 and Ex 8.4. authored. User adjudication 2026-07-27: adopt (T1).] -->
  <section class="env env-caution">
    <p class="env-head"><span class="env-kicker">Caution</span></p>
    <div class="env-body">
      <p>Solving for the integral depends on keeping the same kind of factor in the \(u\) position at every round. Reversing the roles on the second application undoes the first. In Example 8.4, choosing \(u = e^{x}\) and \(dv = \cos x\,dx\) at the second step gives \(\int e^{x}\cos x\,dx = e^{x}\sin x - J\), and substituting that back into the first equation returns \(J = J\), a true statement that carries no information. When a second application of parts yields an identity instead of an equation for the unknown, this is why.</p>
    </div>
  </section>

  <p>For definite integrals, the term \(uv\) is evaluated between the limits: it becomes \(\bigl[f(x)\,g(x)\bigr]_{a}^{b}\) in the next theorem. The hypotheses match those of the Fundamental Theorem: we use the term <em>smooth on \([a, b]\)</em> from §7.6, meaning that \(f\) is differentiable with \(f'\) continuous on \([a, b]\), one-sided at the endpoints.</p>

  <section class="env env-theorem">
    <p class="env-head"><span class="env-kicker">Theorem</span><span class="env-num">8.2</span><span class="env-name">Integration by Parts for Definite Integrals</span></p>
    <div class="env-body">
      <p>Let \(f\) and \(g\) be smooth on \([a, b]\). Then</p>
      <p>\[ \int_{a}^{b} f(x)\,g'(x)\,dx = \Bigl[f(x)\,g(x)\Bigr]_{a}^{b} - \int_{a}^{b} f'(x)\,g(x)\,dx. \]</p>
    </div>
  </section>

  <section class="env env-proof">
    <p class="env-head"><span class="env-kicker">Proof</span></p>
    <div class="env-body">
      <p>The sum \(f'g + fg'\) is continuous on \([a, b]\), since \(f, g, f', g'\) all are. Even with these hypotheses, Theorem 6.4 cannot be cited directly, because it asks for an antiderivative on an open interval larger than \([a, b]\), and smoothness on \([a, b]\) alone does not provide one; instead we build the antiderivative we need. Let \(H(x) = \int_{a}^{x} \bigl[f'(t)\,g(t) + f(t)\,g'(t)\bigr]\,dt\). By the Fundamental Theorem of Calculus, Part 1 (Theorem 6.3), \(H\) is continuous on \([a, b]\) with \(H' = f'g + fg'\) on \((a, b)\). The product \(fg\) has the same derivative there, by the product rule (Theorem 2.6). The difference \(fg - H\) is therefore continuous on \([a, b]\) with zero derivative on \((a, b)\), hence constant (Corollary 4.4). Evaluating at \(b\) and at \(a\), where \(H(a) = 0\), gives</p>
      <p>\[ \int_{a}^{b} \bigl[f'(x)\,g(x) + f(x)\,g'(x)\bigr]\,dx = f(b)\,g(b) - f(a)\,g(a). \]</p>
      <p>Splitting the left side by linearity (Theorem 6.2, part 2) and moving \(\int_{a}^{b} f'g\) to the right side gives the formula. <span class="qed qed-proof"></span></p>
    </div>
  </section>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.5</span></p>
      <div class="env-body">
        <p>Evaluate \(\displaystyle\int_{0}^{1} \arctan x\,dx\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>As in Example 8.2, the integrand is a lone function whose derivative is algebraic, so take \(u = \arctan x\) and \(dv = dx\). Then \(du = \tfrac{1}{1+x^{2}}\,dx\), by Example 3.16, and \(v = x\). Both \(\arctan x\) and \(x\) are smooth on \([0, 1]\), so Theorem 8.2 applies:</p>
        <p>\[ \int_{0}^{1} \arctan x\,dx = \Bigl[x\arctan x\Bigr]_{0}^{1} - \int_{0}^{1} \frac{x}{1+x^{2}}\,dx = \frac{\pi}{4} - \int_{0}^{1} \frac{x}{1+x^{2}}\,dx, \]</p>
        <p>since \(\arctan 1 = \tfrac{\pi}{4}\) and the \(x = 0\) term vanishes. The remaining integral is a substitution: with \(w = 1 + x^{2}\), \(dw = 2x\,dx\), and the limits transform by Theorem 6.7 from \(x \in [0, 1]\) to \(w \in [1, 2]\):</p>
        <p>\[ \int_{0}^{1} \frac{x}{1+x^{2}}\,dx = \frac{1}{2}\int_{1}^{2} \frac{dw}{w} = \frac{1}{2}\Bigl[\ln w\Bigr]_{1}^{2} = \frac{\ln 2}{2}. \]</p>
        <p>Therefore</p>
        <p>\[ \int_{0}^{1} \arctan x\,dx = \frac{\pi}{4} - \frac{\ln 2}{2}. \]</p>
        <p>One integral, two techniques: parts opened it, substitution finished it. That division of labor is common, and §8.5 trains the choices. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <section class="env env-caution">
    <p class="env-head"><span class="env-kicker">Caution</span></p>
    <div class="env-body">
      <p>The minus sign in \(uv - \int v\,du\) applies to the <em>entire</em> remaining integral. When \(\int v\,du\) is itself evaluated by another round of parts, as in Examples 8.3 and 8.4, enclose its whole result in parentheses before distributing the sign. Dropped parentheses at this step are the most common error in multi-round parts.</p>
    </div>
  </section>

  <h3 class="subsec-head">Reduction formulas</h3>

  <p>Parts can lower an exponent by a fixed step even when it cannot remove it outright. Applied once to \(\int\sin^{n}x\,dx\), the formula relates the integral to the integral two exponents down. The result is worth recording once, in general, so that any particular power is a chain of lookups rather than a fresh computation.</p>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.6</span></p>
      <div class="env-body">
        <p>Let \(n \ge 2\) be an integer. Show that</p>
        <p>\[ \int \sin^{n}x\,dx = -\frac{1}{n}\cos x\,\sin^{n-1}x + \frac{n-1}{n}\int \sin^{n-2}x\,dx. \]</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>Split off one factor of \(\sin x\) to serve as \(dv\): take \(u = \sin^{n-1}x\) and \(dv = \sin x\,dx\), so that \(du = (n-1)\sin^{n-2}x\cos x\,dx\) by the chain rule and \(v = -\cos x\). Parts gives</p>
        <p>\[ \int \sin^{n}x\,dx = -\cos x\,\sin^{n-1}x + (n-1)\int \sin^{n-2}x\,\cos^{2}x\,dx. \]</p>
        <p>Now \(\cos^{2}x = 1 - \sin^{2}x\), so the right-hand integral splits:</p>
        <p>\[ \begin{aligned}
          \int \sin^{n}x\,dx &= -\cos x\,\sin^{n-1}x + (n-1)\int \sin^{n-2}x\,dx \\
            &\quad - (n-1)\int \sin^{n}x\,dx.
        \end{aligned} \]</p>
        <p>The original integral has reappeared on the right, and as in Example 8.4 we solve for it. Adding \((n-1)\int\sin^{n}x\,dx\) to both sides and dividing by \(n\):</p>
        <p>\[ \int \sin^{n}x\,dx = -\frac{1}{n}\cos x\,\sin^{n-1}x + \frac{n-1}{n}\int \sin^{n-2}x\,dx. \]</p>
        <!-- expansion:formula — consistency spot-check of the reduction formula at n=2 against the §A.2 power-reduction route; also the §8.2 preview hook -->
        <p>As a check, set \(n = 2\). The formula gives \(\int\sin^{2}x\,dx = -\tfrac{1}{2}\cos x\sin x + \tfrac{1}{2}x + C\), and since \(\sin x\cos x = \tfrac{1}{2}\sin 2x\), this is \(\tfrac{x}{2} - \tfrac{\sin 2x}{4} + C\). That is the same antiderivative that the power-reduction identity \(\sin^{2}x = \tfrac{1 - \cos 2x}{2}\) of §A.2 produces by direct integration. Repeated powers of sine and cosine are the opening business of the next section, which uses both routes. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <!-- expansion:formula [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27 — SAME GAP found independently by both waves: example-supplement §8.1–8.4 reported it as Layer 1 candidate 8.1-E1 (a worked example, cascade cost 30 renumberings), mode-c-gapwalk B reported it as candidate 8.1-4 (an unnumbered note, cascade 0). Gap: Example 8.6's formula is proved, spot-checked at n=2, and then never used, while two sentences promise the payoff ("a chain of lookups rather than a fresh computation" here; "the more systematic tool" in §8.2's Ex 8.8). User adjudication 2026-07-27: adopt the zero-cascade form, on the precedent of this chapter's two other unnumbered tagged derivations (the shell-washer block below, the Simpson parabola lemma in §8.7). RED LINE honored: one value only; no general closed form for I_n (that would be a new unproved proposition) and no mention of Wallis. sympy-recomputed at the M4 sweep. authored.] -->
  <p>The formula pays off most visibly on definite integrals over \([0, \tfrac{\pi}{2}]\), where the boundary term disappears. Both \(\sin^{n-1}x\) and \(-\cos x\) are smooth there, so Theorem 8.2 applies and the boundary term can be evaluated. It vanishes at both ends:</p>
  <p>\[ \Bigl[-\tfrac{1}{n}\cos x\,\sin^{n-1}x\Bigr]_{0}^{\pi/2} = 0, \]</p>
  <p>because \(\cos\tfrac{\pi}{2} = 0\) at the upper limit and \(\sin^{n-1}0 = 0\) at the lower one, the second of these because \(n \ge 2\). Writing \(I_{n} = \int_{0}^{\pi/2}\sin^{n}x\,dx\), the reduction formula collapses to a relation between numbers,</p>
  <p>\[ I_{n} = \frac{n-1}{n}\,I_{n-2} \qquad (n \ge 2), \]</p>
  <p>and every even power now comes from repeated lookup, ending at \(I_{0} = \int_{0}^{\pi/2} 1\,dx = \tfrac{\pi}{2}\). For \(n = 6\),</p>
  <p>\[ I_{6} = \tfrac{5}{6}I_{4} = \tfrac{5}{6}\cdot\tfrac{3}{4}\,I_{2} = \tfrac{5}{6}\cdot\tfrac{3}{4}\cdot\tfrac{1}{2}\,I_{0} = \tfrac{5}{6}\cdot\tfrac{3}{4}\cdot\tfrac{1}{2}\cdot\tfrac{\pi}{2} = \frac{5\pi}{32}, \]</p>
  <p>and no integration was carried out after the formula itself. That is the value of recording a reduction formula once.</p>

  <h3 class="subsec-head">Settling the shell–washer question</h3>

  <!-- expansion:formula [source: ch07 sec-7-3 Example 7.12 closing remark (promise: "the tools arrive with integration by parts in Chapter 8 and change of variables in Chapter 15"); ③ B-01 adjudication 2026-07-26, reworked per ⑤ 8.1-B1 + chapter review CH-B1 — strictly INCREASING smooth case with merely CONTINUOUS inverse, which covers Ex 7.12's solid (f = x², g = √y — note √y is not differentiable at 0, so a smooth-inverse hypothesis would have missed the exemplar); decreasing case = mirror note; nonmonotone case explicitly left to Ch15] -->
  <p>Section 7.3 computed one solid’s volume by shells and by washers, found the answers equal, and recorded a promise: the tools to explain the agreement would arrive with integration by parts in Chapter 8 and with change of variables in Chapter 15. Parts has now arrived, and it settles the question for the solid §7.3 actually compared, and for every solid of that monotone kind.</p>
  <p>Let \(f\) be strictly increasing and smooth on \([a, b]\), with \(0 \le a\) and \(f \ge 0\), and suppose its inverse \(g\) is continuous on \([c, d]\), where \(c = f(a)\) and \(d = f(b)\). Rotate the region under \(y = f(x)\) about the \(y\)-axis. In §7.3’s Example 7.12 this is the case \(f(x) = x^{2}\) on \([0, 1]\), with \(g(y) = \sqrt{y}\). The shell method (Theorem 7.1) gives the volume as \(\int_a^b 2\pi x\,f(x)\,dx\).</p>
  <p>The washer reading slices horizontally instead. Below height \(c\) every slice is the full annulus from \(x = a\) to \(x = b\). At height \(y\) between \(c\) and \(d\), the region contains exactly the points with \(f(x) \ge y\); since \(f\) is strictly increasing, that condition says exactly that \(x \ge g(y)\), so the slice runs from \(x = g(y)\) out to \(x = b\). Figure 8.2 draws the split. Applying the cross-section definition (Definition 7.2) on each of \([0, c]\) and \([c, d]\) and adding, the washer volume is</p>
  <p>\[ V_{\text{washer}} = \pi c\,\bigl(b^{2} - a^{2}\bigr) + \pi\int_{c}^{d} \bigl[b^{2} - g(y)^{2}\bigr]\,dy. \]</p>
  <!-- expansion:figure [pass: enrichment] [source: figure-opportunity gate 2026-07-26 — gate-added candidate (D3 override recorded: subsection postdates the brief’s sparsity note); MUST draw a>0 so the full-annulus band exists; caption must not strengthen the continuous-inverse hypothesis; adjudicated adopt-all-13 (user decision); registered in chapter8 FIGS as "washer-split-monotone"] -->
  <figure class="figure" data-fig="washer-split-monotone">
    <figcaption><span class="fig-no">Figure 8.2</span> The washer reading of the shell–washer comparison, for \(f\) strictly increasing with \(0 &lt; a\). Below \(y = c = f(a)\) every horizontal slice is the full annulus from \(a\) to \(b\); between \(c\) and \(d = f(b)\) the slice runs from \(x = g(y)\) out to \(b\). The two bands are the two terms of \(V_{\text{washer}}\).</figcaption>
  </figure>
  <p>Now transform the shell integral. Parts (Theorem 8.2) with \(u = f(x)\) and \(dv = 2x\,dx\), so \(v = x^{2}\), gives</p>
  <p>\[ \int_{a}^{b} 2x\,f(x)\,dx = \Bigl[x^{2}f(x)\Bigr]_{a}^{b} - \int_{a}^{b} x^{2}f'(x)\,dx = b^{2}d - a^{2}c - \int_{a}^{b} x^{2}f'(x)\,dx. \]</p>
  <p>In the remaining integral, \(x^{2} = g(f(x))^{2}\), since \(g\) inverts \(f\). Substitution in a definite integral (Theorem 6.7), applied with the continuous outer function \(g(y)^{2}\) and with \(y = f(x)\), converts it to</p>
  <p>\[ \int_{a}^{b} g\bigl(f(x)\bigr)^{2}\,f'(x)\,dx = \int_{c}^{d} g(y)^{2}\,dy. \]</p>
  <p>Assembling the pieces, the shell volume equals \(\pi\bigl(b^{2}d - a^{2}c - \int_{c}^{d} g(y)^{2}\,dy\bigr)\). Expanding \(V_{\text{washer}}\) gives \(\pi\bigl(b^{2}c - a^{2}c + b^{2}(d - c) - \int_{c}^{d} g(y)^{2}\,dy\bigr)\), which is the same number, since \(b^{2}c + b^{2}(d - c) = b^{2}d\). The two methods agree, and the agreement is a computation with parts, exactly as promised. In Example 7.12’s case the common value is \(\pi\bigl(1 - 0 - \int_{0}^{1} y\,dy\bigr) = \tfrac{\pi}{2}\), the number §7.3 found twice. A strictly decreasing boundary is the mirror computation, with the annulus and the graph trading roles. For a solid whose boundary is not monotone, as in several of §7.3’s other examples, the argument above does not apply; the general statement belongs to the change of variables of Chapter 15, as §7.3 recorded.</p>

  <!-- expansion:summary — close §8.1: what the technique is, when it applies, what was minted; forward to §8.2 with no mechanics -->
  <p>Integration by parts is the product rule read backwards: it trades \(\int u\,dv\) for \(\int v\,du\) at the cost of the boundary product \(uv\). The trade pays when \(u\) simplifies under differentiation, and Strategy 8.1 makes that test explicit. Theorem 8.1 states the identity for antiderivatives, Theorem 8.2 carries it to definite integrals, and the examples display its three working patterns: a power times an integrable factor, a lone logarithm or inverse function with \(dv = dx\), and a self-reproducing integrand solved for algebraically. The same trade settled last chapter’s shell–washer question. The next section turns to integrands built entirely from trigonometric functions, where the tools are identities rather than trades, and where the reduction formula of Example 8.6 finds its regular use.</p>

<article class="sec" lang="en">

  <header class="sec-head">
    <h2 class="sec-title"><span class="sec-no">8.2</span>Trigonometric Integrals</h2>
  </header>

  <!-- expansion:intuition — section opener: the collision (sin³ has no visible du) and the section's one move: spend a factor as du, convert the rest by an identity -->
  <p>Consider \(\int \sin^{3}x\,dx\). No derivative sits beside an inner function, so no substitution presents itself, and the integrand is not a product of unrelated factors either, so parts does not simplify it. The way forward is a property specific to trigonometric functions. They convert into one another. Split off one factor of sine and rewrite the rest by the Pythagorean identity \(\sin^{2}x = 1 - \cos^{2}x\):</p>
  <p>\[ \sin^{3}x = \bigl(1 - \cos^{2}x\bigr)\sin x. \]</p>
  <p>Under the integral sign, the right-hand side becomes a polynomial in \(\cos x\) times \(\sin x\,dx\), and \(\sin x\,dx\) is exactly \(-du\) for \(u = \cos x\). The substitution that seemed absent has been <em>manufactured</em>: one factor was spent as the differential, and an identity converted everything that remained into the new variable. That single move runs through this whole section: spend a factor and convert the rest. When no factor can be spared, a second family of identities lowers the powers instead. The identities themselves were assembled in Appendix A.2, which promised they would be needed when the techniques of integration arrived. They are needed now.</p>

  <h3 class="subsec-head">Powers of sine and cosine</h3>

  <p>For an integrand \(\sin^{m}x\cos^{n}x\), the parity of the exponents (whether each is odd or even) decides the move.</p>

  <section class="env env-strategy">
    <p class="env-head"><span class="env-kicker">Strategy</span><span class="env-num">8.2</span><span class="env-name">Integrating \(\sin^m x\,\cos^n x\)</span></p>
    <div class="env-body">
      <ol class="steps">
        <li><em>If the power of sine is odd,</em> save one factor of \(\sin x\) for the differential and convert the remaining even power by \(\sin^{2}x = 1 - \cos^{2}x\). Then substitute \(u = \cos x\), \(du = -\sin x\,dx\).</li>
        <li><em>If the power of cosine is odd,</em> save one factor of \(\cos x\) and convert the rest by \(\cos^{2}x = 1 - \sin^{2}x\). Then substitute \(u = \sin x\), \(du = \cos x\,dx\).</li>
        <li><em>If both powers are even,</em> no factor can be spared: setting one aside would leave an odd power, which the Pythagorean identity cannot turn into a polynomial in the other function. Lower the degree with the power-reduction identities of §A.2, \(\sin^{2}x = \tfrac{1}{2}(1 - \cos 2x)\) and \(\cos^{2}x = \tfrac{1}{2}(1 + \cos 2x)\), and repeat as needed.</li>
      </ol>
    </div>
  </section>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.7</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \sin^{3}x\,\cos^{2}x\,dx\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>The power of sine is odd. Save one factor of \(\sin x\) and convert the remaining \(\sin^{2}x\):</p>
        <p>\[ \int \sin^{3}x\,\cos^{2}x\,dx = \int \bigl(1 - \cos^{2}x\bigr)\cos^{2}x\,\sin x\,dx. \]</p>
        <p>Substitute \(u = \cos x\), so that \(du = -\sin x\,dx\) and \(\sin x\,dx = -du\) (Theorem 6.6):</p>
        <p>\[ \int \bigl(1 - u^{2}\bigr)u^{2}\,(-du) = \int \bigl(u^{4} - u^{2}\bigr)\,du = \frac{u^{5}}{5} - \frac{u^{3}}{3} + C. \]</p>
        <p>Substituting \(u = \cos x\) back,</p>
        <p>\[ \int \sin^{3}x\,\cos^{2}x\,dx = \frac{\cos^{5}x}{5} - \frac{\cos^{3}x}{3} + C. \]</p>
        <p>Splitting one factor off the odd power is what made this work: that factor of sine became the differential, and everything else became a polynomial, which integrates term by term. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <section class="env env-caution">
    <p class="env-head"><span class="env-kicker">Caution</span></p>
    <div class="env-body">
      <p>The substitution \(u = \cos x\) gives \(du = -\sin x\,dx\). The minus sign is the most commonly dropped symbol in this section. Write the line \(\sin x\,dx = -du\) explicitly before substituting, and the sign survives.</p>
    </div>
  </section>

  <!-- expansion:intuition [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27 — the surviving increment of example-supplement candidate 8.2-E1. That candidate proposed a full worked example for Strategy 8.2's step 2, which the adjudication declined as a mirror of Ex 8.7 (cascade 29 renumberings for a repeated mechanism); the user adjudicated 2026-07-27 to keep only the part that was new, the parity diagnostic, as prose at zero cost. Strategy 8.2 states the reason for the parity test inside a step-3 parenthesis and never demonstrates it. Source of the underlying comparison: Mooculus trigonometricIntegrals/digInTrigonometricIntegrals.tex (CC BY-NC-SA), whose own write-up asserts sin^3 = (1-cos^2)^{3/2} without naming an interval; corrected here to the sign-choice statement, per this book's §8.3 radical discipline. authored.] -->
  <p>The parity test in Strategy 8.2 is a test of which factor can be spent as the differential, and the integrand of Example 8.7 shows where the other choice leads. Spending a factor of \(\cos x\) as the differential, with \(u = \sin x\) and \(du = \cos x\,dx\), leaves \(\int u^{3}\cos x\,du\), in which the substitution is not yet complete: the old variable is still present. And a lone \(\cos x\) is not a function of \(\sin x\) until a sign is chosen: on an interval where \(\cos x \ge 0\) it equals \(\sqrt{1 - u^{2}}\), and the integral becomes \(\int u^{3}\sqrt{1 - u^{2}}\,du\), a radical instead of a polynomial. Spending a factor from the odd power leaves an even power behind, and only an even power converts by the Pythagorean identity.</p>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.8</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \sin^{4}x\,dx\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>The power is even, so no factor can be spared and step 3 of Strategy 8.2 applies. Using \(\sin^{2}x = \tfrac{1}{2}(1 - \cos 2x)\) from §A.2 and squaring,</p>
        <p>\[ \sin^{4}x = \Bigl(\frac{1 - \cos 2x}{2}\Bigr)^{2} = \frac{1}{4}\bigl(1 - 2\cos 2x + \cos^{2}2x\bigr). \]</p>
        <p>The last term is again an even power, and the companion identity \(\cos^{2}\theta = \tfrac{1}{2}(1 + \cos 2\theta)\), applied with \(\theta = 2x\), lowers it too:</p>
        <p>\[ \sin^{4}x = \frac{1}{4}\Bigl(1 - 2\cos 2x + \frac{1 + \cos 4x}{2}\Bigr) = \frac{3}{8} - \frac{\cos 2x}{2} + \frac{\cos 4x}{8}. \]</p>
        <p>Every term is now a plain cosine, and integration is immediate:</p>
        <p>\[ \int \sin^{4}x\,dx = \frac{3x}{8} - \frac{\sin 2x}{4} + \frac{\sin 4x}{32} + C. \]</p>
        <!-- expansion:formula — agreement check against the §8.1 reduction-formula route; ties Ex 8.6 into its promised regular use -->
        <p>The reduction formula of Example 8.6 reaches the same answer by a different route. It expresses \(\int\sin^{4}x\,dx\) in terms of \(\int\sin^{2}x\,dx\), and the two results agree after the double-angle identity is applied. When several powers must be integrated in sequence, the reduction formula is the more systematic tool; for a single even power, power reduction is the shorter one. <span class="qed"></span></p>
      </div>
    </section>
  </div>

    <!-- expansion:figure [pass: enrichment] [source: figure-opportunity gate 2026-07-26 tier-medium — power-reduction identity as a picture (constant term = midline); period π halved, touching zeros; geometric caption only, no average-value theorem vocabulary; adjudicated adopt-all-13 (user decision); registered in chapter8 FIGS as "sin-squared-midline"] -->
  <figure class="figure" data-fig="sin-squared-midline">
    <figcaption><span class="fig-no">Figure 8.3</span> The graph of \(\sin^{2}x\) oscillates about the midline \(y = \tfrac{1}{2}\) with period \(\pi\): the identity’s constant term is the average height, and each valley exactly fills a peak. The zeros touch the axis without crossing it.</figcaption>
  </figure>

  <h3 class="subsec-head">Tangents and secants</h3>

  <p>Recall from Definition A.1 that \(\sec x = \tfrac{1}{\cos x}\), \(\csc x = \tfrac{1}{\sin x}\), and \(\cot x = \tfrac{\cos x}{\sin x}\). For integration, tangent and secant form a closed pair. Their derivatives stay in the pair, since \(\tfrac{d}{dx}\tan x = \sec^{2}x\) and \(\tfrac{d}{dx}\sec x = \sec x\tan x\) (Example 3.2), and the Pythagorean companion \(1 + \tan^{2}x = \sec^{2}x\) (Proposition A.1) converts between them. So the same manufacturing move applies. Spend \(\sec^{2}x\,dx\) as the differential of \(\tan x\), or spend \(\sec x\tan x\,dx\) as the differential of \(\sec x\), and convert what remains.</p>

  <section class="env env-strategy">
    <p class="env-head"><span class="env-kicker">Strategy</span><span class="env-num">8.3</span><span class="env-name">Integrating \(\tan^m x\,\sec^n x\)</span></p>
    <div class="env-body">
      <ol class="steps">
        <li><em>If the power of secant is even</em> (\(n \ge 2\)), save a factor of \(\sec^{2}x\) and convert the remaining secants by \(\sec^{2}x = 1 + \tan^{2}x\). Then substitute \(u = \tan x\), \(du = \sec^{2}x\,dx\).</li>
        <li><em>If the power of tangent is odd</em> (and \(n \ge 1\)), save a factor of \(\sec x\tan x\) and convert the remaining tangents by \(\tan^{2}x = \sec^{2}x - 1\). Then substitute \(u = \sec x\), \(du = \sec x\tan x\,dx\).</li>
        <li><em>If neither case applies,</em> convert tangents by \(\tan^{2}x = \sec^{2}x - 1\) and fall back on parts and the basic antiderivatives of Proposition 8.1 below, as in Example 8.10. A lone even power of tangent splits this way into lower powers plus a constant; a lone odd power reduces the same way to \(\int\tan x\,dx\) itself, which Proposition 8.1 supplies.</li>
      </ol>
    </div>
  </section>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.9</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \tan^{6}x\,\sec^{4}x\,dx\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>The power of secant is even. Save one factor of \(\sec^{2}x\) and convert the other by \(\sec^{2}x = 1 + \tan^{2}x\):</p>
        <p>\[ \int \tan^{6}x\,\sec^{4}x\,dx = \int \tan^{6}x\,\bigl(1 + \tan^{2}x\bigr)\,\sec^{2}x\,dx. \]</p>
        <p>Substitute \(u = \tan x\), \(du = \sec^{2}x\,dx\):</p>
        <p>\[ \int u^{6}\bigl(1 + u^{2}\bigr)\,du = \int \bigl(u^{6} + u^{8}\bigr)\,du = \frac{u^{7}}{7} + \frac{u^{9}}{9} + C. \]</p>
        <p>Substituting back,</p>
        <p>\[ \int \tan^{6}x\,\sec^{4}x\,dx = \frac{\tan^{7}x}{7} + \frac{\tan^{9}x}{9} + C, \]</p>
        <p>valid on any interval where \(\tan x\) and \(\sec x\) are defined. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <p>Strategy 8.3 stands on two basic antiderivatives that its case analysis cannot produce. Its third step reduces leftover tangents to \(\int\tan x\,dx\) itself, and the route of Example 8.10 runs through \(\int\sec x\,dx\). The antiderivative table of §6.4 has neither: its trigonometric rows are the Chapter 3 derivatives read backwards, so \(\sec^{2}x\) appears there but \(\tan x\) itself does not. The next proposition supplies both, together with their two companions.</p>

  <section class="env env-proposition">
    <p class="env-head"><span class="env-kicker">Proposition</span><span class="env-num">8.1</span><span class="env-name">Antiderivatives of the remaining trigonometric functions</span></p>
    <div class="env-body">
      <p>On any interval where the integrand is continuous,</p>
      <p>\[ \begin{aligned}
        \int \tan x\,dx &= \ln\lvert\sec x\rvert + C, \\[2pt]
        \int \cot x\,dx &= \ln\lvert\sin x\rvert + C, \\[2pt]
        \int \sec x\,dx &= \ln\lvert\sec x + \tan x\rvert + C, \\[2pt]
        \int \csc x\,dx &= -\ln\lvert\csc x + \cot x\rvert + C.
      \end{aligned} \]</p>
    </div>
  </section>

  <section class="env env-proof">
    <p class="env-head"><span class="env-kicker">Proof</span></p>
    <div class="env-body">
      <p>For the tangent, write \(\tan x = \tfrac{\sin x}{\cos x}\) and substitute \(u = \cos x\), \(du = -\sin x\,dx\) (Theorem 6.6). Using the antiderivative \(\int\tfrac{du}{u} = \ln\lvert u\rvert + C\) from §6.4,</p>
      <p>\[ \int \tan x\,dx = \int \frac{\sin x}{\cos x}\,dx = -\int \frac{du}{u} = -\ln\lvert\cos x\rvert + C = \ln\lvert\sec x\rvert + C, \]</p>
      <p>where the last step uses \(-\ln t = \ln\tfrac{1}{t}\) for \(t &gt; 0\). The cotangent line is the same computation with \(u = \sin x\), this time without the minus sign.</p>
      <p>For the secant no substitution presents itself, and the standard route is a device that was found by trial, not derived: multiply and divide by \(\sec x + \tan x\). Then</p>
      <p>\[ \int \sec x\,dx = \int \frac{\sec^{2}x + \sec x\tan x}{\sec x + \tan x}\,dx, \]</p>
      <p>and the numerator is exactly the derivative of the denominator, by Example 3.2. With \(u = \sec x + \tan x\) the integral is \(\int\tfrac{du}{u} = \ln\lvert u\rvert + C\), which is the stated formula. Whatever one thinks of the trick, the result is verified honestly by differentiating:</p>
      <p>\[ \begin{aligned}
        \frac{d}{dx}\,\ln\lvert\sec x + \tan x\rvert &= \frac{\sec x\tan x + \sec^{2}x}{\sec x + \tan x} \\[2pt]
          &= \frac{\sec x\,\bigl(\tan x + \sec x\bigr)}{\sec x + \tan x} = \sec x.
      \end{aligned} \]</p>
      <p>The cosecant line follows by the same verification, differentiating \(-\ln\lvert\csc x + \cot x\rvert\) and simplifying with \(\tfrac{d}{dx}\csc x = -\csc x\cot x\) and \(\tfrac{d}{dx}\cot x = -\csc^{2}x\). <span class="qed qed-proof"></span></p>
    </div>
  </section>

  <p>Each formula holds on every interval avoiding the integrand’s singularities, and the constant \(C\) may differ from interval to interval, as with \(\ln\lvert x\rvert\) in §6.4.</p>

  <!-- expansion:history [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidate 8.2-a (mode-c-gapwalk A and B converged, both ranked it their strongest history item) — the proof above labels the secant device "found by trial, not derived", which invites the question of why anyone was trying; this is the one place in the chapter where history answers a mathematical question the text has just raised, and it is a rare application-before-tool case. VERIFIED 2026-07-27 before drafting (user authorized the check), two independent sources agreeing: Wikipedia "Integral of the secant function" and the search-level account tracing to V. F. Rickey & P. M. Tuchinsky, "An Application of Geography to Mathematics: History of the Integral of the Secant", Mathematics Magazine 53 (1980) 162-166. Facts as checked: Mercator chart 1569; Edward Wright, Certaine Errors in Navigation, 1599, table computed by numerical summation; Henry Bond conjectured the closed form c. 1645 by comparing Wright's table with Gunter's table of logarithms of tangents; James Gregory proved it 1668 (Exercitationes Geometricae); Isaac Barrow gave the first transparent proof 1670. NOT claimed, per both sources and both gate instances: that Mercator himself computed or used this integral. Bond's log-tangent form is deliberately not written out (this book's form is Proposition 8.1's). First expansion:history marker in this section.] -->
  <p>The antiderivative of the secant was wanted before there was a calculus to supply it. On the Mercator chart of 1569, the north-south scale has to stretch with latitude in proportion to the secant of the latitude, so the map distance out to latitude \(\varphi\) is \(\int_{0}^{\varphi}\sec\theta\,d\theta\). Edward Wright published a table of those values in 1599, obtained by adding secants in small steps, since no formula for them was known. Around 1645 Henry Bond noticed that Wright’s table agreed with a table of logarithms of tangents and conjectured a closed form on that evidence alone; James Gregory proved the conjecture in 1668, and Isaac Barrow gave a clearer proof in 1670. The device above looks unmotivated because the order of events was the reverse of the usual one: the formula was found first and justified afterwards.</p>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.10</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \sec^{3}x\,dx\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>The power of secant is odd and no tangent is present, so neither case of Strategy 8.3 applies. Following its third step, we use parts (Theorem 8.1). Take \(u = \sec x\) and \(dv = \sec^{2}x\,dx\), so that \(du = \sec x\tan x\,dx\) by Example 3.2 and \(v = \tan x\):</p>
        <p>\[ \int \sec^{3}x\,dx = \sec x\tan x - \int \sec x\tan^{2}x\,dx. \]</p>
        <p>Convert the tangents by \(\tan^{2}x = \sec^{2}x - 1\) (Proposition A.1):</p>
        <p>\[ \int \sec^{3}x\,dx = \sec x\tan x - \int \sec^{3}x\,dx + \int \sec x\,dx. \]</p>
        <p>The original integral has reappeared, and we solve for it as in Example 8.4. Adding \(\int\sec^{3}x\,dx\) to both sides, dividing by \(2\), and evaluating \(\int\sec x\,dx\) by Proposition 8.1:</p>
        <p>\[ \int \sec^{3}x\,dx = \frac{1}{2}\Bigl(\sec x\tan x + \ln\lvert\sec x + \tan x\rvert\Bigr) + C. \]</p>
        <p>This integral appears throughout the next section, where substitutions of the form \(x = a\tan\theta\) produce it repeatedly. The mirror integral \(\int\csc^{3}x\,dx\) is computed by the same two moves, parts and then Proposition 8.1’s cosecant formula. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <!-- expansion:strategy [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidate 8.2-c (mode-c-gapwalk A) — Proposition 8.1 supplies antiderivatives for cot and csc, but Strategy 8.3 covers only the tangent-secant half of the family, leaving a reader facing cot^3 x csc^4 x with no guidance. Zero new machinery: the derivatives of cot and csc are already in evidence in Prop 8.1's proof, and the identity is Prop A.1's third companion. This is the one-sentence "mirror named" form that the fragment's own SEAM GUARD ("no csc^3 (mirror named)") anticipates, not a worked example. authored. User adjudication 2026-07-27: adopt (T3).] -->
  <p>The cotangent-cosecant family behaves in exactly the same way, with the same split into cases. For \(\int\cot^{m}x\,\csc^{n}x\,dx\): if \(n\) is even, save a factor \(\csc^{2}x\,dx\), which is the differential of \(-\cot x\), and convert what remains by \(1 + \cot^{2}x = \csc^{2}x\) (Proposition A.1); if \(m\) is odd, save a factor \(\csc x\cot x\,dx\), which is the differential of \(-\csc x\), and convert what remains by the same identity. The only change from Strategy 8.3 is a minus sign carried through each substitution.</p>

  <h3 class="subsec-head">Products with different frequencies</h3>

  <p>The last family is \(\int\sin mx\cos nx\,dx\) and its siblings, where the two factors oscillate at different rates. No substitution connects them. Here the product-to-sum identities do all the work in one line, by replacing the product with a sum of single trigonometric functions. Proposition A.2’s first line is the one needed for a sine times a cosine:</p>
  <p>\[ \sin u\cos v = \tfrac{1}{2}\bigl[\sin(u + v) + \sin(u - v)\bigr]. \]</p>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.11</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \sin 4x\,\cos 5x\,dx\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>Apply the identity with \(u = 4x\) and \(v = 5x\):</p>
        <p>\[ \sin 4x\,\cos 5x = \tfrac{1}{2}\bigl[\sin 9x + \sin(-x)\bigr] = \tfrac{1}{2}\bigl[\sin 9x - \sin x\bigr], \]</p>
        <p>since sine is an odd function, \(\sin(-x) = -\sin x\). The product has become a sum of two sines at fixed frequencies, and each integrates immediately:</p>
        <p>\[ \int \sin 4x\,\cos 5x\,dx = \frac{1}{2}\Bigl(-\frac{\cos 9x}{9} + \cos x\Bigr) + C = \frac{\cos x}{2} - \frac{\cos 9x}{18} + C. \]</p>
        <p>For a product of two sines, or of two cosines, the other two lines of Proposition A.2 convert the product the same way. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <!-- expansion:summary — close §8.2: the manufacturing idea + what was minted; forward to §8.3 with no mechanics -->
  <p>This section added no new integration principle. Its engine is still substitution, fed by identities: one factor of an odd power is spent as the differential, the Pythagorean identities convert what remains, power reduction lowers even powers, and product-to-sum splits mixed frequencies. The four antiderivatives of Proposition 8.1 fill the last gaps in the basic trigonometric table, and Example 8.10’s \(\int\sec^{3}x\,dx\) is recorded for immediate reuse. The next section turns this machinery outward, onto integrands that contain no trigonometry at all: radicals such as \(\sqrt{9 - x^{2}}\), which a well-chosen trigonometric substitution converts into exactly the integrals this section taught.</p>

</article>

<article class="sec" lang="en">

  <header class="sec-head">
    <h2 class="sec-title"><span class="sec-no">8.3</span>Trigonometric Substitution</h2>
  </header>

  <!-- expansion:intuition — section opener: the collision (no visible du removes a radical over a sum/difference of squares) + the Pythagorean reparametrization idea -->
  <p>The radical \(\sqrt{9 - x^{2}}\) appeared in §8.2’s closing sentence as the next target, and it resists every method so far. No substitution of the form \(u = 9 - x^{2}\) helps unless a spare factor of \(x\) happens to sit in the integrand to supply \(du\). When it does not, the root over a sum or difference of squares blocks every algebraic move. What removes it is a change of viewpoint. The Pythagorean identity is itself a statement about sums of squares: setting \(x = 3\sin\theta\) turns \(9 - x^{2}\) into \(9\cos^{2}\theta\), a perfect square, and the root falls away. The substitution changes the variable, so a return step waits at the end; what is gained is an integrand made of trigonometric functions, which §8.2 taught us to handle.</p>

  <p>One point of honesty before we state the method. In Chapter 6 we substituted \(u = g(x)\), replacing the variable by an expression. Here we run the Substitution Rule (Theorem 6.6) in the other direction, replacing the variable \(x\) by a formula \(x = g(\theta)\) in a new variable. For this to be reversible, \(g\) must be one-to-one. That is what the restricted ranges in the table below arrange: on \([-\tfrac{\pi}{2}, \tfrac{\pi}{2}]\) the function \(a\sin\theta\) takes each value exactly once, so \(\theta = \arcsin\tfrac{x}{a}\) is well defined, just as in §1.2. The same restriction settles a second question. A square root such as \(\sqrt{9\cos^{2}\theta}\) equals \(3\lvert\cos\theta\rvert\), and on \([-\tfrac{\pi}{2}, \tfrac{\pi}{2}]\) the cosine is nonnegative, so the absolute value can be dropped with justification rather than by hope. Every solution in this section begins by naming its substitution, its \(\theta\)-range, and the sign that the range fixes.</p>

  <p>Throughout, \(a\) denotes a positive constant: the radicals involve only \(a^{2}\), so nothing is lost by taking \(a\) positive. Three radical patterns cover the standard cases, one for each rearrangement of the Pythagorean identity (Proposition A.1).</p>

  <section class="env env-strategy">
    <p class="env-head"><span class="env-kicker">Strategy</span><span class="env-num">8.4</span><span class="env-name">Trigonometric substitution</span></p>
    <div class="env-body">
      <p>First check for an ordinary substitution: if the integrand carries a spare factor of \(x\), as in \(\int x\sqrt{1 - x^{2}}\,dx\), then \(u = 1 - x^{2}\) finishes without trigonometry. The same check returns as step 2 of §8.5’s four-step strategy. Otherwise, match the radical to a row:</p>
      <ol class="steps">
        <li>\(\sqrt{a^{2} - x^{2}}\): substitute \(x = a\sin\theta\), \(\theta \in \bigl[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\bigr]\). Then \(1 - \sin^{2}\theta = \cos^{2}\theta\) gives \(\sqrt{a^{2} - x^{2}} = a\cos\theta\), with \(\cos\theta \ge 0\) on the range.</li>
        <li>\(\sqrt{a^{2} + x^{2}}\): substitute \(x = a\tan\theta\), \(\theta \in \bigl(-\tfrac{\pi}{2}, \tfrac{\pi}{2}\bigr)\). Then \(1 + \tan^{2}\theta = \sec^{2}\theta\) gives \(\sqrt{a^{2} + x^{2}} = a\sec\theta\), with \(\sec\theta &gt; 0\) on the range.</li>
        <li>\(\sqrt{x^{2} - a^{2}}\): substitute \(x = a\sec\theta\), \(\theta \in \bigl[0, \tfrac{\pi}{2}\bigr)\) for the component \(x \ge a\) of the domain. Then \(\sec^{2}\theta - 1 = \tan^{2}\theta\) gives \(\sqrt{x^{2} - a^{2}} = a\tan\theta\), with \(\tan\theta \ge 0\) on the range. (For the component \(x \le -a\), see the caution at the end of the section.)</li>
      </ol>
      <p class="informal">To return to \(x\), draw a right triangle that matches the substitution: mark the angle \(\theta\), and label the sides so that the substitution’s ratio holds. The remaining side, by the Pythagorean theorem, is the radical. Every trigonometric function of \(\theta\) can then be read off as a ratio of labeled sides. The triangle is a mnemonic for identities that the \(\theta\)-range makes valid.</p>
    </div>
  </section>

    <!-- expansion:figure [pass: enrichment] [source: figure-opportunity gate 2026-07-26 tier-essential — back-substitution device; side assignments verified against Strategy 8.4 rows and Ex 8.12/8.14/8.15 readings; θ acute = mnemonic convention, caption keeps "mnemonic" wording; adjudicated adopt-all-13 (user decision); registered in chapter8 FIGS as "trig-sub-triangles"] -->
  <figure class="figure" data-fig="trig-sub-triangles">
    <figcaption><span class="fig-no">Figure 8.4</span> The three reference triangles of Strategy 8.4, one per substitution. Label the sides so that the substitution’s ratio holds; the remaining side, by the Pythagorean theorem, is the radical, and every trigonometric function of \(\theta\) can be read off as a ratio of sides. The triangles are a mnemonic for identities that the stated \(\theta\)-ranges make valid.</figcaption>
  </figure>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.12</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \frac{\sqrt{9 - x^{2}}}{x^{2}}\,dx\) for \(0 &lt; x &lt; 3\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>The radical matches row 1 with \(a = 3\). Substitute \(x = 3\sin\theta\); on the component \(0 &lt; x &lt; 3\) the range narrows to \(\theta \in \bigl(0, \tfrac{\pi}{2}\bigr)\), where \(\cos\theta &gt; 0\), so \(\sqrt{9 - x^{2}} = 3\cos\theta\) and \(dx = 3\cos\theta\,d\theta\). The integral becomes</p>
        <p>\[ \int \frac{3\cos\theta}{9\sin^{2}\theta}\,3\cos\theta\,d\theta = \int \frac{\cos^{2}\theta}{\sin^{2}\theta}\,d\theta = \int \cot^{2}\theta\,d\theta. \]</p>
        <p>By the Pythagorean companion \(1 + \cot^{2}\theta = \csc^{2}\theta\) (Proposition A.1), the integrand is \(\csc^{2}\theta - 1\), and \(\int\csc^{2}\theta\,d\theta = -\cot\theta + C\) since \(\tfrac{d}{d\theta}\cot\theta = -\csc^{2}\theta\). So</p>
        <p>\[ \int \cot^{2}\theta\,d\theta = -\cot\theta - \theta + C. \]</p>
        <p>Now return to \(x\). In the right triangle for \(\sin\theta = \tfrac{x}{3}\), the hypotenuse is \(3\), the side opposite \(\theta\) is \(x\), and the remaining side is \(\sqrt{9 - x^{2}}\). Reading off the ratio, \(\cot\theta = \tfrac{\sqrt{9 - x^{2}}}{x}\), and \(\theta = \arcsin\tfrac{x}{3}\) directly. Therefore</p>
        <p>\[ \int \frac{\sqrt{9 - x^{2}}}{x^{2}}\,dx = -\frac{\sqrt{9 - x^{2}}}{x} - \arcsin\frac{x}{3} + C \qquad\text{on } (0, 3). \]</p>
        <p>The same computation serves on \((-3, 0)\), where \(\theta \in \bigl(-\tfrac{\pi}{2}, 0\bigr)\) and the cosine is still positive; only the component changes. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.13</span></p>
      <div class="env-body">
        <p>Find the area enclosed by the ellipse \(\dfrac{x^{2}}{a^{2}} + \dfrac{y^{2}}{b^{2}} = 1\), where \(a, b &gt; 0\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>Solving for the upper half gives \(y = \tfrac{b}{a}\sqrt{a^{2} - x^{2}}\) for \(-a \le x \le a\), so the enclosed area is twice the integral of that height:</p>
        <p>\[ A = 2\,\frac{b}{a}\int_{-a}^{a} \sqrt{a^{2} - x^{2}}\,dx = 4\,\frac{b}{a}\int_{0}^{a} \sqrt{a^{2} - x^{2}}\,dx, \]</p>
        <p>where the second equality uses the evenness of the integrand (Theorem 6.8). The radical matches row 1. Substitute \(x = a\sin\theta\), \(dx = a\cos\theta\,d\theta\), and transform the limits by Theorem 6.7: \(x = 0\) gives \(\theta = 0\) and \(x = a\) gives \(\theta = \tfrac{\pi}{2}\). On \(\bigl[0, \tfrac{\pi}{2}\bigr]\), where \(\cos\theta \ge 0\), \(\sqrt{a^{2} - x^{2}} = a\cos\theta\), so</p>
        <p>\[ \begin{aligned}
          \int_{0}^{a} \sqrt{a^{2} - x^{2}}\,dx &= \int_{0}^{\pi/2} a^{2}\cos^{2}\theta\,d\theta = a^{2}\int_{0}^{\pi/2} \frac{1 + \cos 2\theta}{2}\,d\theta \\[2pt]
            &= a^{2}\left[\frac{\theta}{2} + \frac{\sin 2\theta}{4}\right]_{0}^{\pi/2} = \frac{\pi a^{2}}{4},
        \end{aligned} \]</p>
        <p>using the power-reduction identity \(\cos^{2}\theta = \tfrac{1}{2}(1 + \cos 2\theta)\) of §A.2. Therefore</p>
        <p>\[ A = 4\,\frac{b}{a}\cdot\frac{\pi a^{2}}{4} = \pi a b. \]</p>
        <p>For \(a = b = r\) the ellipse is a circle and the formula returns \(\pi r^{2}\), as it must. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <!-- expansion:intuition [source: §7.6 forward promise ("Chapter 8 will widen the toolkit… its numerical methods take over") — the perimeter contrast sets up §8.7's motivation] -->
  <p>The ellipse’s area is now settled; its boundary length is not. For \(a \ne b\), the arc length integral of §7.6 for this curve contains a radical that no row of Strategy 8.4, and no other technique of this chapter, can turn into an integrand whose antiderivative is built from the functions we have named. (The circle \(a = b = r\) is the exception: there the integrand reduces to a constant times \(1/\sqrt{r^{2} - x^{2}}\), which row 1 converts in one line.) The area took four lines; the perimeter sits outside this chapter’s reach. Section 8.7 returns to exactly this kind of integral with numerical rules.</p>

    <!-- expansion:figure [pass: enrichment] [source: figure-opportunity gate 2026-07-26 tier-medium — integration region + ×2×2 symmetry; a>b horizontal major axis; named ticks a, b with explicit tex; πab kept off the drawing; adjudicated adopt-all-13 (user decision); registered in chapter8 FIGS as "ellipse-quarter-area"] -->
  <figure class="figure" data-fig="ellipse-quarter-area">
    <figcaption><span class="fig-no">Figure 8.5</span> The quarter-ellipse region behind Example 8.13. Solving for the upper half doubles the region once, evenness doubles it again, so the enclosed area is four times the shaded first-quadrant integral. The intercepts sit at \((a, 0)\) and \((0, b)\).</figcaption>
  </figure>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.14</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \frac{dx}{x^{2}\sqrt{x^{2} + 4}}\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>The radical matches row 2 with \(a = 2\). Substitute \(x = 2\tan\theta\), \(\theta \in \bigl(-\tfrac{\pi}{2}, \tfrac{\pi}{2}\bigr)\); we work on the component \(x &gt; 0\), where \(\theta \in \bigl(0, \tfrac{\pi}{2}\bigr)\). Then \(dx = 2\sec^{2}\theta\,d\theta\), and since \(\sec\theta &gt; 0\) on the range, \(\sqrt{x^{2} + 4} = 2\sec\theta\). The integral becomes</p>
        <p>\[ \int \frac{2\sec^{2}\theta}{4\tan^{2}\theta\cdot 2\sec\theta}\,d\theta = \frac{1}{4}\int \frac{\sec\theta}{\tan^{2}\theta}\,d\theta = \frac{1}{4}\int \frac{\cos\theta}{\sin^{2}\theta}\,d\theta, \]</p>
        <p>after writing everything in sines and cosines. With \(u = \sin\theta\), \(du = \cos\theta\,d\theta\), this is \(\tfrac{1}{4}\int u^{-2}\,du = -\tfrac{1}{4u} + C = -\tfrac{1}{4}\csc\theta + C\). In the triangle for \(\tan\theta = \tfrac{x}{2}\), the side opposite \(\theta\) is \(x\), the adjacent side is \(2\), and the hypotenuse is \(\sqrt{x^{2} + 4}\), so \(\csc\theta = \tfrac{\sqrt{x^{2} + 4}}{x}\). Therefore</p>
        <p>\[ \int \frac{dx}{x^{2}\sqrt{x^{2} + 4}} = -\frac{\sqrt{x^{2} + 4}}{4x} + C. \]</p>
        <p>Differentiating the answer shows it is an antiderivative on \(x &lt; 0\) as well, so the one formula serves both components. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <p>When the radical stands alone in the integrand, as in \(\int\sqrt{x^{2} + a^{2}}\,dx\), the same tangent substitution leads to \(\int\sec^{3}\theta\,d\theta\), which Example 8.10 supplies; this book leaves that longer computation unworked.</p>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.15</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \frac{dx}{\sqrt{x^{2} - a^{2}}}\) for \(x &gt; a &gt; 0\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>The radical matches row 3. Substitute \(x = a\sec\theta\), \(\theta \in \bigl(0, \tfrac{\pi}{2}\bigr)\) on this component; then \(dx = a\sec\theta\tan\theta\,d\theta\), and since \(\tan\theta &gt; 0\) on the range, \(\sqrt{x^{2} - a^{2}} = a\tan\theta\). The integral collapses:</p>
        <p>\[ \int \frac{a\sec\theta\tan\theta}{a\tan\theta}\,d\theta = \int \sec\theta\,d\theta = \ln\lvert\sec\theta + \tan\theta\rvert + C, \]</p>
        <p>by Proposition 8.1. In the triangle for \(\sec\theta = \tfrac{x}{a}\), the hypotenuse is \(x\), the adjacent side is \(a\), and the opposite side is \(\sqrt{x^{2} - a^{2}}\), so</p>
        <p>\[ \int \frac{dx}{\sqrt{x^{2} - a^{2}}} = \ln\left\lvert \frac{x}{a} + \frac{\sqrt{x^{2} - a^{2}}}{a} \right\rvert + C = \ln\bigl(x + \sqrt{x^{2} - a^{2}}\bigr) + C_{1}, \]</p>
        <p>where \(\ln a\) was absorbed into the constant, and the absolute value was dropped because \(x &gt; a &gt; 0\) makes the argument positive on this component. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <section class="env env-caution">
    <p class="env-head"><span class="env-kicker">Caution</span></p>
    <div class="env-body">
      <p>The domain of \(\sqrt{x^{2} - a^{2}}\) has two components, and row 3’s range covers only \(x \ge a\). On the other component, \(x \le -a\), use the alternate range \(\theta \in \bigl(\tfrac{\pi}{2}, \pi\bigr]\): there \(\tan\theta \le 0\), so the resolved radical is \(\sqrt{x^{2} - a^{2}} = -a\tan\theta\), and the extra sign travels through the computation. The shortcut is to check the final formula directly. Differentiating \(\ln\bigl\lvert x + \sqrt{x^{2} - a^{2}}\bigr\rvert\) gives \(\tfrac{1}{\sqrt{x^{2} - a^{2}}}\) on <em>both</em> components, so Example 8.15’s answer, with the absolute value restored, serves everywhere. An antiderivative claimed across a two-component domain must be checked on each component.</p>
    </div>
  </section>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.16</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \frac{x}{\sqrt{3 - 2x - x^{2}}}\,dx\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>No row of Strategy 8.4 matches until the quadratic under the root is recentred. Completing the square, as in the closing paragraph of §A.5, with \(x^{2} + 2x = (x + 1)^{2} - 1\):</p>
        <p>\[ 3 - 2x - x^{2} = 4 - (x + 1)^{2}, \]</p>
        <p>which is positive exactly for \(-3 &lt; x &lt; 1\), the domain of the integrand. The shift \(u = x + 1\), \(du = dx\), \(x = u - 1\) turns the integral into row-1 form:</p>
        <p>\[ \int \frac{u - 1}{\sqrt{4 - u^{2}}}\,du = \int \frac{u}{\sqrt{4 - u^{2}}}\,du - \int \frac{du}{\sqrt{4 - u^{2}}}. \]</p>
        <p>The first piece has the spare factor that Strategy 8.4’s lead-in asks about: \(w = 4 - u^{2}\), \(dw = -2u\,du\) gives \(-\tfrac{1}{2}\int w^{-1/2}\,dw = -\sqrt{4 - u^{2}}\). The second piece is row 1 with \(a = 2\) and nothing else in the integrand: with \(u = 2\sin\varphi\), \(\varphi \in \bigl(-\tfrac{\pi}{2}, \tfrac{\pi}{2}\bigr)\), where \(\cos\varphi &gt; 0\), both \(du = 2\cos\varphi\,d\varphi\) and \(\sqrt{4 - u^{2}} = 2\cos\varphi\) reduce it to \(\int d\varphi = \varphi = \arcsin\tfrac{u}{2}\). Assembling and returning to \(x\):</p>
        <p>\[ \int \frac{x}{\sqrt{3 - 2x - x^{2}}}\,dx = -\sqrt{3 - 2x - x^{2}} - \arcsin\frac{x + 1}{2} + C, \]</p>
        <p>valid on \((-3, 1)\). Completing the square is what §A.5 promised it would be here: the one algebraic step that brings a general quadratic radical within reach of the table. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <!-- expansion:caution [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidate 8.3-a (mode-c-gapwalk A and B converged; B's framing adopted because it names the exact promise-versus-demonstration gap) — the section closes by claiming the method "reaches any sqrt(px^2+qx+r)", but all five worked examples have leading coefficient +-1 (Ex 8.16's 3-2x-x^2 becomes 4-(x+1)^2), so the |p| != 1 step never appears anywhere. §8.4's Ex 8.21 performs the analogous move with u = 2x-1, which makes the asymmetry between the two sections real rather than notional. Delivered as prose rather than a third Caution box, per gapwalk A's note that Strategy 8.4 should remain the single visible authority. authored. User adjudication 2026-07-27: adopt (T1).] -->
  <p>Completing the square clears the linear term; a leading coefficient other than \(1\) needs one more preliminary step. The three rows of Strategy 8.4 are written with \(x^{2}\) by itself, so the leading coefficient must be factored out first. Then \(\sqrt{9x^{2} - 4} = 3\sqrt{x^{2} - \bigl(\tfrac{2}{3}\bigr)^{2}}\) is row 3 with \(a = \tfrac{2}{3}\), and \(\sqrt{9 - 4x^{2}} = 2\sqrt{\bigl(\tfrac{3}{2}\bigr)^{2} - x^{2}}\) is row 1 with \(a = \tfrac{3}{2}\). A linear substitution such as \(u = 2x\) does the same work, as in Example 8.21 of the next section, where it clears a leading coefficient from a quadratic denominator.</p>

  <section class="env env-caution">
    <p class="env-head"><span class="env-kicker">Caution</span></p>
    <div class="env-body">
      <p>For a definite integral, either transform the limits along with the variable (Theorem 6.7), as in Example 8.13, or back-substitute to \(x\) first and then apply the original limits. Do not mix the two: evaluating a \(\theta\)-antiderivative at \(x\)-limits is the classic error of this method.</p>
    </div>
  </section>

  <!-- expansion:summary — close §8.3: what the method is + hygiene recap; forward to §8.4 with no mechanics -->
  <p>Trigonometric substitution replaces the variable by a trigonometric formula so that a Pythagorean identity turns the quadratic under the root into a perfect square. The discipline is in the ranges: each substitution is one-to-one on its stated interval, the interval fixes the radical’s sign, and the labeled triangle carries the answer back to \(x\). With completing the square, the method reaches any \(\sqrt{px^{2} + qx + r}\). What it does not touch is the other standard shape built from polynomials: a ratio of two of them, with no radical in sight. Integrating rational functions is the next section’s business, and the algebra for it is already waiting in Appendix A.4.</p>
