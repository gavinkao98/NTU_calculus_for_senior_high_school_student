<article class="sec" lang="en">

  <header class="sec-head">
    <h2 class="sec-title"><span class="sec-no">8.4</span>Integration of Rational Functions by Partial Fractions</h2>
  </header>

  <!-- expansion:intuition — section opener: opaque-as-a-whole, transparent-in-fragments; §A.4's banked promise is kept here -->
  <p>A rational function, a ratio of polynomials, matches nothing in the chapter so far. The integrand \(\dfrac{2x^{2} - x + 4}{x^{3} + 4x}\) offers no product to trade by parts, no trigonometry, and no radical. Yet one of the smallest rational integrands is already easy, because §A.4 opened with the identity</p>
  <p>\[ \frac{1}{x(x + 1)} = \frac{1}{x} - \frac{1}{x + 1}, \]</p>
  <p>and each piece on the right integrates on sight, to \(\ln\lvert x\rvert - \ln\lvert x + 1\rvert + C\) by §6.4. Appendix A.4 built the whole algebra of such splittings and remarked that its real payoff would come in integration. This section collects that payoff. Every proper rational function is a sum of fragments of a few standard shapes (Proposition A.7), the constants are found by the routine of Strategy A.2, and each fragment shape has a standard antiderivative. For rational integrands, unlike most others, the method always succeeds.</p>

  <p>The claim “every proper rational function” rests on one algebraic fact that this book states but does not prove.</p>

  <!-- expansion:caution [source: SPEC §16.1 on-credit fence, unnumbered-Caution vehicle (Ch2 §2.4 precedent); ROADMAP seam-hunt premise "實多項式因式分解 (FTA fact)" — the chapter's first of two credits] -->
  <section class="env env-caution">
    <p class="env-head"><span class="env-kicker">Caution</span></p>
    <div class="env-body">
      <p>Proposition A.7 begins by factoring the denominator completely into linear and irreducible quadratic factors. That such a factorization always exists is a consequence of the Fundamental Theorem of Algebra, whose proof lies outside this book. We take the factorization fact on credit; it is the first of two results this chapter borrows without proof, and everything else in the section is proved or computed in full.</p>
    </div>
  </section>

  <!-- expansion:intuition [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidate 8.4-b (mode-c-gapwalk A) — the Caution above guarantees that a factorization EXISTS and says nothing about finding one, which is the reader's immediate next question and the step every example silently performs. The answer lies entirely in A-class prerequisite material (factor theorem, rational-root search), so nothing new is assumed. Delivered as prose rather than as a Caution box, since it is a method note and not a warning. authored. User adjudication 2026-07-27: adopt (T3).] -->
  <p>Existence is not the same as a method for finding one. The credit above, and the promise that the method always succeeds, guarantee that a factorization exists; neither says how to produce it. The first tool is the factor theorem: \(r\) is a root of a polynomial exactly when \(x - r\) divides it. When the coefficients are integers this narrows the search, because an integer root must divide the constant term, so the divisors of that term form a short list of candidates to test. Every denominator in this section factors by hand, sometimes by that test and sometimes by a shortcut: the quadratic formula, which supplies the roots of the quadratic factor in Example 8.18 below, or grouping, as in Example 8.19. When no factorization can be found, the method stops at step 2 of Strategy 8.5, and no integration technique can supply the missing factorization. From here on we take the factoring as done.</p>

  <p>Before the fragments can be listed, one small antiderivative is needed: the scaled version of §6.4’s arctangent row. For \(a &gt; 0\), substitute \(u = x/a\), \(du = dx/a\), in the table entry \(\int\frac{du}{1 + u^{2}} = \arctan u + C\):</p>
  <p>\[ \int \frac{dx}{x^{2} + a^{2}} = \frac{1}{a^{2}}\int \frac{a\,du}{1 + u^{2}} = \frac{1}{a}\arctan\frac{x}{a} + C. \tag{8.A} \]</p>

  <p>With (8.A) in hand, every fragment shape that Proposition A.7 can produce has a known antiderivative. A constant over a linear factor gives a logarithm, \(\int\frac{A}{x - r}\,dx = A\ln\lvert x - r\rvert + C\). A constant over a power of a linear factor integrates by the power rule, \(\int\frac{A}{(x - r)^{k}}\,dx = \frac{-A}{(k - 1)(x - r)^{k - 1}} + C\) for \(k \ge 2\). A linear numerator over an irreducible quadratic splits in two: a multiple of the quadratic’s derivative, giving a logarithm of the quadratic, plus a constant piece that (8.A) handles once the square is completed. The examples run each shape in turn; the strategy box states the pipeline.</p>

  <section class="env env-strategy">
    <p class="env-head"><span class="env-kicker">Strategy</span><span class="env-num">8.5</span><span class="env-name">Integrating a rational function</span></p>
    <div class="env-body">
      <ol class="steps">
        <li><em>If the fraction is improper, divide first.</em> Numerator degree at or above denominator degree means polynomial division, leaving a polynomial plus a proper remainder fraction (Strategy A.2, step 1). The polynomial integrates term by term.</li>
        <li><em>Factor the denominator completely</em> into linear and irreducible quadratic factors. A quadratic \(x^{2} + px + q\) is irreducible exactly when \(p^{2} &lt; 4q\).</li>
        <li><em>Decompose.</em> Write the template of Proposition A.7 and find the constants by Strategy A.2. The cover-up shortcut reaches the constant over each distinct linear factor at once.</li>
        <li><em>Integrate fragment by fragment:</em> logarithms from linear factors, power-rule antiderivatives from their powers, and a logarithm plus an arctangent, via completing the square (§A.5) and (8.A), from each irreducible quadratic.</li>
      </ol>
    </div>
  </section>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.17</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \frac{x^{3} + x}{x - 1}\,dx\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>The numerator’s degree exceeds the denominator’s, so step 1 applies before anything else. Polynomial division gives</p>
        <p>\[ \frac{x^{3} + x}{x - 1} = x^{2} + x + 2 + \frac{2}{x - 1}, \]</p>
        <p>which can be checked by recombining over the common denominator. Now every piece is standard:</p>
        <p>\[ \int \frac{x^{3} + x}{x - 1}\,dx = \frac{x^{3}}{3} + \frac{x^{2}}{2} + 2x + 2\ln\lvert x - 1\rvert + C, \]</p>
        <p>on any interval avoiding \(x = 1\). The division step is not optional. No sum of terms \(\frac{A}{x-1}\) alone could reproduce a numerator that outgrows its denominator, which is the point of §A.4’s closing caution. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.18</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \frac{x^{2} + 2x - 1}{2x^{3} + 3x^{2} - 2x}\,dx\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>The fraction is proper, so factoring comes first: \(2x^{3} + 3x^{2} - 2x = x(2x^{2} + 3x - 2) = x(2x - 1)(x + 2)\), three distinct linear factors. Proposition A.7’s template reads</p>
        <p>\[ \frac{x^{2} + 2x - 1}{x(2x - 1)(x + 2)} = \frac{A}{x} + \frac{B}{2x - 1} + \frac{C}{x + 2}. \]</p>
        <p>Clearing denominators,</p>
        <p>\[ x^{2} + 2x - 1 = A(2x - 1)(x + 2) + Bx(x + 2) + Cx(2x - 1), \]</p>
        <p>and the cover-up shortcut of Strategy A.2 evaluates at each factor’s root. Setting \(x = 0\) gives \(-1 = -2A\), so \(A = \tfrac{1}{2}\). Setting \(x = \tfrac{1}{2}\) gives \(\tfrac{1}{4} = \tfrac{5}{4}B\), so \(B = \tfrac{1}{5}\). Setting \(x = -2\) gives \(-1 = 10C\), so \(C = -\tfrac{1}{10}\). Each fragment is a logarithm; for the middle one, the inner substitution \(u = 2x - 1\) contributes the factor \(\tfrac{1}{2}\):</p>
        <p>\[ \int \frac{x^{2} + 2x - 1}{2x^{3} + 3x^{2} - 2x}\,dx = \frac{1}{2}\ln\lvert x\rvert + \frac{1}{10}\ln\lvert 2x - 1\rvert - \frac{1}{10}\ln\lvert x + 2\rvert + K, \]</p>
        <p>on any interval avoiding \(0\), \(\tfrac{1}{2}\), and \(-2\). <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <!-- expansion:strategy [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidate 8.4-a (mode-c-gapwalk A and B converged) — four examples in this section solve for constants, and a single wrong constant ruins the answer, but the text supplies a check only for the DIVISION step ("can be checked by recombining", Ex 8.17); the decomposition step has none, so the section's verification habit is half missing. Consistent with the chapter-wide "differentiating confirms" culture. Demonstration arithmetic sympy-recomputed at the M4 sweep. authored. User adjudication 2026-07-27: adopt (T3).] -->
  <p>One habit belongs here. Once the constants are found, pick a value of \(x\) that has not been used yet, substitute it into the identity obtained after clearing denominators, and check that the two sides agree. In Example 8.18, taking \(x = 1\) gives \(2\) on the left and \(3A + 3B + C = \tfrac{3}{2} + \tfrac{3}{5} - \tfrac{1}{10} = 2\) on the right. The check costs one line and catches sign and arithmetic slips before any integration begins, which matters because a wrong decomposition integrates just as smoothly as a correct one.</p>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.19</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \frac{x^{4} - 2x^{2} + 4x + 1}{x^{3} - x^{2} - x + 1}\,dx\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>Improper again, so divide: the quotient is \(x + 1\) with remainder \(4x\), so</p>
        <p>\[ \frac{x^{4} - 2x^{2} + 4x + 1}{x^{3} - x^{2} - x + 1} = x + 1 + \frac{4x}{x^{3} - x^{2} - x + 1}. \]</p>
        <p>Factoring by grouping, \(x^{3} - x^{2} - x + 1 = x^{2}(x - 1) - (x - 1) = (x - 1)(x^{2} - 1) = (x - 1)^{2}(x + 1)\): a repeated linear factor. The template carries one fragment per power:</p>
        <p>\[ \frac{4x}{(x - 1)^{2}(x + 1)} = \frac{A}{x - 1} + \frac{B}{(x - 1)^{2}} + \frac{C}{x + 1}. \]</p>
        <p>Clearing denominators, \(4x = A(x - 1)(x + 1) + B(x + 1) + C(x - 1)^{2}\). Setting \(x = 1\) gives \(4 = 2B\), so \(B = 2\). Setting \(x = -1\) gives \(-4 = 4C\), so \(C = -1\). The cover-up shortcut cannot reach \(A\), as Strategy A.2 warns for repeated factors, so match the \(x^{2}\) coefficients: \(0 = A + C\), so \(A = 1\). Integrating fragment by fragment, with the power rule on the middle one,</p>
        <p>\[ \begin{aligned}
          \int \frac{x^{4} - 2x^{2} + 4x + 1}{x^{3} - x^{2} - x + 1}\,dx &= \frac{x^{2}}{2} + x + \ln\lvert x - 1\rvert \\
            &\quad - \frac{2}{x - 1} - \ln\lvert x + 1\rvert + K,
        \end{aligned} \]</p>
        <p>on any interval avoiding \(\pm 1\). <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <!-- expansion:caution [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidate 8.4-c (mode-c-gapwalk B) — Ex 8.19 exhibits the correct template for a repeated factor but never shows what the abbreviated one does, and the consequence is unusual: not a wrong answer but an unsolvable system, which a first-time reader reads as an arithmetic failure of their own. Three-line counterexample, fully verifiable, no new machinery. Coefficient system sympy-recomputed at the M4 sweep. authored. User adjudication 2026-07-27: adopt (T3).] -->
  <section class="env env-caution">
    <p class="env-head"><span class="env-kicker">Caution</span></p>
    <div class="env-body">
      <p>The template needs a fragment for every power of a repeated factor, not only the highest. Dropping the lower ones does not save work; it leaves a system with no solution at all. Writing \(\frac{4x}{(x - 1)^{2}(x + 1)}\) as \(\frac{B}{(x - 1)^{2}} + \frac{C}{x + 1}\) and clearing denominators gives \(4x = B(x + 1) + C(x - 1)^{2}\). Matching \(x^{2}\) coefficients forces \(C = 0\), matching \(x\) coefficients then forces \(B = 4\), and matching constants requires \(B + C = 0\). No such constants exist. The failure looks like an arithmetic mistake, but it is a sign that the template itself was wrong.</p>
    </div>
  </section>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.20</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \frac{2x^{2} - x + 4}{x^{3} + 4x}\,dx\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>The denominator factors as \(x(x^{2} + 4)\). The quadratic has \(p = 0\) and \(q = 4\), so \(p^{2} &lt; 4q\) and it is irreducible; by Proposition A.7 it carries a linear numerator:</p>
        <p>\[ \frac{2x^{2} - x + 4}{x(x^{2} + 4)} = \frac{A}{x} + \frac{Bx + C}{x^{2} + 4}. \]</p>
        <p>Clearing denominators, \(2x^{2} - x + 4 = A(x^{2} + 4) + (Bx + C)x\). The constant term gives \(4 = 4A\), so \(A = 1\); the \(x^{2}\) coefficient gives \(2 = A + B\), so \(B = 1\); the \(x\) coefficient gives \(C = -1\). The quadratic fragment splits into its two standard pieces:</p>
        <p>\[ \begin{aligned}
          \int \frac{x - 1}{x^{2} + 4}\,dx &= \frac{1}{2}\int \frac{2x}{x^{2} + 4}\,dx - \int \frac{dx}{x^{2} + 4} \\[2pt]
            &= \frac{1}{2}\ln\bigl(x^{2} + 4\bigr) - \frac{1}{2}\arctan\frac{x}{2} + K,
        \end{aligned} \]</p>
        <p>the first by the substitution \(u = x^{2} + 4\) and the second by (8.A) with \(a = 2\). No absolute value is needed on \(x^{2} + 4\), which is positive for every \(x\). Assembling,</p>
        <p>\[ \int \frac{2x^{2} - x + 4}{x^{3} + 4x}\,dx = \ln\lvert x\rvert + \frac{1}{2}\ln\bigl(x^{2} + 4\bigr) - \frac{1}{2}\arctan\frac{x}{2} + K, \]</p>
        <p>on any interval avoiding \(0\). <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <section class="env env-caution">
    <p class="env-head"><span class="env-kicker">Caution</span></p>
    <div class="env-body">
      <p>Check irreducibility before assigning the \(Bx + C\) template: \(x^{2} + px + q\) is irreducible exactly when \(p^{2} &lt; 4q\). A quadratic that looks unfactorable often factors after all. The factor \(x^{2} - x - 6\) splits as \((x - 3)(x + 2)\), and treating it as irreducible puts the whole decomposition on the wrong template. When in doubt, compute the discriminant first.</p>
    </div>
  </section>

  <p>A repeated irreducible quadratic, the last case of Proposition A.7, adds no new integration idea: each power \(\frac{Bx + C}{(x^{2} + px + q)^{k}}\) again splits into a derivative-of-the-quadratic piece and a constant piece, and the constant pieces are handled by completing the square and a short reduction. The bookkeeping is longer, the shapes are the same, and this book leaves that case as stated.</p>

  <p>One tool from step 4 has not yet appeared in action: completing the square.</p>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.21</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \frac{4x^{2} - 3x + 2}{4x^{2} - 4x + 3}\,dx\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>The degrees are equal, so this fraction is improper and step 1 applies. Dividing,</p>
        <p>\[ \frac{4x^{2} - 3x + 2}{4x^{2} - 4x + 3} = 1 + \frac{x - 1}{4x^{2} - 4x + 3}, \]</p>
        <p>and the denominator has discriminant \((-4)^{2} - 4\cdot 4\cdot 3 &lt; 0\), so it is irreducible and is its own decomposition. Completing the square, as in §A.5’s closing paragraph, \(4x^{2} - 4x + 3 = (2x - 1)^{2} + 2\). Substitute \(u = 2x - 1\), so \(x = \tfrac{u + 1}{2}\), \(dx = \tfrac{du}{2}\), and \(x - 1 = \tfrac{u - 1}{2}\):</p>
        <p>\[ \begin{aligned}
          \int \frac{x - 1}{4x^{2} - 4x + 3}\,dx &= \frac{1}{4}\int \frac{u - 1}{u^{2} + 2}\,du \\[2pt]
            &= \frac{1}{8}\ln\bigl(u^{2} + 2\bigr) - \frac{1}{4}\cdot\frac{1}{\sqrt{2}}\arctan\frac{u}{\sqrt{2}} + C,
        \end{aligned} \]</p>
        <p>splitting as in Example 8.20 and applying (8.A) with \(a = \sqrt{2}\). Returning to \(x\), with \(u^{2} + 2 = 4x^{2} - 4x + 3\) positive everywhere,</p>
        <p>\[ \begin{aligned}
          \int \frac{4x^{2} - 3x + 2}{4x^{2} - 4x + 3}\,dx &= x + \frac{1}{8}\ln\bigl(4x^{2} - 4x + 3\bigr) \\
            &\quad - \frac{1}{4\sqrt{2}}\arctan\frac{2x - 1}{\sqrt{2}} + C,
        \end{aligned} \]</p>
        <p>valid on all of \(\mathbb{R}\). This is the integral §A.5 promised: completing the square is the step that brings a general quadratic denominator within reach of (8.A). <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <h3 class="subsec-head">Rationalizing substitutions</h3>

  <p>Some integrands are not rational but can be made so. When a single radical \(\sqrt[n]{g(x)}\) is the obstacle, the substitution \(u = \sqrt[n]{g(x)}\) often converts the whole integrand into a rational function of \(u\), where this section’s pipeline takes over.</p>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.22</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \frac{\sqrt{x + 4}}{x}\,dx\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>Substitute \(u = \sqrt{x + 4}\), working on the component \(x &gt; 0\), where \(u &gt; 2\). Then \(u^{2} = x + 4\), so \(x = u^{2} - 4\) and \(dx = 2u\,du\):</p>
        <p>\[ \int \frac{\sqrt{x + 4}}{x}\,dx = \int \frac{u}{u^{2} - 4}\,2u\,du = 2\int \frac{u^{2}}{u^{2} - 4}\,du. \]</p>
        <p>The integrand is rational and improper, so divide: \(\frac{u^{2}}{u^{2} - 4} = 1 + \frac{4}{u^{2} - 4}\), and \(u^{2} - 4 = (u - 2)(u + 2)\) decomposes by cover-up as \(\frac{4}{(u-2)(u+2)} = \frac{1}{u - 2} - \frac{1}{u + 2}\). So</p>
        <p>\[ 2\int \frac{u^{2}}{u^{2} - 4}\,du = 2u + 2\ln\lvert u - 2\rvert - 2\ln\lvert u + 2\rvert + C, \]</p>
        <p>and returning to \(x\),</p>
        <p>\[ \int \frac{\sqrt{x + 4}}{x}\,dx = 2\sqrt{x + 4} + 2\ln\left\lvert \frac{\sqrt{x + 4} - 2}{\sqrt{x + 4} + 2} \right\rvert + C. \]</p>
        <p>Differentiating confirms the formula, and the same check shows it also serves on the other component, \(-4 &lt; x &lt; 0\). The solution chained three techniques in order: a substitution to remove the radical, a division to make the fraction proper, and partial fractions to finish. That chaining is how integration usually proceeds in practice, and the next section is about choosing such chains deliberately. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <!-- expansion:summary — close §8.4: the pipeline + the honest credit; forward to §8.5 with no mechanics -->
  <p>Rational functions are the best-behaved integrands in this chapter: Strategy 8.5’s four steps (divide, factor, decompose, integrate) always terminate, and the only borrowed ingredient is the factorization fact taken on credit above. Linear factors end in logarithms, their powers in power-rule terms, and irreducible quadratics in a logarithm plus an arctangent through (8.A). With parts, trigonometric methods, substitution, and partial fractions all in hand, the toolkit is complete. What remains is judgment: given an unfamiliar integral, which tool comes first? That question has a strategy of its own.</p>

</article>

<article class="sec" lang="en">

  <header class="sec-head">
    <h2 class="sec-title"><span class="sec-no">8.5</span>Strategy for Integration</h2>
  </header>

  <!-- expansion:intuition — section opener: the collision (four look-alike integrals, four different tools) reframes the chapter's question from "how does each technique work" to "which technique fits" -->
  <p>Each section so far answered the question “how does this technique work”. Practice asks a different question. An integral arrives unlabeled, and the work is to decide which tool fits, before any tool is applied. The four integrals</p>
  <p>\[ \int \frac{\tan^{3}x}{\cos^{3}x}\,dx, \qquad \int e^{\sqrt{x}}\,dx, \qquad \int \frac{dx}{x\sqrt{\ln x}}, \qquad \int \sqrt{\frac{1 - x}{1 + x}}\,dx \]</p>
  <p>look like near relatives: each is a small expression with one awkward feature. They go to four different tools, and none of them is best solved by the tool its form suggests first. Reading form is a skill of its own. It takes only seconds, a wrong guess costs little, and this section trains it.</p>

  <section class="env env-strategy">
    <p class="env-head"><span class="env-kicker">Strategy</span><span class="env-num">8.6</span><span class="env-name">A four-step strategy</span></p>
    <div class="env-body">
      <ol class="steps">
        <li><em>Simplify the integrand first.</em> Algebra and identities can change the problem’s class entirely: expand or split fractions, rationalize, apply a trigonometric identity. Only then judge what kind of integral it is.</li>
        <li><em>Look for an obvious substitution.</em> If some inner function \(g(x)\) appears together with its derivative, up to a constant factor, take \(u = g(x)\) (Strategy 6.2) and finish before reaching for anything heavier.</li>
        <li><em>Classify by form and dispatch.</em> Powers or products of trigonometric functions go to Strategies 8.2 and 8.3. A radical over a quadratic goes to Strategy 8.4, completing the square first when the quadratic is not centered. A rational function goes to Strategy 8.5. A product of unrelated factors, or a lone logarithm or inverse function, goes to parts by Strategy 8.1.</li>
        <li><em>If nothing has worked, try again from another angle.</em> Manipulate the integrand into a relative of a known integral, substitute to expose hidden structure, or chain techniques in sequence, as Examples 8.22 and 8.24 do. Several routes may succeed on the same integral; a dead end costs only the time it took.</li>
      </ol>
    </div>
  </section>

  <p>Step 3 leans on a stock of antiderivatives that can be recognized on sight. One scaled form joins the list first: differentiating \(\arcsin\tfrac{x}{a}\) by the chain rule (Theorem 3.3) and Example 3.14 gives \(\tfrac{1}{\sqrt{a^{2} - x^{2}}}\), so \(\int\tfrac{dx}{\sqrt{a^{2} - x^{2}}} = \arcsin\tfrac{x}{a} + C\) for \(a &gt; 0\) on \((-a, a)\). The working table, with each entry’s source in parentheses:</p>

  <p>\[ \begin{aligned}
    &\int x^{n}\,dx = \frac{x^{n+1}}{n+1} + C \;(n \ne -1), \qquad \int \frac{dx}{x} = \ln\lvert x\rvert + C \quad(\text{§6.4}), \\[2pt]
    &\int e^{x}\,dx = e^{x} + C, \qquad \int \sin x\,dx = -\cos x + C \quad(\text{§6.4}), \\[2pt]
    &\int \cos x\,dx = \sin x + C, \qquad \int \sec^{2}x\,dx = \tan x + C \quad(\text{§6.4}), \\[2pt]
    &\int \tan x\,dx = \ln\lvert\sec x\rvert + C \quad(\text{Prop.\ 8.1}), \\[2pt]
    &\int \sec x\,dx = \ln\lvert\sec x + \tan x\rvert + C \quad(\text{Prop.\ 8.1}), \\[2pt]
    &\int \frac{dx}{x^{2} + a^{2}} = \frac{1}{a}\arctan\frac{x}{a} + C \quad(\text{8.A}), \\[2pt]
    &\int \frac{dx}{\sqrt{a^{2} - x^{2}}} = \arcsin\frac{x}{a} + C \quad(\text{above}).
  \end{aligned} \]</p>

  <p>We now run the opening’s four integrals through the strategy, in order.</p>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.23</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \frac{\tan^{3}x}{\cos^{3}x}\,dx\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>Step 1: since \(\tfrac{1}{\cos x} = \sec x\), the integrand is \(\tan^{3}x\,\sec^{3}x\), a tangent–secant power. Step 3 dispatches it to Strategy 8.3: the power of tangent is odd, so save a factor of \(\sec x\tan x\) and convert the remaining tangents by \(\tan^{2}x = \sec^{2}x - 1\):</p>
        <p>\[ \int \tan^{3}x\,\sec^{3}x\,dx = \int \bigl(\sec^{2}x - 1\bigr)\sec^{2}x\;\sec x\tan x\,dx. \]</p>
        <p>With \(u = \sec x\), \(du = \sec x\tan x\,dx\), this is \(\int(u^{4} - u^{2})\,du\), so</p>
        <p>\[ \int \frac{\tan^{3}x}{\cos^{3}x}\,dx = \frac{\sec^{5}x}{5} - \frac{\sec^{3}x}{3} + C. \]</p>
        <p>The only decision was the rewrite in step 1; after it, the machinery of Strategy 8.3 finished the integral with no further choices. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.24</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int e^{\sqrt{x}}\,dx\) for \(x &gt; 0\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>No product, no trigonometry, no rational structure. The awkward feature is the radical in the exponent, and step 4’s advice is to substitute it away even though \(du\) is nowhere in sight. Let \(u = \sqrt{x}\), so \(x = u^{2}\) and \(dx = 2u\,du\):</p>
        <p>\[ \int e^{\sqrt{x}}\,dx = \int e^{u}\,2u\,du = 2\int u\,e^{u}\,du. \]</p>
        <p>The substitution has manufactured a product of unrelated factors, which is parts territory. As in Example 8.3, \(\int u e^{u}\,du = (u - 1)e^{u} + C\), so</p>
        <p>\[ \int e^{\sqrt{x}}\,dx = 2\bigl(\sqrt{x} - 1\bigr)e^{\sqrt{x}} + C. \]</p>
        <p>Two techniques chained: a substitution to normalize the exponent, then parts to clear the leftover factor. Neither alone finishes the integral. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.25</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \frac{dx}{x\sqrt{\ln x}}\) for \(x &gt; 1\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>Step 2 settles this one before any classification: the factor \(\tfrac{dx}{x}\) is exactly the derivative of \(\ln x\), so \(u = \ln x\) is the obvious substitution, with \(u &gt; 0\) on the stated domain:</p>
        <p>\[ \int \frac{dx}{x\sqrt{\ln x}} = \int u^{-1/2}\,du = 2\sqrt{u} + C = 2\sqrt{\ln x} + C. \]</p>
        <p>An integrand that looks exotic can have a two-line solution. Checking for the visible \(du\) first is what keeps the heavier tools in reserve. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.26</span></p>
      <div class="env-body">
        <p>Find \(\displaystyle\int \sqrt{\frac{1 - x}{1 + x}}\,dx\) on \((-1, 1)\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>A rationalizing substitution in the style of Example 8.22 would work, but step 1 offers something faster. Multiply inside the root by \(\tfrac{1 - x}{1 - x}\):</p>
        <p>\[ \sqrt{\frac{1 - x}{1 + x}} = \sqrt{\frac{(1 - x)^{2}}{1 - x^{2}}} = \frac{1 - x}{\sqrt{1 - x^{2}}}, \]</p>
        <p>where dropping the absolute value is justified because \(1 - x &gt; 0\) on \((-1, 1)\). The integrand splits into two table entries:</p>
        <p>\[ \int \frac{dx}{\sqrt{1 - x^{2}}} - \int \frac{x}{\sqrt{1 - x^{2}}}\,dx = \arcsin x + \sqrt{1 - x^{2}} + C, \]</p>
        <p>the first from the table above with \(a = 1\), the second by the substitution \(w = 1 - x^{2}\), \(dw = -2x\,dx\). One algebraic move changed the problem’s class from “radical of a ratio” to “two standard forms”. That is what step 1 is for. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <!-- expansion:caution [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidates 8.5-a (mode-c-gapwalk A and B converged, BOTH ranked it high; the round's clearest "technique used repeatedly, never named" gap) + 8.5-b (mode-c-gapwalk B) merged into one paragraph. Verification by differentiation appears twelve times across §§8.1-8.4 (grep-verified: Ex 8.1, Ex 8.4, Prop 8.1's sec and csc proofs, §8.3's x<-a caution and Ex 8.15, §8.4's rationalizing close) and is never stated as a principle; meanwhile Strategy 8.6 step 4 tells the reader several routes may succeed without warning that their answers will look different, which is the self-taught reader's standard moment of doubt. §8.5 is the chapter's only meta section and Corollary 4.4 is already cited in §8.1's proof of Theorem 8.2. Delivered as prose, not as an env-caution box: this fragment's SEAM GUARD records that the section deliberately carries no Caution boxes (traps live with their techniques). authored. User adjudication 2026-07-27: adopt (T1 + T3, merged).] -->
  <p>Two remarks are worth adding here, one about step 1 and one about step 4. First, an algebraic rewriting need not hold on the whole domain. Dropping an absolute value, cancelling a factor, or extracting a square root can each change the set of \(x\) on which the two sides agree, and can do so silently, so name the interval at the moment you rewrite, as was done in Example 8.26.</p>

  <p>Second, when several routes succeed, their answers need not look alike. Two antiderivatives of the same function on the same interval differ by a constant (Corollary 4.4), and by nothing more, so an answer that looks different from another may still be correct. There are two ways to settle the question: differentiate and compare with the integrand, or subtract the two answers and simplify. This chapter already contains two such cases. In Example 8.8 the power-reduction answer looks unlike the one the reduction formula of Example 8.6 gives, and the two agree only after a double-angle identity; in Example 8.15 the two forms differ by the constant \(\ln a\).</p>

  <h3 class="subsec-head">The limits of the toolkit</h3>

  <!-- expansion:intuition [source: ③ B-02 adjudicated form — scope statement, no nonexistence claim, no Liouville credit; forward hooks to §8.6/§8.7] -->
  <p>A fair question after five sections of techniques: does every integrand now yield to the toolkit? Try the innocent-looking \(\int e^{-x^{2}}\,dx\). It is not a product, no substitution exposes an inner derivative, it is neither trigonometric nor rational, and no rewriting in this chapter changes that. None of the techniques of this book produces an antiderivative for it that is built from the functions we have named. Whether <em>any</em> formula of that kind exists is a question this book does not take up.</p>
  <p>What matters here is practical, and it is twofold. First, antiderivatives are not the only way to a definite integral: the next section shows that \(\int_{1}^{\infty} e^{-x^{2}}\,dx\) is a perfectly well-defined finite number even without a formula for its antiderivative. Second, when a number is what we need, §8.7’s rules compute it to any stated accuracy. The toolkit’s boundary is real, and the chapter’s last two sections are what lie on the far side of it.</p>
  <p>There are further systematic conversions beyond this book’s needs, including one that turns any rational expression in \(\sin x\) and \(\cos x\) into an ordinary rational function; the four steps above are enough for everything this book asks.</p>

  <!-- expansion:summary — close §8.5: the classification skill; forward to §8.6 with no mechanics -->
  <p>The strategy is short because the work was done in the sections it points to: simplify, check for a visible substitution, classify, and dispatch to the section that covers the form, chaining techniques when the first leaves a new form for the second. The four examples were each decided by the step named in their solutions, not by new machinery. What follows next is not another technique but a widening of the integral itself, to infinite intervals and unbounded integrands, where the first question is no longer “which tool” but “does this integral mean anything at all”.</p>

</article>

<article class="sec" lang="en">

  <header class="sec-head">
    <h2 class="sec-title"><span class="sec-no">8.6</span>Improper Integrals</h2>
  </header>

  <!-- expansion:intuition — section opener: the collision (Def 6.2 needs a closed interval + continuous integrand; the symbol has no meaning otherwise) and the one extension move: limits of proper integrals -->
  <p>Every integral so far has lived on a closed interval \([a, b]\): Definition 6.2 builds its Riemann sums from finitely many slices of a bounded interval, and for the continuous integrands this book evaluates, Theorem 6.1 guarantees the sums converge. Two natural questions leave that setting. What is the area under \(y = 1/x^{2}\) from \(x = 1\) out to infinity? And what is the area under \(y = 1/\sqrt{x - 2}\) from \(2\) to \(5\), where the integrand blows up at the left end? In both cases the symbol \(\int\) has, as it stands, no meaning: no Riemann sum machinery applies. But the book already owns a device for questions like these. Truncate to a proper integral, and ask what the truncations approach. For the first region, \(\int_{1}^{t} x^{-2}\,dx = 1 - \tfrac{1}{t}\), and as \(t\) grows these values settle toward \(1\). An endless region can hold a finite area, and a limit is how we say so. This section extends the integral by exactly that move, made twice: once for infinite intervals, once for unbounded integrands.</p>

  <h3 class="subsec-head">Type 1: infinite intervals</h3>

  <section class="env env-definition">
    <p class="env-head"><span class="env-kicker">Definition</span><span class="env-num">8.1</span><span class="env-name">Improper integral of Type 1</span></p>
    <div class="env-body">
      <p>(a) If \(f\) is continuous on \([a, \infty)\), then</p>
      <p>\[ \int_{a}^{\infty} f(x)\,dx = \lim_{t \to \infty} \int_{a}^{t} f(x)\,dx, \]</p>
      <p>provided the limit exists as a finite number; the improper integral is then called <em>convergent</em>, and <em>divergent</em> otherwise.</p>
      <p>(b) If \(f\) is continuous on \((-\infty, b]\), then \(\displaystyle\int_{-\infty}^{b} f(x)\,dx = \lim_{t \to -\infty} \int_{t}^{b} f(x)\,dx\), with the same vocabulary.</p>
      <p>(c) If \(f\) is continuous on \((-\infty, \infty)\), choose any number \(c\) and set</p>
      <p>\[ \int_{-\infty}^{\infty} f(x)\,dx = \int_{-\infty}^{c} f(x)\,dx + \int_{c}^{\infty} f(x)\,dx, \]</p>
      <p>provided <em>both</em> integrals on the right converge.</p>
    </div>
  </section>

  <p>The choice of \(c\) in part (c) does not matter: additivity (Theorem 6.2, part 3) shifts any finite stretch between the two halves without changing their sum, so one split point gives a convergent sum exactly when another does, with the same value. Note also what part (c) does <em>not</em> say; see the caution below.</p>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.27</span></p>
      <div class="env-body">
        <p>Decide whether each integral converges, and evaluate the convergent one:</p>
        <p>\[ \text{(a)}\ \int_{1}^{\infty} \frac{dx}{x}, \qquad \text{(b)}\ \int_{1}^{\infty} \frac{dx}{x^{2}}. \]</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>(a) For each \(t &gt; 1\),</p>
        <p>\[ \int_{1}^{t} \frac{dx}{x} = \Bigl[\ln x\Bigr]_{1}^{t} = \ln t, \]</p>
        <p>and \(\ln t\) grows without bound as \(t \to \infty\). The limit is not a finite number, so \(\int_{1}^{\infty} \tfrac{dx}{x}\) <em>diverges</em>.</p>
        <p>(b) For each \(t &gt; 1\),</p>
        <p>\[ \int_{1}^{t} \frac{dx}{x^{2}} = \Bigl[-\frac{1}{x}\Bigr]_{1}^{t} = 1 - \frac{1}{t} \longrightarrow 1, \]</p>
        <p>so \(\int_{1}^{\infty} \tfrac{dx}{x^{2}}\) <em>converges</em>, with value \(1\).</p>
        <p>The two curves look alike: both positive, both decreasing to \(0\). The verdicts differ because the tails thin at different rates. The values of \(1/x^{2}\) decay fast enough that the accumulated area stalls at \(1\); the values of \(1/x\) do not, and the area eventually passes any bound. How fast the integrand decays is the entire question, and the \(p\)-test below makes the boundary exact. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <figure class="figure" data-fig="tail-comparison">
    <figcaption><span class="fig-no">Figure 8.6</span> The tails of \(y = 1/x\) and \(y = 1/x^{2}\) on \([1, \infty)\). The curves meet only at \((1, 1)\) and both decay to \(0\); the darker region under \(1/x^{2}\) stalls at total area \(1\), while the region under \(1/x\) keeps growing as the cutoff \(t\) moves right. How fast the tail thins decides the verdict.</figcaption>
  </figure>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.28</span></p>
      <div class="env-body">
        <p>Evaluate \(\displaystyle\int_{-\infty}^{\infty} \frac{dx}{1 + x^{2}}\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>By Definition 8.1(c), split at \(c = 0\) and treat each half. For the right half,</p>
        <p>\[ \int_{0}^{t} \frac{dx}{1 + x^{2}} = \Bigl[\arctan x\Bigr]_{0}^{t} = \arctan t \longrightarrow \frac{\pi}{2}, \]</p>
        <p>since \(y = \tfrac{\pi}{2}\) is the horizontal asymptote of the arctangent (§1.2). By the symmetric computation, \(\int_{-t}^{0} \to \tfrac{\pi}{2}\) as well. Both halves converge, so the integral converges and</p>
        <p>\[ \int_{-\infty}^{\infty} \frac{dx}{1 + x^{2}} = \frac{\pi}{2} + \frac{\pi}{2} = \pi. \]</p>
        <p>An unbounded region whose area is exactly \(\pi\): the curve decays like \(1/x^{2}\) in both directions, fast enough for the \(p\)-test’s convergent side. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <section class="env env-caution">
    <p class="env-head"><span class="env-kicker">Caution</span></p>
    <div class="env-body">
      <p>Definition 8.1(c) requires both halves to converge <em>separately</em>. It is not the same as \(\lim_{t \to \infty}\int_{-t}^{t} f(x)\,dx\), and the difference matters. For \(f(x) = x\), every symmetric truncation gives \(\int_{-t}^{t} x\,dx = 0\), yet each half of \(\int_{-\infty}^{\infty} x\,dx\) diverges, so the integral diverges. Symmetric cancellation of two infinite areas is not convergence.</p>
    </div>
  </section>

  <!-- expansion:caution [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidate 8.6-b (mode-c-gapwalk B) — every divergent instance in the as-built section was of the unbounded-growth kind, so a reader generalizes "divergent = infinite", which is not what Def 8.1's "provided the limit exists as a finite number" says. The oscillating counterexample is fully in range (FTC-2 + one reason sentence). PLACEMENT (M4 scoped-sim regression fix, 2026-07-27): first sited immediately after Figure 8.6, which put it between Definition 8.1's pointer "see the caution below" and the principal-value Caution that pointer means; a blind learner-sim landed on the wrong box. Moved to sit AFTER the principal-value Caution, restoring the M1 pointer path (Ex 8.27, Fig 8.6, Ex 8.28 only) and pairing the two boxes that both say what a verdict does NOT mean. authored. User adjudication 2026-07-27: adopt (T1).] -->
  <section class="env env-caution">
    <p class="env-head"><span class="env-kicker">Caution</span></p>
    <div class="env-body">
      <p>Example 8.27(a) diverged because its truncations grew without bound, and that is the most familiar way for the limit to fail. It is not the only way. <em>Divergent</em> says that the limit is not a finite number, which also covers truncations that never settle. For \(f(x) = \cos x\), the truncations are \(\int_{0}^{t}\cos x\,dx = \sin t\), which returns to \(1\) and to \(-1\) again and again as \(t\) grows, so no single number is being approached and \(\int_{0}^{\infty}\cos x\,dx\) diverges. Divergence is the absence of a finite limit, not a claim that the area is infinite.</p>
    </div>
  </section>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.29</span></p>
      <div class="env-body">
        <p>Evaluate \(\displaystyle\int_{0}^{\infty} t e^{-t}\,dt\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>On each interval \([0, s]\), integrate by parts (Theorem 8.2) with \(u = t\), \(dv = e^{-t}\,dt\), so \(du = dt\) and \(v = -e^{-t}\):</p>
        <p>\[ \int_{0}^{s} t e^{-t}\,dt = \Bigl[-t e^{-t}\Bigr]_{0}^{s} + \int_{0}^{s} e^{-t}\,dt = -s e^{-s} + \bigl(1 - e^{-s}\bigr). \]</p>
        <p>As \(s \to \infty\), the exponential term \(e^{-s} \to 0\), and \(s e^{-s} = s/e^{s}\) is an \(\infty/\infty\) form that L’Hôpital’s Rule (Theorem 5.5) settles: the quotient has the same limit as \(1/e^{s}\), namely \(0\). So the truncations approach \(0 + 1 - 0\), and</p>
        <p>\[ \int_{0}^{\infty} t e^{-t}\,dt = 1. \]</p>
        <p>The techniques and the extended definition worked one after the other: parts produced the truncated value, and the limit made sense of the infinite interval. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <!-- expansion:application [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidate 8.6-d (mode-c-gapwalk A and B converged) — §8.6 carried no real-world connection at all (chapter-wide expansion:application count was 0 before this round), and "an unbounded region can hold a finite quantity" reads as a geometric curiosity without one. Mechanism entirely in place: Def 7.3 (Work) + Def 8.1 + the 1/x^2 computation of Ex 8.27(b). The inverse-square law enters as an empirical model, on the §7.4 Hooke's-law precedent. RED LINE honored: stops at "the work is finite"; no escape-velocity formula (that needs energy conservation, which this book has not built). PLACEMENT: moved here from just after Ex 8.28 in the same round, so that Definition 8.1's "see the caution below" pointer reaches the principal-value Caution without two asides in the way (scoped-sim regression fix). User adjudication 2026-07-27: adopt (T2).] -->
  <p>The convergence recorded in Example 8.27(b) has physical content. Newton’s inverse-square law, an empirical model in the same sense as Hooke’s law in §7.4, says that a body of mass \(M\) pulls a mass \(m\) at distance \(x\) with force \(GMm/x^{2}\). By Definition 7.3, the work needed to move the mass from the body’s surface, at distance \(R\) from its centre, out to distance \(t\) is</p>
  <p>\[ \int_{R}^{t} \frac{GMm}{x^{2}}\,dx = GMm\Bigl(\frac{1}{R} - \frac{1}{t}\Bigr) \longrightarrow \frac{GMm}{R}, \]</p>
  <p>so the improper integral converges: moving the mass arbitrarily far from the body requires only a finite amount of work. The reason is the one Example 8.27(b) recorded: the exponent \(2\) sits on the convergent side of the boundary.</p>

  <!-- expansion:application [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidate 8.6-f (mode-c-gapwalk A and B converged; user adjudicated adopt). PLAN-ch08 §Excluded permits "§8.6 one-sentence aside at most" — this is exactly one sentence. Written on the TRUNCATED solid so that Theorem 7.4, which is stated on [a,b], is never applied to an infinite surface; both quantities are described as approaching / growing without bound. Volume uses Ex 8.27(b)'s 1/x^2, surface uses Ex 8.27(a)'s 1/x: the same curve lands on both sides of the p-test. The Theorem 7.4 integrand is written out inline after a blind learner-sim reported the "at least" step as unjustified. PLACEMENT: moved here with 8.6-d, same regression fix.] -->
  <p>Example 8.27’s two verdicts can be produced by one curve: rotating \(y = 1/x\) on \([1, t]\) about the \(x\)-axis gives a solid, traditionally called Gabriel’s horn, whose volume \(\int_{1}^{t}\pi x^{-2}\,dx\) approaches \(\pi\), while its lateral surface area is at least \(\int_{1}^{t} 2\pi x^{-1}\,dx = 2\pi\ln t\) and grows without bound as \(t\) does, since the Theorem 7.4 integrand \(2\pi x^{-1}\sqrt{1 + x^{-4}}\) is never smaller than \(2\pi x^{-1}\) (Theorem 6.2, part 4).</p>

  <h3 class="subsec-head">Type 2: unbounded integrands</h3>

  <p>The second violation keeps the interval finite but lets the integrand blow up at an endpoint. The extension move is the same: truncate short of the bad point, and take a limit.</p>

  <section class="env env-definition">
    <p class="env-head"><span class="env-kicker">Definition</span><span class="env-num">8.2</span><span class="env-name">Improper integral of Type 2</span></p>
    <div class="env-body">
      <p>(a) If \(f\) is continuous on \([a, b)\) and unbounded near \(b\), then</p>
      <p>\[ \int_{a}^{b} f(x)\,dx = \lim_{t \to b^{-}} \int_{a}^{t} f(x)\,dx, \]</p>
      <p>provided the limit exists as a finite number; the integral is then <em>convergent</em>, and <em>divergent</em> otherwise.</p>
      <p>(b) If \(f\) is continuous on \((a, b]\) and unbounded near \(a\), then \(\displaystyle\int_{a}^{b} f(x)\,dx = \lim_{t \to a^{+}} \int_{t}^{b} f(x)\,dx\), with the same vocabulary.</p>
      <p>(c) If \(f\) is unbounded near an interior point \(c\) of \([a, b]\) and continuous elsewhere on the interval, split there: \(\displaystyle\int_{a}^{b} f(x)\,dx = \int_{a}^{c} f(x)\,dx + \int_{c}^{b} f(x)\,dx\), provided <em>both</em> halves converge.</p>
    </div>
  </section>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.30</span></p>
      <div class="env-body">
        <p>Decide whether each integral converges, and evaluate where possible:</p>
        <p>\[ \text{(a)}\ \int_{2}^{5} \frac{dx}{\sqrt{x - 2}}, \qquad \text{(b)}\ \int_{0}^{1} \frac{dx}{x^{p}} \ \text{ for } p &gt; 0. \]</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>(a) The integrand is continuous on \((2, 5]\) and unbounded near \(2\), so Definition 8.2(b) applies. For \(2 &lt; t &lt; 5\),</p>
        <p>\[ \int_{t}^{5} \frac{dx}{\sqrt{x - 2}} = \Bigl[2\sqrt{x - 2}\Bigr]_{t}^{5} = 2\sqrt{3} - 2\sqrt{t - 2} \longrightarrow 2\sqrt{3} \]</p>
        <p>as \(t \to 2^{+}\). This answers the opener’s second question: the integral converges to \(2\sqrt{3}\), because the spike at \(x = 2\) is tall but thin enough.</p>
        <p>(b) For \(p \ne 1\) and \(0 &lt; t &lt; 1\),</p>
        <p>\[ \int_{t}^{1} x^{-p}\,dx = \frac{1 - t^{1 - p}}{1 - p}. \]</p>
        <p>If \(p &lt; 1\), then \(t^{1-p} \to 0\) as \(t \to 0^{+}\), and the integral converges to \(\tfrac{1}{1 - p}\). If \(p &gt; 1\), then \(t^{1-p}\) grows without bound and the integral diverges; for \(p = 1\), \(\int_{t}^{1} \tfrac{dx}{x} = -\ln t\) also grows without bound. So \(\int_{0}^{1} x^{-p}\,dx\) converges exactly when \(p &lt; 1\). This is the mirror image of the \(p\)-test proved below: at \(0\) the mild powers \((p &lt; 1)\) converge, at \(\infty\) the steep ones \((p &gt; 1)\) do, and \(p = 1\) fails at both ends. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <figure class="figure" data-fig="type2-truncation">
    <figcaption><span class="fig-no">Figure 8.7</span> The truncation of Definition 8.2(b) for \(\int_{2}^{5} dx/\sqrt{x - 2}\): the region from \(t\) to \(5\) is a proper integral, and as \(t \to 2^{+}\) the limit captures the lighter sliver against the asymptote. The spike at \(x = 2\) is tall but thin enough for the limit to stay finite.</figcaption>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.31</span></p>
      <div class="env-body">
        <p>What is wrong with the computation \(\displaystyle\int_{-1}^{3} \frac{dx}{x^{2}} = \Bigl[-\frac{1}{x}\Bigr]_{-1}^{3} = -\frac{1}{3} - 1 = -\frac{4}{3}\)?</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>The answer refutes itself: the integrand is positive, and a definite integral of a positive function cannot be negative (Theorem 6.2, part 4). The error is upstream. The Fundamental Theorem applies to integrands continuous on the whole interval, and \(1/x^{2}\) is unbounded near the interior point \(0\). The integral is improper, and Definition 8.2(c) requires splitting there:</p>
        <p>\[ \int_{-1}^{3} \frac{dx}{x^{2}} = \int_{-1}^{0} \frac{dx}{x^{2}} + \int_{0}^{3} \frac{dx}{x^{2}}, \]</p>
        <p>provided both halves converge. They do not: near \(0\) the integrand is a \(p = 2\) power, and by the computation of Example 8.30(b), repeated on the interval \((0, 3]\), the right half diverges. So \(\int_{-1}^{3} x^{-2}\,dx\) diverges, and the number \(-\tfrac{4}{3}\) was meaningless. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <section class="env env-caution">
    <p class="env-head"><span class="env-kicker">Caution</span></p>
    <div class="env-body">
      <p>Before applying the Fundamental Theorem on \([a, b]\), check the whole interval for points where the integrand is undefined or unbounded. A singularity in the interior does not announce itself in the limits of integration, and integrating across it, as in Example 8.31, produces a definite-looking number with no meaning. If a singularity is found, split there and test each piece by Definition 8.2.</p>
    </div>
  </section>

  <h3 class="subsec-head">The \(p\)-test and the Comparison Theorem</h3>

  <p>Example 8.27’s contrast has an exact boundary, and it is worth finding. The family \(\int_{1}^{\infty} x^{-p}\,dx\) converges or diverges according to the exponent, and the result is used often enough to record permanently.</p>

  <section class="env env-proposition">
    <p class="env-head"><span class="env-kicker">Proposition</span><span class="env-num">8.2</span><span class="env-name">The \(p\)-test</span></p>
    <div class="env-body">
      <p>The improper integral</p>
      <p>\[ \int_{1}^{\infty} \frac{dx}{x^{p}} \]</p>
      <p>converges if \(p &gt; 1\), with value \(\dfrac{1}{p - 1}\), and diverges if \(p \le 1\).</p>
    </div>
  </section>

  <section class="env env-proof">
    <p class="env-head"><span class="env-kicker">Proof</span></p>
    <div class="env-body">
      <p>For \(p \ne 1\), the power rule gives, for \(t &gt; 1\),</p>
      <p>\[ \int_{1}^{t} x^{-p}\,dx = \frac{t^{1 - p} - 1}{1 - p}. \]</p>
      <p>If \(p &gt; 1\), the exponent \(1 - p\) is negative, so \(t^{1-p} \to 0\) and the truncations approach \(\tfrac{-1}{1 - p} = \tfrac{1}{p - 1}\): convergence, with the stated value. If \(p &lt; 1\), the exponent is positive, \(t^{1-p}\) grows without bound, and the integral diverges. This already covers \(p \le 0\), where the integrand does not even tend to \(0\): there \(x^{-p} \ge 1\) on \([1, \infty)\), so \(\int_{1}^{t} x^{-p}\,dx \ge t - 1\) by comparison (Theorem 6.2, part 4), and divergence is direct. Finally, for \(p = 1\), Example 8.27(a) showed the truncations equal \(\ln t\), which grows without bound. <span class="qed qed-proof"></span></p>
    </div>
  </section>

  <p>The last tool answers a question the \(p\)-test cannot. Section 8.5 met \(\int e^{-x^{2}}\,dx\), an integrand for which none of our techniques produces an antiderivative, so no truncation can be evaluated in closed form and the definition cannot be applied directly. Yet convergence is a question about <em>size</em>, not about formulas. If a positive integrand sits below one whose improper integral converges, its accumulated area is trapped below a finite ceiling, and it should have nowhere to go but a limit. The next theorem makes that argument honest, and its proof is the section’s one genuinely theoretical moment: everything comes from machinery the book already owns.</p>

  <section class="env env-theorem">
    <p class="env-head"><span class="env-kicker">Theorem</span><span class="env-num">8.3</span><span class="env-name">Comparison Theorem for Improper Integrals</span></p>
    <div class="env-body">
      <p>Let \(f\) and \(g\) be continuous with \(0 \le f(x) \le g(x)\) for \(x \ge a\).</p>
      <p>(a) If \(\displaystyle\int_{a}^{\infty} g(x)\,dx\) converges, then \(\displaystyle\int_{a}^{\infty} f(x)\,dx\) converges, and its value is at most \(\displaystyle\int_{a}^{\infty} g(x)\,dx\).</p>
      <p>(b) If \(\displaystyle\int_{a}^{\infty} f(x)\,dx\) diverges, then \(\displaystyle\int_{a}^{\infty} g(x)\,dx\) diverges.</p>
    </div>
  </section>

  <section class="env env-proof">
    <p class="env-head"><span class="env-kicker">Proof</span></p>
    <div class="env-body">
      <p>(a) Write \(F(t) = \int_{a}^{t} f(x)\,dx\) and \(G(t) = \int_{a}^{t} g(x)\,dx\), and let \(M = \int_{a}^{\infty} g(x)\,dx\), the finite limit assumed to exist. Three observations set up the argument.</p>
      <p>First, \(F\) is increasing: for \(t' &gt; t\), additivity (Theorem 6.2, part 3) gives \(F(t') - F(t) = \int_{t}^{t'} f(x)\,dx \ge 0\), since \(f \ge 0\) (Theorem 6.2, part 4). The same reasoning makes \(G\) increasing.</p>
      <p>Second, \(G(t) \le M\) for every \(t\). An increasing function cannot overshoot its own limit: if some \(G(t_{0})\) exceeded \(M\), then every later \(G(t)\) would be at least \(G(t_{0})\), and the values could not approach \(M\).</p>
      <p>Third, \(F(t) \le G(t)\) for every \(t\), by comparison on \([a, t]\) (Theorem 6.2, part 4). Combining: \(F\) is increasing and \(F(t) \le M\) for all \(t \ge a\).</p>
      <p>Now sample \(F\) along the integers, since Theorem 4.1’s monotone principle speaks of sequences, not of functions of a real variable. The numbers \(F(a + n)\), for \(n = 1, 2, 3, \dots\), form an increasing sequence bounded above by \(M\), so by Theorem 4.1 they converge to some limit \(L \le M\). Since an increasing sequence cannot overshoot its own limit, each \(F(a + n) \le L\).</p>
      <p>Finally, the sampled limit controls the whole function. Given any \(t \ge a + 1\), let \(n\) be the greatest integer not exceeding \(t - a\), so that \(a + n \le t &lt; a + n + 1\). Since \(F\) is increasing,</p>
      <p>\[ F(a + n) \;\le\; F(t) \;\le\; F(a + n + 1) \;\le\; L. \]</p>
      <p>As \(t \to \infty\), the index \(n\) grows with it, and \(F(a + n)\) approaches \(L\). Every value \(F(t)\) is thus squeezed between numbers that approach \(L\) and the ceiling \(L\) itself, so \(F(t) \to L\). By Definition 8.1, \(\int_{a}^{\infty} f(x)\,dx\) converges, with value \(L \le M\).</p>
      <p>(b) This is the contrapositive of (a): if \(\int_{a}^{\infty} g\) converged, then (a) would force \(\int_{a}^{\infty} f\) to converge as well. <span class="qed qed-proof"></span></p>
    </div>
  </section>

  <section class="env env-caution">
    <p class="env-head"><span class="env-kicker">Caution</span></p>
    <div class="env-body">
      <p>Theorem 8.3 assumes \(0 \le f(x) \le g(x)\), and that assumption cannot be dropped. For an integrand that changes sign, a comparison of this kind yields nothing at all: the proof of Theorem 8.3 rests on \(F\) being increasing, which fails once \(f\) takes negative values, so neither convergence nor divergence follows. Such integrals are outside what this book takes up; every comparison in this chapter therefore begins by checking that both integrands are non-negative.</p>
    </div>
  </section>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.32</span></p>
      <div class="env-body">
        <p>Show that \(\displaystyle\int_{1}^{\infty} e^{-x^{2}}\,dx\) converges.</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>For \(x \ge 1\) we have \(x^{2} \ge x\), so \(-x^{2} \le -x\), and since the exponential function is increasing, \(0 &lt; e^{-x^{2}} \le e^{-x}\). The larger integrand’s integral converges by direct computation:</p>
        <p>\[ \int_{1}^{t} e^{-x}\,dx = e^{-1} - e^{-t} \longrightarrow \frac{1}{e}. \]</p>
        <p>By the Comparison Theorem (Theorem 8.3(a)), \(\int_{1}^{\infty} e^{-x^{2}}\,dx\) converges, with value at most \(\tfrac{1}{e}\). Over \([0, \infty)\) the conclusion extends at once, since \(\int_{0}^{1} e^{-x^{2}}\,dx\) is an ordinary proper integral: the full integral \(\int_{0}^{\infty} e^{-x^{2}}\,dx\) converges too.</p>
        <p>This answers the question §8.5 left open. We have no formula for its antiderivative, yet the improper integral is a definite finite number, pinned down without ever being evaluated. Section 8.7 is about computing such numbers. <span class="qed"></span></p>
      </div>
    </section>
  </div>

    <figcaption><span class="fig-no">Figure 8.10</span> The Comparison Theorem’s trap in Example 8.32: on \([1, \infty)\) the graph of \(e^{-x^{2}}\) runs below \(e^{-x}\), whose tail holds the finite area \(1/e\), so the darker region is confined below a finite roof. The curves meet at \(x = 1\) and separate at a visible angle.</figcaption>
  </figure>

  <!-- expansion:example [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidate 8.6-E1 (example-supplement §8.5–8.7) — Layer 1: Theorem 8.3 states two parts and only (a) had a worked instance (grep-verified: the sole in-text citation of Thm 8.3 was Ex 8.32, part (a)). Teaches the direction discipline: to prove divergence the known-divergent integral must be the LOWER bound. Adapted from APEX Calculus V5, text/06_Improper_Integration.tex (CC BY-NC 4.0): same integral, same comparison, official solution complete. Rewrite delta: citations retargeted to this book's numbering; APEX's "for large x, 1/sqrt(x^2-x) ~ 1/x" heuristic opening replaced by the hypothesis check this section uses throughout; steps 5 and 6 are authored (not in the source) and carry the teaching point. sympy-recomputed at the M4 sweep. User adjudication 2026-07-27: adopt.] -->
  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.33</span></p>
      <div class="env-body">
        <p>Show that \(\displaystyle\int_{3}^{\infty} \frac{dx}{\sqrt{x^{2} - x}}\) diverges.</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>First check the hypotheses. On \([3, \infty)\) we have \(x^{2} - x = x(x - 1) \ge 6\), so the integrand is defined, continuous, and positive there.</p>
        <p>Divergence is the target, so by Theorem 8.3(b) the integrand must be placed <em>above</em> something already known to diverge. For \(x \ge 3\), \(0 &lt; x^{2} - x &lt; x^{2}\), and taking square roots gives \(\sqrt{x^{2} - x} &lt; x\). Reciprocals reverse the inequality:</p>
        <p>\[ 0 \;&lt;\; \frac{1}{x} \;&lt;\; \frac{1}{\sqrt{x^{2} - x}} \qquad (x \ge 3). \]</p>
        <p>In the notation of Theorem 8.3 this makes \(f(x) = 1/x\) the lower function and \(g(x) = 1/\sqrt{x^{2} - x}\) the upper one, both continuous on \([3, \infty)\). The lower integral diverges: \(\int_{3}^{t}\tfrac{dx}{x} = \ln t - \ln 3\) by §6.4 and Theorem 6.4, and this grows without bound, so Definition 8.1(a) records divergence. This is Example 8.27(a)’s computation from a different starting point.</p>
        <p>Theorem 8.3(b) therefore gives that \(\int_{3}^{\infty}\tfrac{dx}{\sqrt{x^{2} - x}}\) diverges.</p>
        <p>Getting the direction right is the whole point here. It is just as easy to check that \(\tfrac{1}{\sqrt{x^{2}-x}} \le \tfrac{2}{x}\) on \([3, \infty)\): after squaring and clearing denominators, this is the inequality \(3x^{2} \ge 4x\). The integral \(\int_{3}^{\infty}\tfrac{2\,dx}{x}\) diverges as well. That comparison proves nothing: a divergent upper bound carries no information. To establish divergence, the known-divergent integral has to be the one underneath.</p>
        <p>This integrand does have an antiderivative, reachable by completing the square and a secant substitution (§8.3). Deciding convergence did not require it. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <!-- expansion:caution [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidate 8.6-a (mode-c-gapwalk A, its top-ranked item) — Thm 8.3 reads symmetrically enough that all four combinations look available; getting the direction wrong is the standard misuse. Zero new mathematics: the counterexample is Example 8.27 reused verbatim. Complements the new Ex 8.33, which shows the direction that DOES work. authored. User adjudication 2026-07-27: adopt (T1).] -->
  <section class="env env-caution">
    <p class="env-head"><span class="env-kicker">Caution</span></p>
    <div class="env-body">
      <p>Even when \(0 \le f \le g\) does hold, only two of the four ways of pairing a function with a verdict give a conclusion, and Example 8.33 has just used one of those two. The other two give nothing: if \(\int_{a}^{\infty} f\) converges, no conclusion follows about \(\int_{a}^{\infty} g\); if \(\int_{a}^{\infty} g\) diverges, none follows about \(\int_{a}^{\infty} f\). Example 8.27 supplies a counterexample to both at once: on \([1, \infty)\) we have \(1/x^{2} \le 1/x\), the smaller integral converges, and the larger one diverges. Decide first which verdict you are trying to prove, then look for a comparison function on the matching side.</p>
    </div>
  </section>

  <!-- expansion:intuition [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidate 8.6-c (mode-c-gapwalk B) — Def 8.1(c)'s split-point paragraph and Ex 8.32's closing move each did half of this, but the principle was never stated, and without it Theorem 8.3 reads as requiring its inequality on ALL of [a, infinity), which stalls any comparison that only starts holding later. Uses additivity (Thm 6.2 part 3), already cited several times in this section. REVISED at the M4 scoped Mode B (2026-07-27): the closing sentence originally carried its condition on the adjectives "awkward" and "well behaved", which in a section that has just taught Type 2 reads as "unbounded on [a,b]" and would make the recipe's own proper integral improper; and it credited Example 8.32 with a case Example 8.32 is not (its integrand is perfectly ordinary on [0,1]; it is the COMPARISON that only starts at x = 1). Both repaired literally. PLACEMENT: moved ahead of the "Mixed cases" paragraph in the same round, so that paragraph keeps its role as the section's closing beat (a blind learner-sim reported the principle arriving after the closure, and reported the same principle being used in Ex 8.32 before being stated). authored. User adjudication 2026-07-27: adopt (T1).] -->
  <p>One consequence of additivity deserves stating on its own: convergence is decided by the tail. Attaching or removing a proper integral over a finite interval changes the value but not the verdict (Theorem 6.2, part 3). The practical use is that a comparison need not hold from the very start. If \(0 \le f \le g\) only for \(x \ge b\), with \(b &gt; a\), split \(\int_{a}^{\infty} f\) at \(b\), apply Theorem 8.3 to \(\int_{b}^{\infty} f\), and add back \(\int_{a}^{b} f\), which is an ordinary proper integral whenever \(f\) is continuous on \([a, b]\) (Theorem 6.1). Example 8.32 did exactly this: its comparison \(e^{-x^{2}} \le e^{-x}\) holds only for \(x \ge 1\), so the verdict obtained on \([1, \infty)\) carried across to \([0, \infty)\).</p>

  <p>Mixed cases reduce to the two types. An integral such as \(\int_{0}^{\infty} \tfrac{dx}{\sqrt{x}(1 + x)}\) is improper twice, at the endpoint \(0\) and along the infinite tail; split it at any interior point, say \(1\), and require each piece to converge by its own definition. In every case the procedure is the same: locate each point where the integral is improper, isolate it at one end of one integral, and apply the matching definition or the Comparison Theorem.</p>

  <!-- expansion:summary — close §8.6: the extension move + the two tools; forward clause = Ch11 §11.3 export contract; forward to §8.7 -->
  <p>This section widened the integral without touching its foundations: an improper integral is a limit of proper ones, and <em>convergent</em> is a verdict about that limit. Definitions 8.1 and 8.2 cover the infinite interval and the unbounded integrand, the \(p\)-test (Proposition 8.2) marks the exact boundary between thick and thin tails, and the Comparison Theorem (Theorem 8.3), proved with the monotone-sequence principle of Chapter 4, delivers verdicts when no antiderivative is available. These three results will be used again: Chapter 11’s Integral Test for infinite series is built directly on them. What this section does not do is produce numbers for integrals like \(\int_{1}^{\infty} e^{-x^{2}}\,dx\); it only certifies that the numbers exist. Producing them, to any stated accuracy, is the business of the chapter’s final section.</p>

<article class="sec" lang="en">

  <header class="sec-head">
    <h2 class="sec-title"><span class="sec-no">8.7</span>Approximate Integration</h2>
  </header>

  <!-- expansion:intuition — section opener: the clients from §8.6/§8.3/§7.6 + the bracketing collision (L over, R under, truth between two computable numbers) -->
  <p>The chapter has accumulated integrals that no formula reaches: \(\int_{1}^{\infty} e^{-x^{2}}\,dx\), certified finite in §8.6 but never evaluated; the perimeter of an ellipse, which §8.3 flagged; the arc lengths that §7.6 left standing as definite integrals. And in laboratory work the integrand is often not a formula at all, only a column of measured values. For all of these, the practical question is the same: how do we get the <em>number</em>? The answer begins with an observation from §6.1’s first area estimates. For a decreasing integrand, a left-endpoint sum overshoots and a right-endpoint sum undershoots, so the true value sits between two numbers we can compute. Once the target is bracketed, the task is to tighten the bracket, and this section’s three rules tighten it dramatically: each replaces the integrand on every slice by something integrable exactly, first a constant, then a chord, then a parabola.</p>

  <p>Fix the notation once. Divide \([a, b]\) into \(n\) slices of equal width \(h = \tfrac{b - a}{n}\), with nodes \(x_{i} = a + ih\) for \(i = 0, 1, \dots, n\), and write \(y_{i} = f(x_{i})\). For each rule \(R\), the <em>error</em> is \(E_{R} = \int_{a}^{b} f(x)\,dx - R\): exact value minus approximation, so a positive error means the rule fell short.</p>

  <h3 class="subsec-head">The Midpoint and Trapezoidal Rules</h3>

  <p>The first rule needs no new idea. Choose the midpoint \(\bar{x}_{i} = \tfrac{1}{2}(x_{i-1} + x_{i})\) of each slice and replace \(f\) there by the constant \(f(\bar{x}_{i})\):</p>
  <p>\[ \int_{a}^{b} f(x)\,dx \;\approx\; M_{n} = h\,\bigl[f(\bar{x}_{1}) + f(\bar{x}_{2}) + \cdots + f(\bar{x}_{n})\bigr]. \tag{M} \]</p>
  <p>This is a Riemann sum in the sense of Definition 6.2, with the sample points taken at midpoints, a choice that §6.2 reserved for exactly this use. For continuous \(f\), Theorem 6.1 guarantees that \(M_{n}\) converges to the integral as \(n\) grows; the question this section adds is how fast.</p>

  <!-- expansion:intuition [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidate 8.7-e (mode-c-gapwalk B) — §8.6 has just finished with integrands that blow up at an endpoint, and the natural reader question (can M be pointed at those?) had no answer; the note also blocks the over-inference. authored. User adjudication 2026-07-27: adopt (T3).] -->
  <p>Unlike the two rules that follow, this rule never evaluates \(f\) at an endpoint of \([a, b]\), which is a practical advantage when the integrand is undefined or hard to evaluate there. The error bound below does not inherit that advantage. Theorem 8.4 requires \(f''\) to be continuous on all of \([a, b]\), endpoints included, so an integrand that is undefined or unbounded at an endpoint loses its guarantee even though the rule still returns a number.</p>

  <p>The second rule replaces \(f\) on each slice by the chord joining \(\bigl(x_{i-1}, y_{i-1}\bigr)\) to \(\bigl(x_{i}, y_{i}\bigr)\). The region under a chord is a trapezoid with parallel sides \(y_{i-1}\) and \(y_{i}\) and width \(h\), so its area is \(h\cdot\tfrac{y_{i-1} + y_{i}}{2}\), and summing over the slices gives</p>
  <p>\[ \int_{a}^{b} f(x)\,dx \;\approx\; T_{n} = \frac{h}{2}\,\bigl[y_{0} + 2y_{1} + 2y_{2} + \cdots + 2y_{n-1} + y_{n}\bigr]. \tag{T} \]</p>
  <p>Every interior node is shared by two trapezoids, which is where the repeated factor \(2\) comes from. The same formula arrives by a second route. The left-endpoint and right-endpoint Riemann sums are \(L_{n} = h\sum_{i=1}^{n} y_{i-1}\) and \(R_{n} = h\sum_{i=1}^{n} y_{i}\), and averaging them termwise pairs each interior value with itself:</p>
  <p>\[ \frac{L_{n} + R_{n}}{2} = \frac{h}{2}\sum_{i=1}^{n}\bigl(y_{i-1} + y_{i}\bigr) = \frac{h}{2}\bigl[y_{0} + 2y_{1} + \cdots + 2y_{n-1} + y_{n}\bigr] = T_{n}. \]</p>
  <p>The averaging reading connects the rule to the bracketing picture above: for a monotone integrand the integral lies between \(L_{n}\) and \(R_{n}\), and \(T_{n}\) is the bracket’s midpoint, so the trapezoidal error is at most half the bracket’s width.</p>

  </figure>

    <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.34</span></p>
      <div class="env-body">
        <p>Approximate \(\displaystyle\int_{1}^{2} \frac{dx}{x}\) with \(n = 5\) by the Trapezoidal Rule and by the Midpoint Rule, and compare each result with the true value.</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>Here \(h = 0.2\), the nodes are \(1, 1.2, 1.4, 1.6, 1.8, 2\), and the midpoints are \(1.1, 1.3, 1.5, 1.7, 1.9\). The Trapezoidal Rule (T) gives</p>
        <p>\[ T_{5} = \frac{0.2}{2}\Bigl[\frac{1}{1} + \frac{2}{1.2} + \frac{2}{1.4} + \frac{2}{1.6} + \frac{2}{1.8} + \frac{1}{2}\Bigr] \approx 0.695635, \]</p>
        <p>and the Midpoint Rule (M) gives</p>
        <p>\[ M_{5} = 0.2\,\Bigl[\frac{1}{1.1} + \frac{1}{1.3} + \frac{1}{1.5} + \frac{1}{1.7} + \frac{1}{1.9}\Bigr] \approx 0.691908. \]</p>
        <p>The true value is \(\int_{1}^{2}\tfrac{dx}{x} = \ln 2 \approx 0.693147\), so the errors are</p>
        <p>\[ E_{T} \approx -0.002488, \qquad E_{M} \approx +0.001239. \]</p>
        <p>Two patterns are worth noticing, and both persist beyond this example. The midpoint error is about half the trapezoidal error in size, and the two have opposite signs: the chords of a curve that bends upward lie above it, so \(T_{5}\) overshoots, while the midpoint rectangles compensate through the tilt of the tangent, as Figure 8.12 shows. The error bounds below make the sizes unsurprising, since the midpoint bound has \(24\) in its denominator where the trapezoidal bound has \(12\), which makes the midpoint bound half the size. The bounds control only the errors’ magnitudes, not their signs or their exact ratio. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <!-- expansion:figure [pass: enrichment] [source: figure-opportunity gate 2026-07-26 tier-medium — the standard picture behind the 24-vs-12 constants; gate MODIFY applied: MOVED after Ex 8.34 (the sentence it annotates), concave-up slice, tangent below / chord above, no exact-half claim in caption; adjudicated adopt-all-13 (user decision); registered in chapter8 FIGS as "midpoint-tangent-trap"] -->
