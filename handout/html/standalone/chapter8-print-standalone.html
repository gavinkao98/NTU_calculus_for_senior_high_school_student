  </figure>

  <h3 class="subsec-head">Simpson’s Rule</h3>

  <p>Chords match the curve’s value at two points but ignore its bending. The next upgrade replaces \(f\), on each <em>pair</em> of adjacent slices, by the parabola through the three nodes the pair provides. One small lemma does all the work: the integral of a quadratic over a symmetric interval is determined by its three equally spaced values. For \(g(x) = Ax^{2} + Bx + C\) on \([-h, h]\),</p>
  <p>\[ \int_{-h}^{h} g(x)\,dx = \frac{2Ah^{3}}{3} + 2Ch = \frac{h}{3}\bigl(2Ah^{2} + 6C\bigr), \]</p>
  <p>while the values \(y_{0} = g(-h) = Ah^{2} - Bh + C\), \(y_{1} = g(0) = C\), \(y_{2} = g(h) = Ah^{2} + Bh + C\) combine to \(y_{0} + 4y_{1} + y_{2} = 2Ah^{2} + 6C\). Therefore</p>
  <p>\[ \int_{-h}^{h} g(x)\,dx = \frac{h}{3}\bigl(y_{0} + 4y_{1} + y_{2}\bigr), \]</p>
  <p>and \(B\) has dropped out entirely. Shifting the variable does not change an integral (Theorem 6.7 with a linear substitution), so the same weights \(1, 4, 1\) serve on any triple of equally spaced nodes. Now cover \([a, b]\) by \(\tfrac{n}{2}\) such triples, which requires \(n\) to be <em>even</em>, and add: each pair of slices contributes \(\tfrac{h}{3}(y_{i-1} + 4y_{i} + y_{i+1})\) for \(i = 1, 3, \dots, n - 1\), an interior even-indexed node is shared by two pairs, and the sum of all the contributions is <em>Simpson’s Rule</em>:</p>
  <p>\[ \begin{aligned}
    \int_{a}^{b} f(x)\,dx \;\approx\; S_{n} = \frac{h}{3}\,\bigl[y_{0} &+ 4y_{1} + 2y_{2} + 4y_{3} + \cdots \\
      &+ 2y_{n-2} + 4y_{n-1} + y_{n}\bigr].
  \end{aligned} \tag{S} \]</p>

  <section class="env env-caution">
    <p class="env-head"><span class="env-kicker">Caution</span></p>
    <div class="env-body">
      <p>Simpson’s Rule pairs the slices, so it needs an even number of them. The weight pattern runs \(1, 4, 2, 4, 2, \dots, 2, 4, 1\): the \(4\)s sit on the odd-indexed nodes, the \(2\)s on the interior even-indexed ones, and only the two endpoints carry weight \(1\). An odd \(n\), or a misaligned weight pattern, silently produces a wrong answer.</p>
    </div>
  </section>

  <!-- expansion:history [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidate 8.7-c (mode-c-gapwalk A and B converged; A's unnamed version adopted). Verbatim-checked against problem_banks/APEXCalculusV5/ptx/sec_numerical_integration.ptx L574–576: "named after Thomas Simpson (1710-1761), even though others had used this rule as much as 100 years prior" — the source names no predecessor, so this book names none either (gapwalk B proposed Kepler/Gregory; declined for lack of a checked source). APEX = CC BY-NC-SA. First expansion:history marker in Ch8. User adjudication 2026-07-27: adopt (T2).] -->
  <p>The rule carries the name of Thomas Simpson (1710–1761), although the same three-point weights were in use about a century before him.</p>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.35</span></p>
      <div class="env-body">
        <p>Approximate \(\displaystyle\int_{1}^{2} \frac{dx}{x}\) by Simpson’s Rule with \(n = 10\).</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>Here \(h = 0.1\) and the nodes run \(1, 1.1, 1.2, \dots, 2\). Applying (S) with \(f(x) = 1/x\):</p>
        <p>\[ \begin{aligned}
          S_{10} = \frac{0.1}{3}\Bigl[\frac{1}{1} &+ \frac{4}{1.1} + \frac{2}{1.2} + \frac{4}{1.3} + \frac{2}{1.4} + \frac{4}{1.5} \\
            &+ \frac{2}{1.6} + \frac{4}{1.7} + \frac{2}{1.8} + \frac{4}{1.9} + \frac{1}{2}\Bigr] \approx 0.693150.
        \end{aligned} \]</p>
        <p>Against \(\ln 2 \approx 0.693147\), the error is about \(-3 \times 10^{-6}\). Example 8.34’s rules, using half as many nodes, erred in the third decimal place; Simpson’s Rule with these ten slices is already correct to five. The jump matches the scales recorded in the bounds below: the trapezoidal bound shrinks like \(1/n^{2}\), the Simpson bound like \(1/n^{4}\), and the errors observed here behave accordingly. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <!-- expansion:formula [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidate 8.7-b (mode-c-gapwalk A and B converged on the gap by different routes; B's route adopted). The chapter's only unexplained logical jump: the text says "and for Simpson's Rule the fourth" with no reason given, right after Ex 8.35 showed a dramatic accuracy jump. B's route extends THIS SECTION'S OWN proved lemma (odd term integrates to zero, weighted combination cancels) instead of leaning on the on-credit Theorem 8.4, which matters in a chapter whose design turns on exactly two credits; A's Thm 8.4 route (K_4 = 0) is kept as the closing cross-check. A's route is sourced to APEX Calculus V5 sec_numerical_integration L1021–1027, CC BY-NC-SA, verbatim-checked. authored. User adjudication 2026-07-27: adopt (T1).] -->
  <p>The size of that jump has a reason the lemma above already contains. Add a cubic term \(Dx^{3}\) to the quadratic \(g\). Over \([-h, h]\) it integrates to \(0\), because \(x^{3}\) is odd (Theorem 6.8), and in the weighted combination it contributes \(D(-h)^{3} + 4 \cdot 0 + Dh^{3} = 0\) as well. Neither side of the lemma changes, so the identity holds for cubics as it stands. Simpson’s Rule is therefore exact on every cubic polynomial, one degree beyond the parabolas it was built from, and that extra degree is what the <em>fourth</em> derivative in the next theorem records.</p>

  <h3 class="subsec-head">Error bounds</h3>

  <p>An estimate is useful only when its error is controlled. The bending of \(f\) is what chords and rectangles cannot follow, so it is the size of the second derivative, and for Simpson’s Rule the fourth, that governs the error. Bounds for all three rules follow; each \(K\) exists whenever the named derivative is continuous, by the Extreme Value Theorem (Theorem 4.9(a)), and any valid bound serves in place of the exact maximum.</p>

  <section class="env env-theorem">
    <p class="env-head"><span class="env-kicker">Theorem</span><span class="env-num">8.4</span><span class="env-name">Error Bounds for Numerical Integration</span></p>
    <div class="env-body">
      <p>Suppose \(f''\) is continuous on \([a, b]\) and \(\lvert f''(x)\rvert \le K\) for all \(x\) in \([a, b]\). Then</p>
      <p>\[ \lvert E_{T}\rvert \le \frac{K\,(b - a)^{3}}{12\,n^{2}} \qquad\text{and}\qquad \lvert E_{M}\rvert \le \frac{K\,(b - a)^{3}}{24\,n^{2}}. \]</p>
      <p>If moreover \(f^{(4)}\) is continuous on \([a, b]\) and \(\lvert f^{(4)}(x)\rvert \le K_{4}\) there, then for even \(n\)</p>
      <p>\[ \lvert E_{S}\rvert \le \frac{K_{4}\,(b - a)^{5}}{180\,n^{4}}. \]</p>
    </div>
  </section>

  <!-- expansion:caution [source: SPEC §16.1 on-credit fence, unnumbered-Caution vehicle (Ch2 §2.4 precedent); ROADMAP seam-hunt premise "§8.7 誤差界需 Taylor (Ch11)" — the chapter's second and last credit; forward fence to Ch11 §11.9] -->

    </div>

  <!-- expansion:formula [pass: enrichment] [source: M4 Mode C gap-check 2026-07-27, candidate 8.7-b closing cross-check (the Theorem 8.4 route, = mode-c-gapwalk A's version, sourced APEX Calculus V5 sec_numerical_integration L1021–1027, CC BY-NC-SA). Kept OUTSIDE the fence Caution so the on-credit vehicle stays untouched (Mode C: add only). User adjudication 2026-07-27: adopt (T1).] -->
  <p>The theorem confirms the exactness noted above from the other direction: a cubic has \(f^{(4)} = 0\), so \(K_{4} = 0\) is a valid bound and the Simpson bound reads \(\lvert E_{S}\rvert \le 0\).</p>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.36</span></p>
      <div class="env-body">
        <p>How large must \(n\) be to guarantee that the Trapezoidal Rule approximates \(\displaystyle\int_{1}^{2}\frac{dx}{x}\) with error at most \(10^{-4}\)? How large for the Midpoint Rule?</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>For \(f(x) = 1/x\) we have \(f''(x) = 2/x^{3}\), which is positive and decreasing on \([1, 2]\), so \(\lvert f''(x)\rvert \le f''(1) = 2\), and \(K = 2\) serves. With \(b - a = 1\), Theorem 8.4 gives</p>
        <p>\[ \lvert E_{T}\rvert \le \frac{2}{12 n^{2}} = \frac{1}{6 n^{2}}, \]</p>
        <p>and \(\tfrac{1}{6n^{2}} \le 10^{-4}\) holds exactly when \(n^{2} \ge \tfrac{10^{4}}{6}\), that is, \(n \ge \sqrt{10^{4}/6} \approx 40.82\). Since \(n\) is a whole number and the requirement is a guarantee, round <em>up</em>: \(n = 41\) suffices. For the Midpoint Rule the same computation with the constant \(24\) gives \(n^{2} \ge \tfrac{10^{4}}{12}\), so \(n \ge \sqrt{10^{4}/12} \approx 28.87\), and \(n = 29\) suffices. Rounding down would break the guarantee: the bound at \(n = 40\) exceeds the tolerance. The bounds are worst-case: Example 8.34’s actual errors were smaller than Theorem 8.4 predicts, and that is the usual experience. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.37</span></p>
      <div class="env-body">
        <p>Approximate \(\displaystyle\int_{0}^{1} e^{-x^{2}}\,dx\) by Simpson’s Rule with \(n = 10\), and state how many decimal places the result is guaranteed to give.</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>The integrand is continuous on \([0, 1]\), so the integral exists (Theorem 6.1). What is missing is an antiderivative to hand to the Fundamental Theorem (Theorem 6.4): none of this book’s techniques produces one, which is why §8.5 set this integrand aside. The rules of this section do not need one.</p>
        <p>With \(n = 10\) the width is \(h = 0.1\), the nodes are \(0, 0.1, 0.2, \dots, 1\), and \(10\) is even, so (S) applies:</p>
        <p>\[ \begin{aligned}
          S_{10} = \frac{0.1}{3}\Bigl[e^{0} &+ 4e^{-0.01} + 2e^{-0.04} + \cdots \\
            &+ 2e^{-0.64} + 4e^{-0.81} + e^{-1}\Bigr] \approx 0.746825.
        \end{aligned} \]</p>
        <p>For the bound, differentiate four times. With \(f(x) = e^{-x^{2}}\), the chain rule (Theorem 3.3), the derivative of the exponential (Theorem 4.8), and the product rule (Theorem 2.6) give</p>
        <p>\[ f''(x) = \bigl(4x^{2} - 2\bigr)e^{-x^{2}}, \qquad f^{(4)}(x) = \bigl(16x^{4} - 48x^{2} + 12\bigr)e^{-x^{2}}. \]</p>
        <p>On \([0, 1]\) we have \(0 \le x^{2} \le 1\) and \(0 &lt; e^{-x^{2}} \le 1\). Bounding each term of the factor \(16x^{4} - 48x^{2} + 12\) separately, we find that it lies between \(0 - 48 + 12 = -36\) and \(16 - 0 + 12 = 28\). Since \(0 &lt; e^{-x^{2}} \le 1\), multiplying by \(e^{-x^{2}}\) cannot increase its absolute value, so \(\lvert f^{(4)}(x)\rvert \le 36\) throughout. Take \(K_{4} = 36\). The theorem requires a valid bound, not the exact maximum; a generous bound weakens the guarantee without invalidating it, and here it saves the work of locating the maximum exactly.</p>
        <p>Theorem 8.4 now gives, with \(b - a = 1\) and \(n = 10\),</p>
        <p>\[ \lvert E_{S}\rvert \le \frac{36 \cdot 1^{5}}{180 \cdot 10^{4}} = 2 \times 10^{-5}. \]</p>
        <p>The true value therefore lies between \(0.746805\) and \(0.746845\). Both ends round to \(0.7468\), so</p>
        <p>\[ \int_{0}^{1} e^{-x^{2}}\,dx = 0.7468 \]</p>
        <p>to four decimal places. Examples 8.34 and 8.35 measured their errors against a known value, \(\ln 2\). Here no such value is available, and the bound is the only statement of accuracy that can be made. It is still enough to name four decimal places, which is what the question asked for. <span class="qed"></span></p>
      </div>
    </section>
  </div>

  <div class="workedexample">
    <section class="env env-example">
      <p class="env-head"><span class="env-kicker">Example</span><span class="env-num">8.38</span></p>
      <div class="env-body">
        <p>A car’s speedometer is read every \(30\) seconds during a three-minute drive, giving speeds, in meters per second, of</p>
        <p>\[ 8, \quad 10, \quad 12, \quad 11, \quad 13, \quad 14, \quad 12 \]</p>
        <p>at \(t = 0, 30, 60, 90, 120, 150, 180\). Estimate the distance traveled.</p>
      </div>
    </section>
    <section class="env env-solution">
      <p class="env-head"><span class="env-kicker">Solution</span></p>
      <div class="env-body">
        <p>Distance is the integral of speed (the Net Change Theorem, Theorem 6.5), so the target is \(\int_{0}^{180} v(t)\,dt\) with \(v\) known only at seven equally spaced times. Seven values mean \(n = 6\) slices of width \(h = 30\), and \(6\) is even, so Simpson’s Rule applies:</p>
        <p>\[ \begin{aligned}
          S_{6} &= \frac{30}{3}\Bigl[8 + 4(10) + 2(12) + 4(11) + 2(13) + 4(14) + 12\Bigr] \\
            &= 10 \cdot 210 = 2100.
        \end{aligned} \]</p>
        <p>The estimated distance is \(2100\) meters, an average speed of about \(11.7\) m/s, or \(42\) km/h, consistent with the readings. Two honest notes are in order. There is no error bound to quote: Theorem 8.4 needs derivative information, and a data column carries none, so the estimate’s quality rests on the smoothness of the actual speed between readings. And the rule required nothing but arithmetic on the data, which is why numerical integration, not antidifferentiation, is what measurement-driven work uses. <span class="qed"></span></p>
      </div>
    </section>
  </div>

      <p>One of the integrals named at the start of this section still needs a comment. All three rules act on a finite interval, so \(\int_{1}^{\infty} e^{-x^{2}}\,dx\) cannot be handed to them as it stands. Split it instead: \(\int_{1}^{\infty} = \int_{1}^{t} + \int_{t}^{\infty}\), approximate the first piece by any of the rules, and bound the discarded tail. Example 8.32 supplies that bound already: its comparison \(e^{-x^{2}} \le e^{-x}\) holds for every \(x \ge 1\). Comparing on \([t, \infty)\), where \(\int_{t}^{\infty} e^{-x}\,dx = e^{-t}\), gives \(\int_{t}^{\infty} e^{-x^{2}}\,dx \le e^{-t}\) (Theorem 8.3(a)). The total error is then at most the rule’s error on \([1, t]\) plus that tail bound, and \(t\) is chosen large enough to make the tail as small as the target accuracy requires.</p>

  <h3 class="subsec-head">Chapter summary</h3>

  <!-- expansion:summary — chapter-closing summary per SPEC §4: named results in order with §-refs, the arc, the two credits, the forward fences (Ch11 §11.3 export; Ch11 §11.9 debt) -->
  <p>This chapter set out to finish what the Fundamental Theorem started: if evaluation reduces to antidifferentiation, then antidifferentiation needs a toolkit. Section 8.1 built the first tool from the product rule, integration by parts, \(\int u\,dv = uv - \int v\,du\) (Theorems 8.1 and 8.2), with a strategy for choosing the parts (Strategy 8.1) and, as a by-product, the settlement of Chapter 7’s shell-versus-washer question in the monotone case. Section 8.2 turned trigonometric identities into substitutions, filled the antiderivative table of §6.4 with \(\int\tan x\,dx = \ln\lvert\sec x\rvert + C\) and its companions (Proposition 8.1), and recorded \(\int\sec^{3}x\,dx\) for later use. Section 8.3 reparametrized quadratic radicals away with the three restricted substitutions of Strategy 8.4, and §8.4 sent every rational function through the pipeline of Strategy 8.5, dividing, factoring on the credit of the Fundamental Theorem of Algebra, decomposing by Proposition A.7, and integrating fragment by fragment, with \(\int\frac{dx}{x^{2}+a^{2}} = \frac{1}{a}\arctan\frac{x}{a} + C\) as the recurring final step. Section 8.5 compressed the toolkit into a four-step decision procedure (Strategy 8.6) and marked its boundary: some integrands, such as \(e^{-x^{2}}\), cannot be handled by any of it.</p>
  <p>The last two sections changed the question. Section 8.6 extended the integral itself to infinite intervals and unbounded integrands (Definitions 8.1 and 8.2), proved the \(p\)-test boundary \(\int_{1}^{\infty} x^{-p}\,dx\) convergent exactly for \(p &gt; 1\) (Proposition 8.2), and proved the Comparison Theorem (Theorem 8.3) with Chapter 4’s monotone-sequence principle, so that convergence can be certified without evaluation. Section 8.7 then produced the numbers: the Midpoint, Trapezoidal, and Simpson’s Rules (M), (T), (S), the last derived from the three-point parabola lemma, with error bounds (Theorem 8.4) that let us choose \(n\) in advance. The chapter closes with exactly two results taken on credit, both named where they were incurred: the real-factorization fact behind §8.4, borrowed permanently from algebra, and the proofs of Theorem 8.4, which Chapter 11’s Taylor theorem delivers. Chapter 11 also draws on this chapter directly: its Integral Test is built on Definition 8.1, Proposition 8.2, and Theorem 8.3. Before Chapter 11’s infinite series arrive, Chapter 9 puts the completed toolkit to work on equations whose unknowns are functions, where every solution method begins by asking the questions this chapter taught: what form is this, and which technique fits?</p>

        { type: "seg", x1: 3, y1: 0, x2: 3, y2: f(3), cls: "idline" },
        { type: "curve", fn: lin, domain: [1, 3], cls: "tangent" },
        { type: "curve", fn: f, domain: [0.9, 3.2], cls: "curve" }
      ];
      var pc = [
        { type: "area", fn: p1, domain: [1, 2], cls: "fill-pos" },
        { type: "seg", x1: 1, y1: 0, x2: 1, y2: 1, cls: "idline" },
        { type: "seg", x1: 2, y1: 0, x2: 2, y2: f(2), cls: "idline" },
        { type: "curve", fn: p1, domain: [1, 2], cls: "tangent" },
        { type: "curve", fn: p2, domain: [2, 3], cls: "secant" },
        { type: "curve", fn: f, domain: [0.9, 3.2], cls: "curve" },
        { type: "dot", x: 1, y: 1 }, { type: "dot", x: 1.5, y: f(1.5) }, { type: "dot", x: 2, y: f(2) },
        { type: "dot", x: 2.5, y: f(2.5), hollow: true }, { type: "dot", x: 3, y: f(3), hollow: true }
      ];
      return { layout: "triple", panels: [
        { svg: buildPlot(base(pa)), note: "Constants at the midpoints" },
        { svg: buildPlot(base(pb)), note: "Chords at the nodes" },
        { svg: buildPlot(base(pc)), note: "Parabolas through node triples" }
      ] };
    },

    /* §8.7 Figure 8.12 — midpoint rectangle = tangent trapezoid (equal areas; the drawing shows
       the tilt, the caption states the equality). Concave-up slice: tangent below the curve away
       from the point of tangency (M underestimates, E_M > 0), chord above (T overestimates).
       Placed AFTER Ex 8.33 per gate MODIFY. */
    "midpoint-tangent-trap": function () {
      var f = function (x) { return 1 / x; };
      var x0 = 1.15, x1 = 1.85, m = 1.5, fm = f(m), sl = -1 / (m * m);
      var tl = function (x) { return fm + sl * (x - m); };
      return { layout: "single", panels: [{ svg: buildPlot({
        w: 340, h: 235, xmin: 0.98, xmax: 2.1, ymin: -0.06, ymax: 1.05,
        xlabel: "x", ylabel: "", aria: "midpoint rectangle tilted into the tangent trapezoid",
        xticks: [{ x: x0, tex: "x_{i-1}" }, { x: m, tex: "\\bar{x}_{i}" }, { x: x1, tex: "x_{i}" }],
        yticks: [],
        items: [
          { type: "rect", x1: x0, x2: x1, y0: 0, y1: fm, cls: "rect-lo" },
          { type: "areaBetween", fnTop: tl, fnBot: function (x) { return fm; }, domain: [x0, m], cls: "fill-pos" },
          { type: "areaBetween", fnTop: function (x) { return fm; }, fnBot: tl, domain: [m, x1], cls: "fill-neg" },
          { type: "seg", x1: x0, y1: tl(x0), x2: x1, y2: tl(x1), cls: "tangent" },
          { type: "seg", x1: x0, y1: f(x0), x2: x1, y2: f(x1), cls: "secant" },

        ]
      }) }] };
    },

    /* §8.7 Figure 8.13 — Simpson on data (Ex 8.36): seven readings, three interpolating arcs
       meeting (possibly with corners) at the shared even nodes t = 60, 120; NO underlying curve
       (the truth between readings is unknown — that is the point). First triple is collinear
       (8,10,12): its "parabola" is honestly a straight segment. */
    "simpson-data-speed": function () {
      var ts = [0, 30, 60, 90, 120, 150, 180], vs = [8, 10, 12, 11, 13, 14, 12];
      var a1 = lag3(0, 8, 30, 10, 60, 12);
      var a2 = lag3(60, 12, 90, 11, 120, 13);
      var a3 = lag3(120, 13, 150, 14, 180, 12);
      var items = [
        { type: "area", fn: a1, domain: [0, 60], cls: "fill-area" },
        { type: "area", fn: a2, domain: [60, 120], cls: "fill-area" },
        { type: "area", fn: a3, domain: [120, 180], cls: "fill-area" },
        { type: "curve", fn: a1, domain: [0, 60], cls: "tangent" },
        { type: "curve", fn: a2, domain: [60, 120], cls: "tangent" },

      return { layout: "single", panels: [{ svg: buildPlot({
        w: 470, h: 235, xmin: -14, xmax: 200, ymin: -1.2, ymax: 18,
        xlabel: "t\\ (\\mathrm{s})", ylabel: "v\\ (\\mathrm{m/s})", aria: "speed readings with Simpson interpolating arcs",
        xticks: [{ x: 0 }, { x: 30 }, { x: 60 }, { x: 90 }, { x: 120 }, { x: 150 }, { x: 180 }],
        yticks: [{ y: 5 }, { y: 10 }, { y: 15 }],

    }
  };

  /* ---- hydrateFigures: fills every <figure data-fig="id"> ---- */
  function hydrateFigures(root) {
    (root || document).querySelectorAll("[data-fig]").forEach(function (el) {
      var def = FIGS[el.dataset.fig];
      if (!def || el.dataset.figDone) return;
      var r = def();
      var layout = r.layout, panels = r.panels;
      var html;
      if (layout === "single" && panels.length === 1 && !panels[0].note) {
        html = '<div class="figure-art">' + panels[0].svg + '</div>';
      } else {
        var cls = { pair: "figure-art--pair", triple: "figure-art--triple", grid: "figure-art--grid" }[layout] || "";
        html = '<div class="figure-art ' + cls + '">' +
          panels.map(function (p) {
            return '<div class="fig-panel">' + p.svg + (p.note ? '<div class="fig-note">' + p.note + '</div>' : '') + '</div>';
          }).join("") + '</div>';
      }
      el.insertAdjacentHTML("afterbegin", html);
      el.dataset.figDone = "1";
    });
  }
  window.hydrateFigures = hydrateFigures;
})();

<!-- Main build script (paginator + MathJax) -->
<script>
var CHAPTER = {
  brand: "Chapter 8 — Techniques of Integration",
  runningHead: "Chapter 8 · Techniques of Integration",
  fragments: ["sec-8-1", "sec-8-2", "sec-8-3", "sec-8-4", "sec-8-5", "sec-8-6", "sec-8-7"],
};
var FRAGMENTS = CHAPTER.fragments;
var RUNNING_HEAD = CHAPTER.runningHead;

function renderMath(root) {
  if (!root) return Promise.resolve();
  if (window.MathJax && window.MathJax.typesetPromise) {
    return MathJax.typesetPromise([root]).catch(function(e) { console.warn("mathjax", e); });
  }
  return Promise.resolve();
}

function waitFor(test, tries) {
  return new Promise(function(resolve) {
    var n = 0;
    var tick = function() {
      if (test()) return resolve(true);
      if (n++ > (tries || 100)) return resolve(false);
      setTimeout(tick, 50);
    };
    tick();
  });
}

var isHeading = function(el) {
  return el.matches && el.matches(".chapter-head, .sec-head, .subsec-head, .para-head, .env-head");
};

function isDisplayChild(n) {
  if (n.nodeType !== 1) return false;
  var tag = n.tagName && n.tagName.toLowerCase();
  if (tag === "mjx-container" && n.getAttribute("display") === "true") return true;
  if (n.querySelector && n.querySelector('mjx-container[display="true"]')) return true;
  return false;
}

var SPLIT_ENVS = ".env-example, .env-solution, .env-proof, .env-definition, .env-theorem, .env-proposition, .env-corollary";
var DISP_SEL = 'mjx-container[display="true"]';

function liCount(el) { return [].filter.call(el.children, function(x) { return x.tagName === "LI"; }).length; }

function countBodyUnits(bodyEl) {
  var n = 0;
  [].forEach.call(bodyEl.children, function(ch) {
    if (ch.tagName === "P" && ch.querySelector(DISP_SEL)) n += explodeParagraph2(ch);
    else if ((ch.tagName === "OL" || ch.tagName === "UL") && liCount(ch) >= 2) n += liCount(ch);
    else n++;
  });
  return n;
}

function isSplittable(block) {
  if (!block.classList) return false;
  if (block.classList.contains("workedexample")) return block.children.length >= 2;
  if (block.matches(SPLIT_ENVS)) {
    var b = block.querySelector(":scope > .env-body");
    return !!b && countBodyUnits(b) > 1;
  }
  if (block.tagName === "P" && block.querySelector(DISP_SEL)) {
    return explodeParagraph2(block) > 1;
  }
  return false;
}

function onlyLists(bodyEl) {
  var els = contentKids(bodyEl);
  return els.length > 0 && els.every(function(c) { return c.tagName === "OL" || c.tagName === "UL"; });
}

function contentKids(bodyEl) {
  return [].filter.call(bodyEl.children, function(c) {
    return !(c.classList && c.classList.contains("qed")) && (c.textContent.trim() || c.querySelector("*"));
  });
}

function splitMode(block) {
  if (!block.classList) return "none";
  if (block.classList.contains("workedexample")) return block.children.length >= 2 ? "free" : "none";
  if (block.matches(SPLIT_ENVS)) {
    var b = block.querySelector(":scope > .env-body");
    if (!b || countBodyUnits(b) <= 1) return "none";
    var kids = contentKids(b);
    var hasPara = kids.some(function(c) {
      return c.tagName === "P" && c.querySelector(DISP_SEL) && explodeParagraph2(c) > 1;
    });
    if (hasPara || (kids.length >= 2 && !kids.every(function(c) { return c.tagName === "OL" || c.tagName === "UL"; }))) return "free";
    return "list";
  }
  if (block.tagName === "P" && block.querySelector(DISP_SEL) && explodeParagraph2(block) > 1) return "free";
  return "none";
}

function explodeParagraph2(p) {
  var n = 0, hasBuf = false;
  [].forEach.call(p.childNodes, function(node) {
    if (isDisplayChild(node)) {
      if (hasBuf) { n++; hasBuf = false; }
      n++;
    } else if ((node.textContent && node.textContent.trim()) || node.nodeType === 1) {
      hasBuf = true;
    }
  });
  if (hasBuf) n++;
  return n;
}

function explodeParagraph(p) {
  var parts = [], buf = [];
  var flush = function() {
    var hasContent = buf.some(function(n) { return (n.textContent && n.textContent.trim()) || n.nodeType === 1; });
    if (hasContent) {
      var np = document.createElement("p");
      np.className = p.className;
      buf.forEach(function(n) { np.appendChild(n); });
      parts.push(np);
    } else {
      buf.forEach(function(n) { if (n.parentNode) n.parentNode.removeChild(n); });
    }
    buf = [];
  };
  [].slice.call(p.childNodes).forEach(function(node) {
    if (isDisplayChild(node)) { flush(); var np = document.createElement("p"); np.className = p.className; np.appendChild(node); parts.push(np); }
    else { buf.push(node); }
  });
  flush();
  return parts;
}

function listToUnits(listEl) {
  var items = [].filter.call(listEl.children, function(x) { return x.tagName === "LI"; });
  if (items.length < 2) return [listEl];
  var tag = listEl.tagName.toLowerCase();
  return items.map(function(li, i) {
    var nl = document.createElement(tag);
    nl.className = listEl.className;
    if (tag === "ol") nl.setAttribute("start", String(i + 1));
    nl.appendChild(li);
    return nl;
  });
}

function bodyToUnits(bodyEl) {
  var units = [];
  [].forEach.call(bodyEl.children, function(ch) {
    if (ch.tagName === "P" && ch.querySelector(DISP_SEL) && explodeParagraph2(ch) > 1) {
      explodeParagraph(ch).forEach(function(u) { units.push(u); });
    } else if ((ch.tagName === "OL" || ch.tagName === "UL") && liCount(ch) >= 2) {
      listToUnits(ch).forEach(function(u) { units.push(u); });
    } else { units.push(ch); }
  });
  return units;
}

function splitEnvOverflow(env) {
  var bodyEl = env.querySelector(":scope > .env-body");
  if (!bodyEl) return null;
  var kids = bodyToUnits(bodyEl);
  if (kids.length < 2) return null;
  bodyEl.innerHTML = "";
  bodyEl.appendChild(kids.shift());
  var parts = [env];
  kids.forEach(function(k) {
    if (k.classList && k.classList.contains("qed") && parts.length > 0) {
      var prev = parts[parts.length - 1];
      var prevBody = prev.querySelector(":scope > .env-body") || prev.querySelector(".env-body");
      if (prevBody) { prevBody.appendChild(k); return; }
    }
    var cont = document.createElement("section");
    cont.className = env.className + " env-cont";
    var b = document.createElement("div");
    b.className = "env-body";
    b.appendChild(k);
    cont.appendChild(b);
    parts.push(cont);
  });
  return parts;
}

function splitParts(block) {
  if (block.classList.contains("workedexample")) return [].slice.call(block.children);
  if (block.matches(SPLIT_ENVS)) return splitEnvOverflow(block) || [block];
  if (block.tagName === "P") { var ex = explodeParagraph(block); return ex.length > 1 ? ex : [block]; }
  return [block];
}

function paginate(blocks) {
  var pagesEl = document.getElementById("pages");
  pagesEl.innerHTML = "";
  var idx = 0, body = null;
  var newSheet = function() {
    var sheet = document.createElement("div");
    sheet.className = "sheet";
    var header = document.createElement("div");
    header.className = "sheet-header";
    header.textContent = idx === 0 ? "" : RUNNING_HEAD;
    body = document.createElement("div");
    body.className = "sheet-body paper skin-hs vivid";
    var footer = document.createElement("div");
    footer.className = "sheet-footer";
    footer.textContent = String(idx + 1);
    sheet.append(header, body, footer);
    pagesEl.appendChild(sheet);
    idx++;
  };
  newSheet();
  var fits = function() { return body.scrollHeight <= body.clientHeight + 1; };
  var FREE_THRESHOLD = 130;
  var moveToFreshPage = function(block) {
    var carry = null;
    if (body.childElementCount > 0) {
      var last = body.lastElementChild;
      if (last && isHeading(last)) { carry = last; body.removeChild(last); }
      newSheet();
      if (carry) body.appendChild(carry);
    }
    body.appendChild(block);
  };
  var place = function(block) {
    body.appendChild(block);
    if (fits()) {
      if (isHeading(block) && body.childElementCount > 1) {
        var _bRect = block.getBoundingClientRect();
        var _bodyRect = body.getBoundingClientRect();
        var _rem = (_bodyRect.top + body.clientHeight) - _bRect.bottom;
        var _threshold = block.matches(".sec-head, .chapter-head") ? 160 : 100;
        if (_rem < _threshold) {
          body.removeChild(block);
          newSheet();
          body.appendChild(block);
        }
      }
      return;
    }
    var blockH = block.getBoundingClientRect().height;

    var isFigure = block.tagName === "FIGURE" || (block.classList && block.classList.contains("figure"));
    var _figArt = isFigure ? block.querySelector(".figure-art") : null;
    var _artH = 0, _capH = 0;
    if (_figArt) {
      _artH = _figArt.getBoundingClientRect().height;
      var _figCap = block.querySelector("figcaption");
      _capH = _figCap ? _figCap.getBoundingClientRect().height : 0;
    }

    body.removeChild(block);

    if (_figArt && _artH > 0) {
      var _probe = document.createElement("div");
      _probe.style.height = "0"; _probe.style.margin = "0"; _probe.style.padding = "0";
      body.appendChild(_probe);
      var _remaining = body.clientHeight - (_probe.getBoundingClientRect().top - body.getBoundingClientRect().top);
      body.removeChild(_probe);
      var FIG_MIN_SCALE = 0.55;
      var _figMargin = blockH - _artH - _capH;
      var _availForArt = _remaining - _capH - _figMargin;
      var neededScale = _availForArt / _artH;
      if (_availForArt > 60 && neededScale >= FIG_MIN_SCALE && neededScale < 1) {
        var _oZ = _figArt.style.zoom;
        var _oMt = block.style.marginTop, _oMb = block.style.marginBottom;
        _figArt.style.zoom = neededScale;
        block.style.marginTop = "0.3em"; block.style.marginBottom = "0";
        body.appendChild(block);
        if (fits()) return;
        body.removeChild(block);
        _figArt.style.zoom = _oZ;
        block.style.marginTop = _oMt; block.style.marginBottom = _oMb;
      }
    }

    if (block.classList.contains && block.classList.contains("workedexample") && block.children.length >= 2) {
      var lastEl = body.lastElementChild;
      var used = lastEl ? lastEl.getBoundingClientRect().bottom - body.getBoundingClientRect().top : 0;
      var remaining = body.clientHeight - used;
      if (remaining < FREE_THRESHOLD && blockH <= body.clientHeight) {
        moveToFreshPage(block);
        if (fits()) return;
        body.removeChild(block);
      }
      var kids = [].slice.call(block.children);
      var ex = kids[0], sol = kids[1], extra = kids.slice(2);
      block.removeChild(ex);
      var solParts = splitParts(sol);
      body.appendChild(ex);
      if (!fits()) { body.removeChild(ex); moveToFreshPage(ex); }
      var first = solParts[0];
      body.appendChild(first);
      if (!fits()) {
        body.removeChild(first);
        body.removeChild(ex);
        moveToFreshPage(ex);
        body.appendChild(first);
        if (!fits()) { body.removeChild(first); place(first); }
      }
      for (var i = 1; i < solParts.length; i++) place(solParts[i]);
      extra.forEach(place);
      return;
    }
    var mode = splitMode(block);
    var remainingAtInsert = 0;
    if (mode !== "none") {
      var splitProbe = document.createElement("div");
      splitProbe.style.height = "0"; splitProbe.style.margin = "0"; splitProbe.style.padding = "0";
      body.appendChild(splitProbe);
      remainingAtInsert = body.clientHeight - (splitProbe.getBoundingClientRect().top - body.getBoundingClientRect().top);
      body.removeChild(splitProbe);
    }
    var want = (mode !== "none" && (blockH > body.clientHeight || remainingAtInsert >= FREE_THRESHOLD));
    if (want) { var parts = splitParts(block); if (parts.length > 1) { parts.forEach(place); return; } }
    moveToFreshPage(block);
    if (!fits() && mode !== "none") {
      var parts2 = splitParts(block);
      if (parts2.length > 1) { body.removeChild(block); parts2.forEach(place); }
    }
  };
  blocks.forEach(place);
  return idx;
}

function build() {
  var status = document.getElementById("status");

  /* Load section fragments from inline <template> elements */
  var page = document.getElementById("page");
  var parts = FRAGMENTS.map(function(id) {
    var tpl = document.getElementById("frag-" + id);
    return tpl ? tpl.innerHTML : "";
  });
  page.innerHTML = parts.join("\n");

  if (window.hydrateFigures) window.hydrateFigures(page);

  /* Wait for MathJax to load, then typeset */
  waitFor(function() { return window.MathJax && window.MathJax.typesetPromise; }, 200).then(function(ok) {
    if (!ok) { status.textContent = "MathJax load timeout"; return; }
    return renderMath(page);
  }).then(function() {
    var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    return fontsReady;
  }).then(function() {
    status.textContent = "Paginating …";
    return new Promise(function(r) { setTimeout(r, 60); });
  }).then(function() {
    var blocks = [];
    page.querySelectorAll(":scope > .sec").forEach(function(sec) {
      [].forEach.call(sec.children, function(ch) { blocks.push(ch); });
    });

    var n = paginate(blocks);
    var src = document.getElementById("source");
    if (src) src.remove();

    status.textContent = n + " page" + (n === 1 ? "" : "s") + " · A4";
    var btn = document.getElementById("printBtn");
    btn.disabled = false;
    btn.addEventListener("click", function() { window.print(); });

    var boot = document.getElementById("boot");
    if (boot) boot.remove();
  });
}

window.addEventListener("DOMContentLoaded", build);
</script>
